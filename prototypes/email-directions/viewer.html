<!doctype html>
<!-- PROTOTYPE, throwaway: viewer for the HTML mail directions. Not product code. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE - mail directions</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #d9dde3; color: #111; }
  body.darkpage { background: #2a2f36; color: #eee; }
  .stage { display: flex; gap: 24px; justify-content: center; align-items: flex-start; padding: 24px 16px 120px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .col h2 { margin: 0; font-size: 13px; font-weight: 600; opacity: .75; }
  .meta { width: 100%; font-size: 12px; background: #fff; color: #333; border-radius: 6px 6px 0 0; padding: 8px 12px; box-sizing: border-box; }
  .meta b { color: #000; }
  iframe { border: 0; background: #fff; display: block; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
  .bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center;
         background: #111; color: #fff; padding: 8px 10px; border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.35); z-index: 10; flex-wrap: wrap; justify-content: center; max-width: 96vw; }
  .bar button { background: #2b2b2b; color: #fff; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; }
  .bar button.on { background: #ffcf33; color: #111; font-weight: 700; }
  .bar .label { min-width: 150px; text-align: center; font-weight: 700; }
  .bar .sep { width: 1px; height: 20px; background: #444; margin: 0 4px; }
  .note { position: fixed; top: 8px; left: 8px; font-size: 11px; background: #ffcf33; color: #111; padding: 3px 8px; border-radius: 4px; }
</style>
</head>
<body>
<div class="note">PROTOTYPE - throwaway mail directions</div>
<div class="stage" id="stage"></div>
<div class="bar" id="bar"></div>
<script>
const NAMES = { A: "Card", B: "Ticket", C: "Letter" };
const KEYS = Object.keys(NAMES);
const SUBJ = {
  sale: { en: "Your tickets for Noches de Altamar", es: "Sus entradas para Noches de Altamar" },
  digest: { en: "What's on from the things you follow", es: "Novedades de lo que usted sigue" },
};
const DEF = { v: "A", mail: "sale", loc: "es", mode: "light", w: "desktop", img: "on", cmp: "off" };
const q = new URLSearchParams(location.search);
const st = Object.fromEntries(Object.keys(DEF).map(k => [k, q.get(k) || DEF[k]]));

function set(patch) {
  Object.assign(st, patch);
  const u = new URLSearchParams(st);
  history.replaceState(null, "", "?" + u);
  render();
}

function lum(r, g, b) {
  const f = c => { c /= 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); };
  return .2126 * f(r) + .7152 * f(g) + .0722 * f(b);
}
function parse(c) { const m = c.match(/rgba?\(([^)]+)\)/); if (!m) return null; const p = m[1].split(",").map(Number); return p.length > 3 && p[3] === 0 ? null : p; }

// Gmail (iOS/Android app) "full inversion", approximated: light backgrounds go
// dark and dark text goes light; background-image and <img> are left alone.
// Lightness is flipped in HSL, so hue survives (a blue link stays blue).
function flipL([r, g, b], floor) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  const nl = Math.max(floor, 1 - l);
  return `hsl(${h.toFixed(0)},${(s * 100).toFixed(0)}%,${(nl * 100).toFixed(0)}%)`;
}
function gmailInvert(d) {
  d.querySelectorAll("*").forEach(el => {
    const cs = d.defaultView.getComputedStyle(el);
    const bg = parse(cs.backgroundColor);
    if (bg && cs.backgroundImage === "none" && lum(...bg) > 0.4) el.style.setProperty("background-color", flipL(bg, .08), "important");
    const fg = parse(cs.color);
    if (fg && lum(...fg) < 0.25) el.style.setProperty("color", flipL(fg, .65), "important");
    ["Top", "Right", "Bottom", "Left"].forEach(side => {
      const bc = parse(cs[`border${side}Color`]);
      if (bc && parseFloat(cs[`border${side}Width`]) > 0 && cs.backgroundImage === "none" && lum(...bc) > 0.5)
        el.style.setProperty(`border-${side.toLowerCase()}-color`, "#3a3f46", "important");
    });
  });
}

function prepare(frame) {
  const d = frame.contentDocument;
  if (st.mode === "dark") {
    // The same CSS the mail ships under prefers-color-scheme: dark, forced on.
    const css = d.querySelector("style").textContent;
    const m = css.match(/prefers-color-scheme:dark\)\{([\s\S]*?)\/\*end-dark\*\//);
    const s = d.createElement("style"); s.textContent = m ? m[1] : ""; d.head.appendChild(s);
  }
  if (st.mode === "gmail") gmailInvert(d);
  if (st.img === "off") {
    d.querySelectorAll("img").forEach(i => {
      if (i.alt) { const span = d.createElement("span"); span.textContent = i.alt; span.style.cssText = "font:12px sans-serif;color:#888"; i.replaceWith(span); }
      else i.remove();
    });
  }
  const fit = () => { frame.style.height = d.documentElement.scrollHeight + "px"; };
  fit(); setTimeout(fit, 150);
}

function frame(v) {
  const col = document.createElement("div"); col.className = "col";
  const width = st.w === "mobile" ? 375 : 680;
  const h = document.createElement("h2"); h.textContent = `${v} - ${NAMES[v]}`; col.appendChild(h);
  const meta = document.createElement("div"); meta.className = "meta"; meta.style.width = width + "px";
  meta.innerHTML = `<b>Multiticketing</b> &lt;no-reply@multiticketing.com&gt;<br>Subject: <b>${SUBJ[st.mail][st.loc]}</b>`;
  col.appendChild(meta);
  const f = document.createElement("iframe");
  f.style.width = width + "px";
  f.src = `${v}-${st.mail}-${st.loc}.html`;
  f.onload = () => prepare(f);
  col.appendChild(f);
  return col;
}

function btn(label, on, fn) { const b = document.createElement("button"); b.textContent = label; if (on) b.className = "on"; b.onclick = fn; return b; }
function sep() { const s = document.createElement("span"); s.className = "sep"; return s; }

function cycle(dir) { const i = KEYS.indexOf(st.v); set({ v: KEYS[(i + dir + KEYS.length) % KEYS.length] }); }

function render() {
  document.body.classList.toggle("darkpage", st.mode !== "light");
  const stage = document.getElementById("stage"); stage.innerHTML = "";
  (st.cmp === "on" ? KEYS : [st.v]).forEach(v => stage.appendChild(frame(v)));
  const bar = document.getElementById("bar"); bar.innerHTML = "";
  bar.append(btn("←", false, () => cycle(-1)));
  const l = document.createElement("span"); l.className = "label"; l.textContent = st.cmp === "on" ? "A B C side by side" : `${st.v} (${NAMES[st.v]})`; bar.append(l);
  bar.append(btn("→", false, () => cycle(1)), sep());
  bar.append(btn("Sale Confirmation", st.mail === "sale", () => set({ mail: "sale" })), btn("Follow Digest", st.mail === "digest", () => set({ mail: "digest" })), sep());
  bar.append(btn("ES", st.loc === "es", () => set({ loc: "es" })), btn("EN", st.loc === "en", () => set({ loc: "en" })), sep());
  bar.append(btn("Light", st.mode === "light", () => set({ mode: "light" })), btn("Dark (Apple)", st.mode === "dark", () => set({ mode: "dark" })), btn("Gmail invert", st.mode === "gmail", () => set({ mode: "gmail" })), sep());
  bar.append(btn("Desktop", st.w === "desktop", () => set({ w: "desktop" })), btn("375px", st.w === "mobile", () => set({ w: "mobile" })), sep());
  bar.append(btn(st.img === "on" ? "Images on" : "Images blocked", st.img === "off", () => set({ img: st.img === "on" ? "off" : "on" })));
  bar.append(btn("Compare", st.cmp === "on", () => set({ cmp: st.cmp === "on" ? "off" : "on" })));
}

document.addEventListener("keydown", ev => {
  if (ev.target.closest && ev.target.closest("input,textarea,[contenteditable]")) return;
  if (ev.key === "ArrowLeft") cycle(-1);
  if (ev.key === "ArrowRight") cycle(1);
});
render();
</script>
</body>
</html>

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go-test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          # The module is in backend/, not at the repository root, where
          # setup-go looks by default; without this the cache never restores.
          cache-dependency-path: backend/go.sum

      # Deliberately `make ci-go` and not `go test ./...`: two packages own a
      # Postgres testcontainer and cannot be in flight at once. The target holds
      # that rule so this file and the Makefile cannot disagree about it.
      - name: Run Go vet and tests
        run: make ci-go

  js-checks:
    name: JS checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, and build
        run: pnpm turbo lint typecheck build

      # Every workspace's unit tests, minus @ticket-pos/e2e: its `test` script is
      # Playwright driving a browser against a stack that has to already be up
      # (`make dev`), so on a runner with nothing listening it fails for reasons
      # that are about the runner and not the code. The dev-server and parity
      # suites are run against a real deployment, not here.
      - name: Test
        run: pnpm turbo test --filter='!@ticket-pos/e2e'

  openapi-sync:
    name: OpenAPI sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          # No Go cache here. setup-go keys its cache on go.sum alone, so this
          # job and Go test would share one key, and this job finishes first:
          # it would save a cache holding only modules and its swag build, and
          # Go test's much larger build and test cache would then fail to
          # reserve the key and be thrown away on every run. Go test owns the
          # key; this job is short enough to download its modules afresh.
          cache: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI spec and client sync
        run: make openapi-sync-check

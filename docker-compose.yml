services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ticket_pos
      POSTGRES_PASSWORD: ticket_pos
      POSTGRES_DB: ticket_pos
    ports:
      - "64432:5432"
    volumes:
      # Postgres 18 images keep PGDATA at /var/lib/postgresql/<major>/docker,
      # so the whole /var/lib/postgresql tree is the persisted path.
      - postgres_data_18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_pos -d ticket_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "64900:9000"
      - "64901:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_SERVER_URL: http://localhost:64900
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb local/ticket-pos --ignore-existing &&
      mc anonymous set download local/ticket-pos/covers &&
      mc anonymous set download local/ticket-pos/videos &&
      mc anonymous set download local/ticket-pos/logos &&
      mc anonymous set download local/ticket-pos/avatars
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "64080:8080"
    volumes:
      - ./backend:/app
      - backend_go_mod_cache:/go/pkg/mod
    environment:
      DATABASE_URL: postgres://ticket_pos:ticket_pos@postgres:5432/ticket_pos?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:64900
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: ticket-pos
      S3_REGION: us-east-1
      # Compose reads the root .env for these. Empty RESEND_API_KEY (the default)
      # keeps the backend on the logging email sender; set it in .env to send real
      # mail via Resend from the dev stack. See .env.example.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Multiticketing <noreply@send.multiticketing.com>}
      # The Follow Digest's own sending identity (#225, ADR 0030). Empty by
      # default and with NO fallback to the two above — the Digest is marketing
      # mail and may not borrow the transactional domain. Empty here is harmless
      # locally: with no RESEND_API_KEY the whole stack is on the logging sender,
      # so Digests print to the container log like everything else.
      DIGEST_RESEND_API_KEY: ${DIGEST_RESEND_API_KEY:-}
      DIGEST_EMAIL_FROM: ${DIGEST_EMAIL_FROM:-}
      DIGEST_EMAIL_ALLOW_SHARED_DOMAIN: ${DIGEST_EMAIL_ALLOW_SHARED_DOMAIN:-}
      # The Issuer's certificate key (#453, ADR 0059), from the root .env: 32
      # bytes as base64, `openssl rand -base64 32`. Empty (the default) leaves
      # the API up and only certificate upload and signing unavailable.
      INVOICING_CERTIFICATE_KEY: ${INVOICING_CERTIFICATE_KEY:-}
      # Ticket Question authoring (#309, ADR 0045). Empty by default, which
      # leaves the staff surface hidden and every one of its endpoints answering
      # 404 — the shipped state. Set TICKET_QUESTIONS_ENABLED=true in the root
      # .env to work on the feature locally. Doing the same in production is a
      # decision ADR 0045 was written to prevent being taken casually: it must
      # wait for a Policy Version that describes the collection.
      TICKET_QUESTIONS_ENABLED: ${TICKET_QUESTIONS_ENABLED:-}
      # Ticket Assignment (#324, parent #322). ITS OWN VARIABLE, separate from
      # the one above: assignment can be worked on, or killed, without taking
      # Ticket Questions with it. Empty by default, which leaves the buyer's
      # assign endpoint answering 404 and the buyer's payload byte-identical to
      # a build without the feature — the shipped state. Set
      # TICKET_ASSIGNMENT_ENABLED=true in the root .env to work on it locally.
      # In production it waits on a Policy Version describing the platform
      # storing and mailing an address one person supplied for another.
      TICKET_ASSIGNMENT_ENABLED: ${TICKET_ASSIGNMENT_ENABLED:-}
      # Sale Invoicing (#471, ADR 0060): the platform's Issuer invoicing the
      # buyer of every paid Online Sale of a House Organization. Empty by
      # default — no House designation, nothing owed, the Drainer answering
      # 404 — the shipped state. Set SALE_INVOICING_ENABLED=true in the root
      # .env to work on it locally. In production it waits on an Issuer in
      # `production` with a live certificate: what it opens is the platform
      # declaring sales to the SRI.
      SALE_INVOICING_ENABLED: ${SALE_INVOICING_ENABLED:-}
      # The `development` Google OAuth client, also from the root .env. Empty (the
      # default) leaves Google Sign-In off and the button hidden; passcode
      # sign-in is unaffected either way. GOOGLE_TOKEN_ENDPOINT is deliberately
      # not passed — it is a test-only override and a production footgun.
      GOOGLE_STAFF_CLIENT_ID: ${GOOGLE_STAFF_CLIENT_ID:-}
      GOOGLE_STAFF_CLIENT_SECRET: ${GOOGLE_STAFF_CLIENT_SECRET:-}
      GOOGLE_STOREFRONT_CLIENT_ID: ${GOOGLE_STOREFRONT_CLIENT_ID:-}
      GOOGLE_STOREFRONT_CLIENT_SECRET: ${GOOGLE_STOREFRONT_CLIENT_SECRET:-}
      # PayPhone merchant credentials, also from the root .env. Both empty (the
      # default) selects the stub Payment Provider, so checkout works with zero
      # setup; set BOTH — SANDBOX credentials, never production ones — to charge
      # through real PayPhone from the dev stack (see
      # docs/manual-verification-payphone.md). PAYPHONE_API_BASE_URL is
      # deliberately not passed — it is a test-only override and a production
      # footgun, exactly like GOOGLE_TOKEN_ENDPOINT above.
      PAYPHONE_API_TOKEN: ${PAYPHONE_API_TOKEN:-}
      PAYPHONE_STORE_ID: ${PAYPHONE_STORE_ID:-}
      # The Platform Fee schedule in basis points (ADR 0014). Unset falls back to
      # the launch rates the API defaults to, so the dev stack charges what
      # production charges; override in .env to try another rate locally.
      PLATFORM_FEE_BASIS_POINTS: ${PLATFORM_FEE_BASIS_POINTS:-}
      PLATFORM_FEE_IVA_BASIS_POINTS: ${PLATFORM_FEE_IVA_BASIS_POINTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # The three Node services below run as the developer, not as root (#513
  # follow-up). They mount the repository and `next dev` writes into it —
  # apps/*/.next, and the workspaces' node_modules/.bin shims — so running
  # them as root leaves a tree the host cannot write: `pnpm install` and
  # `next build` then die EACCES minutes into a run, which is what
  # `make ci-preflight` exists to catch. UID and GID default to 1000, the
  # `node` user in these images and the first login account on Linux;
  # override in .env if yours differ. HOME must be set with them, because
  # the image's own HOME is /root and npm needs a cache it can write.
  #
  # node-modules-owner hands the named volume over before anything uses it:
  # Docker creates a volume root-owned whatever `user:` says, and a stack
  # that ran as root before this change has one full of root-owned files.
  # Recursive, once — the guard is what keeps every later `make dev` fast.
  node-modules-owner:
    image: alpine:3
    # The same two values the services below take, handed to the shell that
    # does the chown: an override in .env has to reach both or the volume is
    # given to the wrong uid.
    environment:
      DEV_UID: ${DEV_UID:-1000}
      DEV_GID: ${DEV_GID:-1000}
    volumes:
      - root_node_modules:/app/node_modules
    command: >
      sh -c "[ \"$$(stat -c %u /app/node_modules)\" = \"$${DEV_UID:-1000}\" ] ||
      chown -R $${DEV_UID:-1000}:$${DEV_GID:-1000} /app/node_modules"

  install:
    image: node:26-alpine
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /home/node
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
    command: >
      sh -c "npx --yes pnpm@9.15.4 install"
    depends_on:
      node-modules-owner:
        condition: service_completed_successfully

  storefront:
    image: node:26-alpine
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
    command: >
      sh -c "npx --yes pnpm@9.15.4 --filter @ticket-pos/storefront exec next dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "64300:3000"
    environment:
      # Set with `user:` above: the image's HOME is /root, which the
      # developer's uid cannot write, and npx needs a cache.
      HOME: /home/node
      API_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: http://localhost:64080
      # The PUBLISHED origin again, for the same reason the redirect URI below
      # uses it: this is the address a browser is at. Without it the SEO surface
      # is half-off in dev and silently so — /sitemap.xml is a valid, empty
      # document and robots.txt drops its Sitemap line, because neither may
      # publish a relative address (apps/storefront/lib/site.ts). The parity
      # stack already sets it; dev was the one place a crawler-facing route
      # could not be looked at.
      STOREFRONT_BASE_URL: http://localhost:64300
      # The staff app's PUBLISHED origin (64301), for the footer's "Create an
      # event" invitation. The published port, not the container port, because
      # this address is followed by a browser. Set here so a developer walking
      # the invitation lands on their own staff app and never on production.
      STAFF_BASE_URL: http://localhost:64301
      # The public half of the dev OAuth client. The redirect URI is the
      # PUBLISHED port (64300), not the container port — it is what the browser
      # follows, and it must match the Console registration byte for byte.
      GOOGLE_CLIENT_ID: ${GOOGLE_STOREFRONT_CLIENT_ID:-}
      GOOGLE_REDIRECT_URI: http://localhost:64300/api/customer/auth/google/callback
    depends_on:
      backend:
        condition: service_started
      install:
        condition: service_completed_successfully

  staff:
    image: node:26-alpine
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
    command: >
      sh -c "npx --yes pnpm@9.15.4 --filter @ticket-pos/staff exec next dev --hostname 0.0.0.0 --port 3001"
    ports:
      - "64301:3001"
    environment:
      # Set with `user:` above: the image's HOME is /root, which the
      # developer's uid cannot write, and npx needs a cache.
      HOME: /home/node
      API_URL: http://backend:8080
      GOOGLE_CLIENT_ID: ${GOOGLE_STAFF_CLIENT_ID:-}
      GOOGLE_REDIRECT_URI: http://localhost:64301/api/auth/google/callback
    depends_on:
      backend:
        condition: service_started
      install:
        condition: service_completed_successfully

volumes:
  postgres_data_18:
  minio_data:
  root_node_modules:
  backend_go_mod_cache:

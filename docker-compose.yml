services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticket_pos
      POSTGRES_PASSWORD: ticket_pos
      POSTGRES_DB: ticket_pos
    ports:
      - "64432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_pos -d ticket_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "64900:9000"
      - "64901:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_SERVER_URL: http://localhost:64900
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb local/ticket-pos --ignore-existing &&
      mc anonymous set download local/ticket-pos/covers &&
      mc anonymous set download local/ticket-pos/logos
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "64080:8080"
    volumes:
      - ./backend:/app
      - backend_go_mod_cache:/go/pkg/mod
    environment:
      DATABASE_URL: postgres://ticket_pos:ticket_pos@postgres:5432/ticket_pos?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:64900
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: ticket-pos
      S3_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  install:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
    command: >
      sh -c "corepack enable &&
      corepack prepare pnpm@9.15.4 --activate &&
      pnpm install"

  storefront:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
    command: >
      sh -c "corepack enable &&
      corepack prepare pnpm@9.15.4 --activate &&
      pnpm --filter @ticket-pos/storefront exec next dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "64300:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:64080
    depends_on:
      backend:
        condition: service_started
      install:
        condition: service_completed_successfully

  staff:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
    command: >
      sh -c "corepack enable &&
      corepack prepare pnpm@9.15.4 --activate &&
      pnpm --filter @ticket-pos/staff exec next dev --hostname 0.0.0.0 --port 3001"
    ports:
      - "64301:3001"
    environment:
      API_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_started
      install:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
  root_node_modules:
  backend_go_mod_cache:

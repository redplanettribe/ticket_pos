services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ticket_pos
      POSTGRES_PASSWORD: ticket_pos
      POSTGRES_DB: ticket_pos
    ports:
      - "64432:5432"
    volumes:
      # Postgres 18 images keep PGDATA at /var/lib/postgresql/<major>/docker,
      # so the whole /var/lib/postgresql tree is the persisted path.
      - postgres_data_18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_pos -d ticket_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "64900:9000"
      - "64901:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_SERVER_URL: http://localhost:64900
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb local/ticket-pos --ignore-existing &&
      mc anonymous set download local/ticket-pos/covers &&
      mc anonymous set download local/ticket-pos/logos &&
      mc anonymous set download local/ticket-pos/avatars
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "64080:8080"
    volumes:
      - ./backend:/app
      - backend_go_mod_cache:/go/pkg/mod
    environment:
      DATABASE_URL: postgres://ticket_pos:ticket_pos@postgres:5432/ticket_pos?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:64900
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: ticket-pos
      S3_REGION: us-east-1
      # Compose reads the root .env for these. Empty RESEND_API_KEY (the default)
      # keeps the backend on the logging email sender; set it in .env to send real
      # mail via Resend from the dev stack. See .env.example.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Multiticketing <noreply@send.multiticketing.com>}
      # The `development` Google OAuth client, also from the root .env. Empty (the
      # default) leaves Google Sign-In off and the button hidden; passcode
      # sign-in is unaffected either way. GOOGLE_TOKEN_ENDPOINT is deliberately
      # not passed — it is a test-only override and a production footgun.
      GOOGLE_STAFF_CLIENT_ID: ${GOOGLE_STAFF_CLIENT_ID:-}
      GOOGLE_STAFF_CLIENT_SECRET: ${GOOGLE_STAFF_CLIENT_SECRET:-}
      GOOGLE_STOREFRONT_CLIENT_ID: ${GOOGLE_STOREFRONT_CLIENT_ID:-}
      GOOGLE_STOREFRONT_CLIENT_SECRET: ${GOOGLE_STOREFRONT_CLIENT_SECRET:-}
      # PayPhone merchant credentials, also from the root .env. Both empty (the
      # default) selects the stub Payment Provider, so checkout works with zero
      # setup; set BOTH — SANDBOX credentials, never production ones — to charge
      # through real PayPhone from the dev stack (see
      # docs/manual-verification-payphone.md). PAYPHONE_API_BASE_URL is
      # deliberately not passed — it is a test-only override and a production
      # footgun, exactly like GOOGLE_TOKEN_ENDPOINT above.
      PAYPHONE_API_TOKEN: ${PAYPHONE_API_TOKEN:-}
      PAYPHONE_STORE_ID: ${PAYPHONE_STORE_ID:-}
      # The Platform Fee schedule in basis points (ADR 0014). Unset falls back to
      # the launch rates the API defaults to, so the dev stack charges what
      # production charges; override in .env to try another rate locally.
      PLATFORM_FEE_BASIS_POINTS: ${PLATFORM_FEE_BASIS_POINTS:-}
      PLATFORM_FEE_IVA_BASIS_POINTS: ${PLATFORM_FEE_IVA_BASIS_POINTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  install:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
    command: >
      sh -c "corepack enable &&
      corepack prepare pnpm@9.15.4 --activate &&
      pnpm install"

  storefront:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
    command: >
      sh -c "corepack enable &&
      corepack prepare pnpm@9.15.4 --activate &&
      pnpm --filter @ticket-pos/storefront exec next dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "64300:3000"
    environment:
      API_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: http://localhost:64080
      # The public half of the dev OAuth client. The redirect URI is the
      # PUBLISHED port (64300), not the container port — it is what the browser
      # follows, and it must match the Console registration byte for byte.
      GOOGLE_CLIENT_ID: ${GOOGLE_STOREFRONT_CLIENT_ID:-}
      GOOGLE_REDIRECT_URI: http://localhost:64300/api/customer/auth/google/callback
    depends_on:
      backend:
        condition: service_started
      install:
        condition: service_completed_successfully

  staff:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
    command: >
      sh -c "corepack enable &&
      corepack prepare pnpm@9.15.4 --activate &&
      pnpm --filter @ticket-pos/staff exec next dev --hostname 0.0.0.0 --port 3001"
    ports:
      - "64301:3001"
    environment:
      API_URL: http://backend:8080
      GOOGLE_CLIENT_ID: ${GOOGLE_STAFF_CLIENT_ID:-}
      GOOGLE_REDIRECT_URI: http://localhost:64301/api/auth/google/callback
    depends_on:
      backend:
        condition: service_started
      install:
        condition: service_completed_successfully

volumes:
  postgres_data_18:
  minio_data:
  root_node_modules:
  backend_go_mod_cache:

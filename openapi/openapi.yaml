        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Set the Customer's Avatar
      tags:
      - customer
  /api/v1/customer/profile/avatar-upload-url:
    post:
      description: Returns a presigned PUT URL for uploading the signed-in Customer's
        Avatar image (JPEG, PNG, or WebP), keyed under that Customer alone. The upload
        itself goes straight to object storage; attaching the uploaded image is a
        separate PUT to /customer/profile/avatar with the object key. Requires a full
        Customer Session.

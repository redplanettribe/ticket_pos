  /api/v1/customer/ticket-sales:
    get:
      description: 'Returns the signed-in Customer''s Ticket Sales, upcoming and past,
        across all Organizations. Always scoped by the Customer Session, never by
        any identifier in the request. Each sale reports whether the Customer could
        undo it right now (`reversible`) and, when they could, until when (`reversible_until`,
        RFC3339 UTC). That deadline is the offer''s rather than a publication of the
        Reversal Window: while an undo is on offer it is the earlier of 20:00 Ecuador
        time on the day of purchase or the Event''s start (ADR 0018), and it is null
        whenever no undo is on offer even if that Window is still open. Only an active
        Online Sale can be reversible, and its Payment must be one this deployment
        can actually undo: a free claim always is, since nothing was collected, and
        a paid one is when the Payment Provider that collected it supports reversal
        (ADR 0012). A sale settled by some other provider therefore reports false
        inside its window rather than offering an undo that would fail. `reversible_until`
        is null whenever `reversible` is false. This endpoint reports the window and
        nothing more: there is no reversal action here.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerArea'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: List the Customer's Ticket Sales
      tags:
      - customer
  /api/v1/customer/ticket-sales/{ticketSaleId}/reverse:
    post:
      description: 'Reverses one of the signed-in Customer''s own Ticket Sales within
        its Reversal Window (ADR 0018), or records the ask as a Reversal Request when
        the Payment Provider does not answer in time (ADR 0024). Authorization is
        the Customer Session and nothing else — a Customer may only reverse a Ticket
        Sale they own, and a Confirmation Link session is not a credential for this.
        The Reversal Window is enforced here on the server whatever the client believed,
        and it is evaluated once, when the Reversal Request is created; a request
        already made stays authorised however long the answer takes. **200 OK — undone.**
        The Ticket Sale becomes reversed with status `reversed` and `reversed_at`,
        every line''s quantity returns to its Ticket Type''s capacity, and the void
        notice is emailed to the Customer once the reversal has committed. The sale
        is not deleted: it keeps its Sale Confirmation reference and stays visible
        in the Customer Area with a reversed status. **202 Accepted — pending.** The
        Payment Provider gave no definite answer (a timeout, a 5xx, a body this integration
        cannot place), so the money may or may not have moved: the body carries status
        `pending` and `requested_at`, and a Reversal Request is in flight. Nothing
        about the money or the tickets has changed — the Ticket Sale stays active,
        its capacity stays held, and the tickets are still valid — and the platform
        asks the provider again, including whenever the Customer loads their Customer
        Area. A client must never render a 202 as a completed refund. Pressing Undo
        again while a request is in flight returns 202 with the original request''s
        `requested_at`: no second Reversal Request, and no second call to the Payment
        Provider. Refused, with nothing changed, when the sale is already reversed
        (SALE_ALREADY_REVERSED), is not an Online Sale or was settled by a Payment
        Provider this deployment cannot ask (SALE_NOT_REVERSIBLE), or its window has
        closed (REVERSAL_WINDOW_CLOSED), or the platform gave up on an earlier Reversal
        Request for it with the outcome still unknown (REVERSAL_UNRESOLVED) — that
        last one is never retried and never reaches the provider, because the money
        may already have gone back and asking again could return it twice; a Platform
        Operator settles it. Refused with 502 SALE_REVERSAL_FAILED, again with nothing
        changed, when the provider was asked and definitely declined: nothing happened,
        the response carries the Sale Confirmation reference and makes no claim about
        the cause, because the provider publishes no code meaning the deadline passed,
        and the provider''s own error code goes to the log only. Two simultaneous
        presses reverse once: attempts on one Ticket Sale are serialised for the whole
        attempt including the call to the Payment Provider, so the second is refused
        as already reversed (SALE_ALREADY_REVERSED), the provider is asked exactly
        once, and capacity is never restored twice. A free Online Sale has no provider
        to ask, creates no Reversal Request, and is always answered synchronously.'
      parameters:
      - description: Ticket Sale id
        in: path
        name: ticketSaleId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeSaleReversal'
          description: OK
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeSaleReversal'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Gateway
      security:
      - BearerAuth: []
      summary: Undo a Ticket Sale
      tags:
      - customer
  /api/v1/customer/ticket-sales/{ticketSaleId}/tickets:
    get:
      description: 'Returns every Ticket of one of the signed-in Customer''s own Ticket
        Sales — its position, its Ticket Type and its Ticket Assignment state (unassigned,
        assigned, accepted) with the address the buyer gave it. It carries NO Ticket
        Questions, Answers, outstanding counts or Answer Links for any Ticket (ADR
        0049): an Answer is given only by a Ticket''s Holder, and the buyer reads
        and answers the one Ticket they hold through `/api/v1/customer/held-tickets`.
        This is the page behind the Confirmation Link and the Customer Area, which
        are one surface: a Confirmation Link session is narrowed to the single Ticket
        Sale it names and sees only that one. Authorization is the Customer Session
        and nothing else — the Ticket Sale id in the path names which of the caller''s
        OWN sales, and a sale belonging to somebody else returns an empty list rather
        than a refusal, so that ids cannot be probed. A reversed sale''s Tickets are
        still listed. Answers 404 while the Ticket Question feature flag is off.'
      parameters:
      - description: Ticket Sale id
        in: path
        name: ticketSaleId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeBuyerTicketAnswers'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List a Ticket Sale's tickets and whose they are
      tags:
      - customer
  /api/v1/customer/ticket-sales/{ticketSaleId}/tickets/{ticketId}/assignment:
    put:
      description: 'Names the email address that holds one Ticket of the signed-in
        Customer''s own Ticket Sale, creating the Ticket Assignment or replacing the
        one that was there — assign, reassign and correcting a typo are all this one
        call. **A change of address mails the new address an Assignment Link**, which
        is how a Ticket becomes `accepted`; re-sending the address already there mails
        nobody. **Sending is rationed**: one Ticket may send at most a small fixed
        number of Assignment mails in its whole life (a first send plus a resend allowance
        for a mistyped address), and one buyer may send only so many inside a rolling
        window across all their Tickets. A Ticket out of allowance is refused with
        409 ASSIGNMENT_MAIL_CAP_REACHED and a buyer over their window with 429 ASSIGNMENT_RATE_LIMITED.
        Both refuse the ASSIGNMENT outright and send no mail — the address is not
        written and no timestamp moves, because a write without a send would kill
        every Assignment Link already outstanding for that Ticket and replace it with
        nothing. The buyer''s fallback is the Ticket''s Answer Link, which keeps working.
        **Reassigning to a DIFFERENT address clears that Ticket''s Answers back to
        Outstanding**: an Answer is a fact about a person and is never inherited by
        a new Holder. A first assignment clears nothing, and re-sending the address
        the Ticket already carries is a no-op that moves no timestamp. The buyer may
        assign any Ticket of their sale, including to their own address, and may assign
        only some of them. Authorization is the Customer Session; a Confirmation Link
        session may assign the one sale it names. A Ticket that is not on one of the
        caller''s own sales is refused with 404 TICKET_NOT_FOUND, indistinguishably
        from one that does not exist. Available on `online` and `import` Ticket Sales
        only — an `in_person` door sale has no buyer surface and is refused with 409
        ASSIGNMENT_CHANNEL_UNSUPPORTED. Also refused with 409 once the Event has started
        (ASSIGNMENT_EVENT_STARTED) or the Ticket Sale has been reversed (ASSIGNMENT_SALE_REVERSED),
        and with 400 INVALID_HOLDER_EMAIL when the value is not an email address.
        The whole sale''s tickets come back, not just the one that changed. Answers
        404 while TICKET_ASSIGNMENT_ENABLED is off, which is how it ships — that flag
        is separate from the Ticket Question one, so closing it leaves Ticket Questions
        working. The Storefront must tell the buyer, before they submit, that the
        address will be mailed and shown to the Organization.'
      parameters:
      - description: Ticket Sale id
        in: path
        name: ticketSaleId
        required: true
        schema:
          type: string
      - description: Ticket id
        in: path
        name: ticketId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.buyerAssignmentBody'
                description: The email address to assign this ticket to
                summary: body
        description: The email address to assign this ticket to
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeBuyerTicketAnswers'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Assign one of your own tickets to an email address
      tags:
      - customer
  /api/v1/customer/unsubscribe:
    post:
      description: 'Turns the Follow Digest off for the Customer named by a signed
        unsubscribe token, which is carried in the footer of every Digest. Requires
        no sign-in and accepts no credential: a Digest is read months after anybody
        last signed in, and an opt-out gated behind a passcode would not be an opt-out.
        Unsubscribing is a switch and not a purge — every Follow stands, stays visible
        in the Customer Area, and the Customer can turn the Digest back on from there.
        This is deliberately a POST with no GET counterpart, so that a mail security
        scanner prefetching the link in a message cannot unsubscribe anybody; a GET
        is answered 405. Idempotent: the same link appears in every Digest a person
        ever received, and pressing it twice means the same thing once. A malformed,
        forged or spent token is UNSUBSCRIBE_LINK_INVALID. Touches no transactional
        mail: One-time Passcodes and Sale Confirmations arrive either way.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.unsubscribeBody'
                description: Signed unsubscribe token
                summary: body
        description: Signed unsubscribe token
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerDigestSubscription'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
      summary: Unsubscribe from the Follow Digest
      tags:
      - customer
  /api/v1/internal/answer-reminders/sweep:
    post:
      description: 'Sweeps the Tickets of active Ticket Sales that still owe required
        Ticket Question Answers and emails whoever can actually answer them (ADR 0044,
        ADR 0046). A Ticket that is `accepted` produces a reminder to its HOLDER,
        carrying their own Assignment Link and naming no buyer, no price and no Sale
        Confirmation reference; a Ticket that is `unassigned` or `assigned` produces
        one to the BUYER, pointing at their sale''s page where they answer what they
        know and copy each Ticket''s own Answer Link for whoever will use it. A Sale
        with a mix produces both — one mail to the buyer covering only the Tickets
        still theirs to chase, and one to each accepted Holder about their own — never
        one mail listing everything to everybody. Rationed per TICKET: at most one
        mail every 7 days and at most two ever, so a four-ticket sale can chase two
        Holders without mailing either twice. Silent once the Event has started, and
        never sent for a reversed Sale. Swept rather than triggered by an edit, so
        an Organization authoring four questions in ten minutes cannot mail the same
        people four times. Transactional: it is not gated by Marketing Consent, exactly
        as a Sale Confirmation is not — which matters most for a Holder, who accepted
        a ticket and opted into nothing. Written in the recipient''s Mail Locale:
        the Sale Locale first for the buyer, whose own purchase it is about, and the
        recipient''s own remembered locale first for a Holder, who is not party to
        the sale. Sends nothing at all while TICKET_QUESTIONS_ENABLED is off (ADR
        0045); with TICKET_ASSIGNMENT_ENABLED off every Ticket is addressed to its
        buyer, exactly as before ADR 0046. The Cloud Scheduler job that drives it
        ships paused. Internal service-to-service only: Cloud Run IAM authenticates
        the caller by Google-signed OIDC ID token before the request reaches the API
        (ADR 0008), and no Customer Session or staff token reaches it. Nothing about
        the run can be named by the caller — not the moment, not an Event, not a Sale,
        not a Ticket — because a caller who could name the moment could lift the 7-day
        silence on demand. Safe to call by hand and effectively idempotent: a second
        run inside the cooldown mails nobody. The response reports how many mails
        were due, how many went, how many were skipped or refused, how many were sent
        but could not be recorded, and the standing backlog. It names nobody and does
        not say which recipients were Holders.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeAnswerReminderSweep'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      summary: Send Answer Reminders
      tags:
      - internal
  /api/v1/internal/assignment-reminders/sweep:
    post:
      description: 'Sweeps the online Ticket Sales that have more than one Ticket,
        at least one of them still unassigned, and an Event that has not started,
        and emails each Sale''s BUYER once: the Event, how many of their tickets still
        have no address, a fresh Confirmation Link to the Sale''s page, and the sentence
        ADR 0047 requires about what giving an address does. Rationed per Ticket Sale
        (ADR 0051): not before 24 hours after the Sale, at most one mail every 7 days,
        at most two ever; silent once the Event has started or every Ticket is assigned;
        never for a single-Ticket Sale, a reversed Sale or an import Sale. A reassigned
        Self-held Ticket counts as assigned. Transactional: not gated by Marketing
        Consent, exactly as the Sale Confirmation that carried the same link is not.
        Written in the Sale Locale, then the buyer''s Mail Locale, then English. Sends
        nothing at all while TICKET_ASSIGNMENT_ENABLED is off. The Cloud Scheduler
        job that drives it ships paused, and its first run is the announcement to
        buyers who bought before Ticket Assignment existed. Internal service-to-service
        only: Cloud Run IAM authenticates the caller by Google-signed OIDC ID token
        before the request reaches the API (ADR 0008), and no Customer Session or
        staff token reaches it. Nothing about the run can be named by the caller —
        not the moment, not an Event, not a Sale — because a caller who could name
        the moment could lift the 7-day silence on demand. Safe to call by hand and
        effectively idempotent: a second run inside the cooldown mails nobody. Drains
        a large backlog in batches, oldest Sale first. The response reports how many
        Sales were due in this batch, how many mails went, how many were skipped or
        refused, how many were sent but could not be recorded, and the standing backlog.
        It names nobody.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeAssignmentReminderSweep'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      summary: Send Assignment Reminders
      tags:
      - internal
  /api/v1/internal/checkout-answers/purge:
    post:
      description: 'Deletes the Ticket Question Answers held on Payments that never
        reached `approved` and were begun more than 30 days ago (ADR 0044). The Payment
        row and its lines are untouched and kept forever — this is a purge of Answers,
        not of Payments — and the chosen Options of a choice Answer go with it. An
        approved Payment''s Answers are never purged at any age. The predicate is
        non-approval plus age, and never the `expired` status alone: expiry in this
        platform is lazy, opportunistic bookkeeping and an expired Payment can still
        flip to approved when the Payment Provider confirms late, so purging on it
        would delete the Answers of a sale that then commits. The 30-day window is
        what makes non-approval safe to act on. Internal service-to-service only:
        Cloud Run IAM authenticates the caller by Google-signed OIDC ID token before
        the request reaches the API (ADR 0008), and no Customer Session or staff token
        reaches it. The window cannot be named by the caller; it is taken from the
        clock, and the cutoff actually used is echoed back. Safe to call by hand at
        any time and idempotent — a second run deletes nothing and reports zeros.
        The response reports how many Answers went, how many Payments they came off,
        the cutoff used, and how many Answers are still riding Payments across the
        platform, so two runs a day apart say whether the checkout is capturing at
        all. It names no Payment, no buyer and no Answer, because an Answer is the
        data this feature exists to protect.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeAnswerPurge'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      summary: Purge the Answers on abandoned Payments
      tags:
      - internal
  /api/v1/internal/follow-digests/drain:
    post:
      description: 'Claims a batch of pending Follow Digests, composes each one at
        send time, sends it, records everything it carried in the sent-ledger, and
        marks the row done (ADR 0030). Internal service-to-service only: Cloud Run
        IAM authenticates the caller by Google-signed OIDC ID token before the request
        reaches the API (ADR 0008). Composition happens here rather than at enqueue,
        so a Digest delayed by a backlog or a retry still reflects the catalogue as
        it stands when it is sent. A Digest lists the Events matched by that Customer''s
        Follows that they have not already been shown, filtered exactly as the public
        explorer filters — published, discoverable and not yet ended — so an Event
        an Organization chose not to list is never mailed out. It is written in the
        Customer''s remembered Mail Locale, naming Preset Tags in that language and
        Custom Tags exactly as their Organization coined them. A Customer whose Follows
        matched nothing receives no email at all rather than an empty one, and that
        Digest is recorded as having had nothing to say. Every Event included is written
        to the sent-ledger and only those Events are, which is what stops a later
        Digest repeating them. Re-running after a completed send produces no second
        email for that Customer and week. A delivery failure leaves the Digest in
        the queue on a backoff and a later run sends exactly one email; after its
        attempts are spent the Digest is abandoned, because a Digest is about the
        week it names and one delivered days late is worse than none. Each run claims
        one Digest at a time and stops at a time budget of its own that expires before
        any deadline outside it, so a backlog can never wedge it; whatever it did
        not reach stays exactly as due as it was found. Safe to call by hand at any
        time and a no-op on an empty queue. The response tallies what the run did
        and reports the standing backlog, so two calls a minute apart say whether
        an incident is getting better or worse.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeFollowDigestDrain'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      summary: Send due Follow Digests
      tags:
      - internal
  /api/v1/internal/follow-digests/enqueue:
    post:
      description: 'Creates one pending Follow Digest per eligible Customer for the
        current week (ADR 0030). A Customer is eligible when they hold at least one
        Follow — of an Organization or of a Tag — and their email has been verified:
        a Follow is a request to be written to, and somebody who never pressed one
        is never enqueued. Internal service-to-service only: Cloud Run IAM authenticates
        the caller by Google-signed OIDC ID token before the request reaches the API
        (ADR 0008), and no Customer Session or staff token reaches it. Which week
        is enqueued is taken from the clock and cannot be named by the caller — it
        is the Monday that begins the current week in Ecuador''s timezone, echoed
        back in the response. Nothing is composed here and no email is sent: the row
        records only that this Customer is owed a Digest for this week, and what it
        will say is decided when the drain sends it. Safe to call by hand at any time
        and idempotent within a week — a second call creates no rows, because the
        database refuses more than one Digest per Customer per week, and the response
        reports those Customers as already enqueued.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeFollowDigestEnqueue'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      summary: Enqueue this week's Follow Digests
      tags:
      - internal
  /api/v1/internal/holder-addresses/purge:
    post:
      description: 'Deletes the holder email address from every Ticket still in `assigned`
        — an address was given and nobody has accepted it — whose Event has started
        (ADR 0046). Read as an instant: `events.starts_at` is fixed in the Event''s
        own timezone, so the comparison already carries it. The purge takes the ADDRESS
        ONLY: the Ticket, its Ticket Question Answers, its Ticket Sale and the fact
        that the Ticket was assigned all survive, the last of them as a purge timestamp
        on the Ticket, because the platform is entitled to remember that it sold a
        ticket and that somebody was named for it and is not entitled to keep the
        name. An `accepted` Ticket loses nothing at any age: its Holder proved the
        address from their own inbox and is an ordinary Customer under ordinary Customer
        retention. An Event that has never said when it starts is never purged, matching
        the reading the assignment window gives a missing start. A reversed Ticket
        Sale is purged like any other. Internal service-to-service only: Cloud Run
        IAM authenticates the caller by Google-signed OIDC ID token before the request
        reaches the API (ADR 0008), and no Customer Session or staff token reaches
        it. The moment cannot be named by the caller; it is taken from the clock,
        and the instant actually used is echoed back. Not gated on the Ticket Assignment
        feature flag, deliberately — the switch that turns a deletion off must never
        be the switch that turns collection off. Safe to call by hand at any time
        and idempotent: a second run purges nothing and reports zeros. The response
        reports how many addresses went, how many Events they came off, the instant
        used, and how many unaccepted addresses are still held across the platform,
        so two runs a day apart say whether anybody is assigning at all. It names
        no address, no Ticket, no buyer and no Event, because the address is the data
        this job exists to remove.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeHolderAddressPurge'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      summary: Purge unaccepted holder addresses at Event start
      tags:
      - internal
  /api/v1/internal/reversals/drain:
    post:
      description: 'Runs the Reversal Reconciler: the platform asks the Payment Provider
        again what became of the Reversal Requests it never answered, on the backoff
        ADR 0024 sets (10s, 30s, 2m, 5m, 15m, then every 30m with jitter), and gives
        up 24 hours after the Customer asked by recording an Unresolved Reversal.
        Internal service-to-service only: Cloud Run IAM authenticates the caller by
        Google-signed OIDC ID token before the request reaches the API (ADR 0008),
        and no Customer Session or staff token reaches it. It also finishes a reversal
        the provider already agreed to whose local write failed, leaving the Ticket
        Sale active while the money had gone back: there the answer is already recorded,
        so the run completes the local commit only and the provider is not called
        at all — a second reversal of a payment already reversed could refund the
        buyer twice — and a commit that will not land within the same day becomes
        an Unresolved Reversal whose sale a Platform Operator voids by hand. Safe
        to call by hand at any time and a no-op on an empty queue. It only ever finds
        out what the provider did; it never re-evaluates eligibility, so a Reversal
        Request made inside the Reversal Window still resolves however long after
        the Window closed the answer arrives. Each run claims one Reversal Request
        at a time, works it, and stops at a time budget of its own that expires before
        any deadline outside it, so a backlog can never wedge it; whatever it did
        not reach stays exactly as due as it was found, for the next run. Every pursuit
        takes the per-sale advisory lock, so it can never overlap a Customer''s own
        press or the Customer Area drain — a contended Reversal Request is skipped
        and retried on the next run — and a Ticket Sale somebody else reversed out
        of band is never re-asked about, because that could refund the buyer twice.
        The response tallies what the run did, reports the standing in-flight backlog
        (how many Reversal Requests are still open and when the oldest was asked,
        so two curls a minute apart say whether an incident is getting better or worse),
        and carries the standing Unresolved Reversal queue with each row''s client
        transaction id and last error, so a Platform Operator can find the transaction
        on the provider''s own dashboard.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeReversalDrain'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      summary: Pursue stuck Reversal Requests
      tags:
      - internal
  /api/v1/operator/customers/{email}/consent:
    get:
      description: 'Returns the Customer at an email address and their CURRENT consent
        state, across every Organization on the platform — Customer identity is global
        and separate from staff (ADR 0010), so a Customer''s consents are the platform''s
        relationship with them and no Organization may inspect them. The payload identifies
        the person before anybody acts on their behalf (id, email, name) and reports
        what a withdrawal would actually change: marketing_consent and networking_consent
        as granted, denied or pending_confirmation, and NULL where the Customer has
        never been asked — null is UNANSWERED and is a different fact from denied,
        published as the different fact it is so that nobody is shown a refusal they
        never made. pending_confirmation is a tick from somebody who never proved
        the address: standing against it, denied for sending, never expiring. policy_accepted_at
        is when they last accepted a Policy Version, null if never; it is shown and
        is NOT actionable, because Policy Acceptance is not withdrawable — it is absent
        from the withdrawal form, it gates the platform on a basis other than consent,
        and clearing it would re-gate the person rather than free them. withdrew is
        null here: a lookup takes nothing away. The address is matched on its normalised
        form, so case does not matter. READING WRITES NOTHING — no consent is captured
        and no Consent Record appears, because a lookup that recorded something would
        put an act in the evidence log that nobody performed. An address no Customer
        holds is 404 CUSTOMER_NOT_FOUND: an Operator is entitled to know, and that
        candour is bought by the door rather than granted by the answer — every caller
        the operator allowlist has not admitted is refused identically for an address
        that exists and one that does not. Platform Operator only.'
      parameters:
      - description: Customer email address (matched case-insensitively)
        in: path
        name: email
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOperatorCustomerConsent'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Look up a Customer's consent state by email address
      tags:
      - operator
  /api/v1/operator/customers/{email}/consent/withdrawal:
    post:
      description: 'Records that a Customer withdrew an optional consent by a route
        other than the platform — counsel''s printed form, or an email to the data-protection
        address — so that a request which arrived on paper can be honoured within
        the legal deadline without anybody editing the database by hand. THIS SURFACE
        CAN ONLY WITHDRAW, NEVER GRANT: marketing_consent and networking_consent accept
        false (withdraw) or absence (this form did not name this consent, and nothing
        is written for it), and a value of TRUE is refused with 400 CONSENT_GRANT_NOT_PERMITTED.
        The refusal is the API''s rather than the form''s — an Operator who could
        grant could manufacture the very consent they exist to honour the withdrawal
        of — and it is enforced in the platform''s single consent-write path, so no
        caller escapes it. Because it can only withdraw, the proven-ness question
        that decides granted-or-pending on every other channel never arises here.
        At least one of the two consents must be named, and request_reference is REQUIRED:
        it names the inbound artefact (the dated form, the letter, the email) and
        is at most 500 characters. It is a POINTER TO EVIDENCE HELD ELSEWHERE rather
        than evidence itself — it is never parsed and nothing is ever decided from
        its contents. The act writes exactly ONE Consent Record on channel operator_request,
        carrying the state each consent was in immediately before it, the acting operator''s
        email (taken from the Staff Session, NEVER from the body) and the reference
        — the pair that stops a staff action from ever being presented as somebody''s
        own click. Marketing Consent and the Follow Digest move in lockstep in the
        same transaction (ADR 0034). Policy Acceptance is untouched: it is not withdrawable.
        The response reports the state AFTER the act and `withdrew`, which is what
        the act TOOK AWAY — not the same question as what it answered, since `denied`
        reads the same whether somebody just gave something up or was already refusing.
        The Customer receives the same withdrawal confirmation email as any other
        channel, at their own stored address and in their Mail Locale, ONLY when something
        actually moved; an act that changed nothing is still recorded and mails nobody.
        A failure to send never fails the withdrawal. Platform Operator only.'
      parameters:
      - description: Customer email address (matched case-insensitively)
        in: path
        name: email
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.recordConsentWithdrawalBody'
                description: Which consents the artefact withdrew, and which artefact
                  it was
                summary: body
        description: Which consents the artefact withdrew, and which artefact it was
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOperatorCustomerConsent'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Record a Consent Withdrawal that arrived off the platform
      tags:
      - operator
  /api/v1/operator/events/{eventID}/ticket-questions:
    get:
      description: 'Returns every Ticket Question of the Event across its Ticket Types,
        in every review state and retired ones included, each with its Options and
        its review columns (`review_status`, `approved_by`, `refusal_reason`, `revocation_reason`)
        and the Ticket Type it hangs off. This is where the Operator sees what an
        Organization is asking and takes an approval back (ADR 0056). Not scoped to
        an Organization: the operator allowlist is the whole of the gate. 404 EVENT_NOT_FOUND
        for an unknown or malformed id; 404 TICKET_QUESTIONS_UNAVAILABLE while the

components:
  schemas:
    handler.avatarUploadURLBody:
      properties:
        content_type:
          type: string
        file_name:
          type: string
      type: object
    handler.beginCheckoutBody:
      properties:
        affiliate_codes:
          description: |-
            AffiliateCodes are the Affiliate Link codes the Storefront remembered from
            the buyer's recent clicks on this Event, NEWEST FIRST, OPTIONAL and never
            validated as a field: the service credits the first that resolves to a live
            link and records the sale unattributed when none does. A checkout is never
            refused over a ref (#146).

            A list rather than one code because liveness is unknowable at click time
            (ADR 0022): a click on a since-deactivated code must not erase the live
            click before it. Anything past maxAffiliateCodes is dropped unread — a
            browser sends at most three.
          items:
            type: string
          type: array
          uniqueItems: false
        customer_email:
          type: string
        customer_first_name:
          type: string
        customer_last_name:
          type: string
        customer_phone:
          description: |-
            The buyer's phone number, OPTIONAL and never fabricated (#106). It exists
            to be handed to the Payment Provider so its hosted card form arrives with
            nothing left to type but the card; a buyer who omits it checks out exactly
            as they did before the field existed. Absent, empty, or whitespace all mean
            the same thing — no phone — and are not validation failures.
          type: string
        customer_tax_id_number:
          type: string
        customer_tax_id_type:
          description: |-
            The buyer's Tax ID: a Tax ID Type ('cedula' | 'ruc' | 'passport') and its
            number. Both are required — an Online Sale is a native Sales Channel and
            must be declarable (ADR 0016).
          type: string
        lines:
          items:
            $ref: '#/components/schemas/handler.checkoutLineBody'
          type: array
          uniqueItems: false
      type: object
    handler.checkoutLineBody:
      properties:
        quantity:
          type: integer
        ticket_type_id:
          type: string
      type: object
    handler.commitImportBody:
      properties:
        idempotency_key:
          type: string
        sales:
          items:
            $ref: '#/components/schemas/handler.importSaleRow'
          type: array
          uniqueItems: false
        source:
          type: string
      type: object
    handler.confirmCheckoutBody:
      properties:
        provider_params:
          additionalProperties:
            type: string
          description: |-
            ProviderParams are the query params the provider's return redirect
            carried, relayed verbatim by the Storefront return handler (for the stub:
            {"outcome": "approved"|"declined"}).
          type: object
      type: object
    handler.confirmationLinkBody:
      properties:
        follow:
          description: |-
            Follow exists on this body only so that it can be refused, and refused
            loudly (#219).

            A Confirmation Link mints a sale-scoped session, which is possession of an
            email somebody was SENT and may well have been forwarded. #217 already
            refuses that session the three Follow routes; an intent riding the
            redemption would be the same subscription by another road — whoever a Sale
            Confirmation reached could sign the ticket-holder's address up for a
            weekly email without ever proving they own it (ADR 0010, CONTEXT.md
            "Follow"). Leaving the field off the struct would have refused it too, by
            silently dropping it, and silence is the wrong answer to a request that
            must never work.
          type: string
        token:
          type: string
      type: object
    handler.coverUploadURLBody:
      properties:
        content_type:
          type: string
        file_name:
          type: string
      type: object
    handler.createAffiliateLinkBody:
      properties:
        name:
          type: string
      type: object
    handler.createEventBody:
      properties:
        name:
          type: string
        registration_mode:
          description: |-
            RegistrationMode and RegistrationURL let an Event be created as externally
            registered in one step. Both absent is the ordinary ticketed Event.
          type: string
        registration_url:
          type: string
        slug:
          type: string
      type: object
    handler.createOrganizationBody:
      properties:
        name:
          type: string
        slug:
          type: string
      type: object
    handler.createTicketTypeBody:
      properties:
        capacity:
          type: integer
        description:
          type: string
        max_per_customer:
          description: |-
            MaxPerCustomer is the Purchase Limit. Absent or null means the Ticket Type
            is unrestricted, which is the default and the state of every Ticket Type
            that predates ADR 0025.
          type: integer
        name:
          type: string
        price_cents:
          type: integer
      type: object
    handler.declinePayoutRequestBody:
      properties:
        reason:
          type: string
      type: object
    handler.fulfilPayoutRequestBody:
      properties:
        amount_cents:
          type: integer
        note:
          type: string
        paid_at:
          type: string
      type: object
    handler.healthResponse:

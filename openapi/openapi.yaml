                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
      security:
      - BearerAuth: []
      summary: Delete affiliate link
      tags:
      - staff
    patch:
      description: 'Renames an Affiliate Link and/or takes it out of circulation.
        Both body fields are optional: an absent field is left unchanged, so a rename
        never disturbs the link''s active state and vice versa. The code and URL are
        immutable and never change. A deactivated link''s code is dead everywhere
        a buyer could carry it — the click counter ignores it and a checkout begun
        with it records the sale unattributed — while its historical clicks, attributed
        sales and Net Proceeds stay on the staff list, marked inactive; reactivating
        resumes both under the same code. Org Admin and Event Owner only.'

          type: string
      type: object
    platform.Locale:
      description: Locale is the language everything below is written in.
      enum:
      - en
      - es
      - en
      type: string
      x-enum-varnames:
      - LocaleEN
      - LocaleES
      - DefaultLocale
    policy.ConsentLabels:
      description: ConsentLabels are the three checkbox labels, markdown.
      properties:
        marketing_consent:
          description: |-
            MarketingConsent is the optional marketing box, and it names the weekly
            Follow Digest out loud because granting it turns the Digest on (ADR 0034).
          type: string
        networking_consent:
          description: |-
            NetworkingConsent is the optional networking box, and it names both
            audiences — other attendees of the same event, and that event's organizers
            — because those are the two the authorization actually covers.
          type: string
        policy_acceptance:
          description: |-
            PolicyAcceptance is the required box. Without it no Customer Session is
            established and no Online Sale completes.
          type: string
      type: object
    service.ActiveMemberView:
      properties:
        member_id:
          type: string
        organization_id:
          type: string
        organization_logo_url:
          type: string
        organization_name:
          type: string
        organization_slug:
          type: string
        role:
          type: string
      type: object
    service.AffiliateLinkView:
      properties:
        active:
          type: boolean
        clicks:
          description: |-
            Clicks is how many times the Event page was reached through this link —
            raw visits, counted again every time, which is what makes a bad link
            readable next to a bad audience.
          type: integer
        code:
          type: string
        created_at:
          type: string
        id:
          type: string
        name:
          type: string
        net_proceeds_cents:
          type: integer
        sales_count:
          description: |-
            SalesCount and NetProceedsCents are the link's Affiliate Attribution
            figures: how many ACTIVE Ticket Sales it drove, and what they left the
            Organization after the Platform Fee and its Fee IVA. Display-only — no
            commission is computed from either — and a reversed sale drops out of both
            however it was reversed. A link that drove only free claims shows its count
            with zero beside it.

            Both are null — absent, not zero — on an Event that registers externally.
            Such a link can never attribute a sale, so a 0 and a $0.00 would sit there
            forever reading as "this link failed" when the truth is "this link's
            success is not measured in sales" (#213). Nullable rather than omitted so
            the distinction is explicit in the payload: null is "not measured here",
            0 is "measured, and nothing yet", and a client that reads either as the
            other has to do so deliberately.
          type: integer
        url:
          description: |-
            URL is the whole thing an organizer copies: the Storefront Event page with
            the code as its ref. Derived at read time from the Storefront origin this
            process is configured with, never stored, so moving the Storefront moves
            every link with it.
          type: string
      type: object
    service.AnswerOptionView:
      properties:
        current_label:
          description: |-
            CurrentLabel is what the same Option reads NOW. It equals Label until
            somebody corrects the Option's wording; after that the two differ, and
            both are true statements about different moments.
          type: string
        label:
          description: |-
            Label is THE SNAPSHOT: the words this Option showed when it was chosen.
            This is what the person actually read, and nothing ever rewrites it.
          type: string
        option_id:
          description: |-
            OptionID is the Option's stable identity, which is what a form posts back
            and what survives a rename.
          type: string
        retired:
          description: |-
            Retired is true for an Option kept only so that what chose it still reads.
            An Answer against one persists and stays readable; what it may not do is
            be chosen afresh.
          type: boolean
      type: object
    service.AnswerPurgeResult:
      properties:
        answers_held:
          description: |-
            AnswersHeld is how many Answers are riding Payments across the platform once
            this run finished — the standing backlog, in the Reconciler's sense. It is
            what makes two runs a day apart legible: rising means the checkout is
            capturing, flat at zero means the flag is closed and there is nothing here
            to purge.
          type: integer
        answers_purged:
          description: |-
            AnswersPurged is how many held Answers this run deleted. Zero is the
            ordinary answer, and on a platform where the feature ships dark it is the
            only answer.
          type: integer
        cutoff:
          description: |-
            Cutoff is the moment the window closed for this run (RFC3339, UTC): every
            Payment begun at or before it that is not approved lost its Answers. It is
            echoed back because the window is the whole correctness argument — an
            operator staring at an unexpected count should be able to see, without a
            deploy or a database session, which 30 days the job actually used.
          type: string
        payments_purged:
          description: |-
            PaymentsPurged is how many Payments those Answers came off, which is the
            figure that means something in human terms: forty answers off one abandoned
            cart of twenty tickets is one buyer changing their mind, and forty off forty
            Payments is a month of ordinary attrition.
          type: integer
      type: object
    service.AnswerReminderSweepResult:
      properties:
        due:
          description: |-
            Due is how many MAILS this run found to send, after grouping and bounded by
            the batch. It is what the run had to work with, and DueTotal below is what
            there was.
          type: integer
        due_total:
          description: |-
            DueTotal is how many reminders are due across the platform, ignoring the
            batch — the standing backlog, in the sense the purge's answers_held is. Two
            curls a day apart say whether the sweep is keeping up.
          type: integer
        failed:
          description: |-
            Failed is reminders the provider refused. They are NOT recorded in the
            ledger, so the reader is due again on the next tick and has lost nothing.
            This is the number that says a provider is unwell.
          type: integer
        sent:
          description: |-
            Sent is reminders the provider accepted and the ledger recorded. On a
            platform where the feature ships dark and the job ships paused, zero is
            the only answer.

            IT DOES NOT SAY WHO, and adding a breakdown was considered and refused:
            on a platform with one Organization, "two of today's reminders went to
            buyers" is close enough to naming somebody, and an operator diagnosing
            this job needs to know that mail moved rather than who read it.
          type: integer
        skipped:
          description: |-
            Skipped is candidates this run deliberately did not mail: a deployment
            with no Storefront origin to point at, or an address the row does not
            carry. NOTHING WAS SENT and nothing was recorded, so they are due again on
            the next tick — which is right, because the fault is the deployment's
            rather than the reader's.

            A number that stays high is a misconfiguration, not a backlog.
          type: integer
        unrecorded:
          description: |-
            Unrecorded is sends the provider accepted whose ledger rows could not be
            written. It is its own number rather than folded into Failed because it
            means the opposite thing: the reader HAS the mail, and the platform has
            forgotten it sent it, so they may receive one more than the cap intended.

            It should always be zero. A non-zero value is the one outcome of this job
            that is worth waking somebody for, because the rationing is only as true as
            that table.
          type: integer
      type: object
    service.AnswerView:
      description: |-
        Answer is null when this Ticket has not answered this question — which,
        on a required question, is an Outstanding Answer. Null and never a blank
        Answer: "not said" and "said nothing" are different facts, and only the
        first of them is a debt an Organization can chase.
      properties:
        checked:
          type: boolean
        date:
          description: |-
            Date is a calendar date, YYYY-MM-DD. Never an instant: it carries no time
            and no zone, so nothing can shift it by a day.
          type: string
        number:
          description: |-
            Number is a decimal string and not a JSON number, deliberately. JSON
            numbers are IEEE doubles in most readers, and a value that survived a
            NUMERIC column only to be rounded by the browser parsing it would defeat
            the column. The staff app renders the digits; nothing arithmetic happens
            on this side.
          type: string
        options:
          description: |-
            Options are the Options a choice Answer chose, in the order given. Empty
            for the five kinds not answered by choosing.
          items:
            $ref: '#/components/schemas/service.AnswerOptionView'
          type: array
          uniqueItems: false
        text:
          type: string
        updated_at:
          description: |-
            UpdatedAt is when this Answer last changed. The whole of the history this
            platform keeps: no versions, and no record of who changed it.
          type: string
      type: object
    service.AssignmentLinkView:
      properties:
        event_name:
          description: |-
            EventName and TicketTypeName are the two public facts the page shows, as
            on the Answer Link's page and for the same reason: both are already
            readable by anybody on the Event's Storefront page.
          type: string
        holder_first_name:
          description: |-
            HolderFirstName and HolderLastName are the name the platform currently
            holds for this Customer, for the form to start from. Both are empty for
            somebody it has never named.

            THIS IS THE PREFILL, AND IT EXISTS ONLY ON THIS SIDE OF THE CLICK. There is
            no route anywhere that reports it before the accept: a page reachable
            without the click that showed a known Customer's name would be an oracle
            for whether an address is registered, which ADR 0035 is explicit about
            avoiding. The click is what buys it, and the click is proof that the person
            asking is the person asked about.

            SEPARATE HALVES, per ADR 0005, and written to the Customer as their current
            asserted name. There is no Tax ID here and there is no field for one: a Tax
            ID is a fact about the sale's BUYER and is never asked of an attendee.
          type: string
        holder_last_name:
          type: string
        questions:
          description: |-
            Questions is this Ticket Type's Ticket Questions with whatever this Ticket
            has already said — the Holder answering for themselves, which is the whole
            reason the accept step is worth having.

            EMPTY WHILE TICKET_QUESTIONS_ENABLED IS CLOSED, rather than the route
            refusing. The two flags are separate on purpose (ADR 0046), and a Ticket
            Type that asks nothing is an ordinary Ticket Type: accepting is worth doing
            for the guest list alone.
          items:
            $ref: '#/components/schemas/service.TicketQuestionAnswerView'
          type: array
          uniqueItems: false
        ticket_type_name:
          type: string
      type: object
    service.AssignmentReminderSweepResult:
      properties:
        backlog:
          description: |-
            Backlog is how many Sales are due after this run, batch or no batch — the
            number an Operator watches drain during a catch-up.
          type: integer
        due:
          description: Due is how many Sales this run found in its batch.
          type: integer
        failed:
          description: |-
            Failed is how many the provider refused; they stay due and are retried
            next tick, because no ledger row was written.
          type: integer
        sent:
          description: Sent is how many mails the provider accepted.
          type: integer
        skipped:
          description: |-
            Skipped is how many were due but could not be composed — no address, no
            link — and stay due.
          type: integer
        unrecorded:
          description: |-
            Unrecorded is how many were sent but whose ledger row could not be
            written: counted in Sent too, and the one case that can cost a buyer one
            mail over the cap.
          type: integer
      type: object
    service.BeginCheckoutResult:
      properties:
        addressed_to:
          description: |-
            AddressedTo is the address this checkout's Ticket Sale was addressed to, as
            the API resolved it — on the session-gated route (ADR 0054), the address the
            Customer Session proved.

            It is reported back because the Storefront's return leg needs it and has no
            other authoritative source for it (#387). The buyer leaves this origin for
            the Payment Provider, possibly for minutes, and a session can end while they
            are away: a cleared jar, a provider webview that drops cookies, a revoked
            session, a return in another browser. The person who comes back has ALREADY
            PAID, and the address they bought under is what turns "sign in" from a dead
            end into a door — a purchase made under one address and a session held under
            another are different Customers (ADR 0011).

            It grants nothing and proves nothing. Sign-in still costs a passcode or a
            Google round trip; this only spares the buyer typing what they already told
            us. It is reported to the caller that supplied or proved it and to nobody
            else, so no address is disclosed that the request did not already name.
          type: string
        amount_cents:
          type: integer
        client_transaction_id:
          type: string
        confirmation_ref:
          description: |-
            ConfirmationRef is the Sale Confirmation reference, set only on an approved
            checkout — the buyer has their tickets already and this is what they quote.
          type: string
        currency:
          type: string
        redirect_url:
          type: string
        status:
          description: |-
            Status is how the checkout was left: "pending" on the Payment Provider, or
            "approved" when there was nothing to collect and it settled here.
          enum:
          - pending
          - approved
          type: string
      type: object
    service.BuyerTicketAnswersView:
      properties:
        accepted_at:
          type: string
        assignable:
          description: |-
            Assignable is whether this Ticket may be assigned or reassigned right now,
            and AssignableRefusal names why not — a token and never a sentence,
            because the Storefront owns the words in the reader's language.
          type: boolean
        assignable_refusal:
          type: string
        assigned_at:
          description: |-
            AssignedAt is when this address was named, and AcceptedAt when the Holder
            clicked. Both nil when they have not happened.
          type: string
        assignment_state:
          description: |-
            AssignmentState is `unassigned`, `assigned` or `accepted`, derived by
            catalog.AssignmentState and never stored. Absent while the flag is closed.
          type: string
        holder_email:
          description: |-
            HolderEmail is the address this Ticket was assigned to, shown back to the
            buyer who typed it. Empty while unassigned.

            SHOWN TO THE BUYER AND TO NOBODY ELSE ON THIS SURFACE. It is on the payload
            because the buyer typed it and telling their four Tickets apart is the
            whole point of the feature; it is on no public payload, where a third
            party's address would be a disclosure.
          type: string
        ordinal:
          description: |-
            Ordinal is which of its line's units this is, 1..quantity. It is what lets
            the page say "ticket 2 of 4" — the only thing telling two Tickets of one
            line apart until an address is given.
          type: integer
        self_held:
          description: |-
            SelfHeld is whether this Ticket's Holder is the buyer themself — the one
            Ticket an Online Sale hands the buyer at purchase (ADR 0048), or any
            Ticket they later assigned to their own address and accepted. The
            Storefront says "your ticket" on it and draws its questions from the
            held-ticket list; every other Ticket is its Holder's to answer. Absent
            while the assignment flag is closed, like the rest of this block.
          type: boolean
        ticket_id:
          description: |-
            TicketID names which Ticket this is, so the buyer's page can post an
            address back against it and match it to the held-ticket row when the
            Ticket is their own. Safe: this reader proved they own the Sale.
          type: string
        ticket_type_name:
          type: string
      type: object
    service.ConfirmCheckoutResult:
      properties:
        client_transaction_id:
          type: string
        confirmation_ref:
          type: string
        status:
          description: Status is "approved" or "failed".
          type: string
      type: object
    service.ConsentBoxesView:
      description: Boxes is what to show.
      properties:
        marketing_consent:
          type: boolean
        networking_consent:
          type: boolean
        policy_acceptance:
          type: boolean
      type: object
    service.ConsentConfirmationView:
      properties:
        already_resolved:
          description: |-
            AlreadyResolved is true when there was nothing left for this link to
            confirm — a second press, or an answer the owner has since given
            themselves. Not an error, and deliberately not distinguished further: the
            page has nothing useful to say about WHICH of those it was, and the person
            can see their own answers in their Customer Area.
          type: boolean
        digest_enabled:
          description: |-
            DigestEnabled is the Follow Digest as it now stands, so a person who has
            just confirmed a marketing opt-in is told what they will actually receive
            (ADR 0034 — one switch).
          type: boolean
        marketing_consent:
          description: |-
            MarketingConsent and NetworkingConsent are true where this press flipped
            that box from Pending Confirmation to granted.
          type: boolean
        networking_consent:
          type: boolean
      type: object
    service.ConsentRequiredView:
      description: |-
        ConsentRequired carries the short-lived, single-use pending-consent token
        and the boxes to show. Null on an ordinary sign-in.
      properties:
        boxes:
          $ref: '#/components/schemas/service.ConsentBoxesView'
        expires_at:
          description: |-
            ExpiresAt is when that token stops working, RFC 3339. Published so a client
            can say "start again" rather than discovering it by being refused.
          type: string
        pending_consent_token:
          description: |-
            PendingConsentToken is the single-use, short-lived credential that
            exchanges answers for the session this sign-in did not mint. It is a
            server-side row (migration 063), so spending it destroys it.
          type: string
      type: object
    service.ConsentWithdrawalProofView:
      properties:
        expires_at:
          description: |-
            ExpiresAt is when it stops working, RFC 3339, published so a surface can
            say "start again" rather than discovering it by being refused.
          type: string
        pending_consent_token:
          description: |-
            PendingConsentToken is the single-use, short-lived proof of email
            ownership. It is the same credential the sign-in door mints and is spent at
            the same endpoint.
          type: string
      type: object
    service.ConsentWithdrawalView:
      properties:
        marketing_consent:
          description: |-
            MarketingConsent and NetworkingConsent are the states AFTER the act:
            "granted", "denied", "pending_confirmation", or empty for a consent that
            has never been answered and was not named by this submission.
          type: string
        networking_consent:
          type: string
        withdrew:
          $ref: '#/components/schemas/service.ConsentWithdrewView'
      type: object
    service.ConsentWithdrewView:
      description: |-
        Withdrew is what this act actually took away, decided inside the
        transaction that observed the prior state (#266) and never recomputed out
        here. It is the same shape and the same spelling the passcode-only surface
        publishes (#270), because it is the same question.
      properties:
        marketing_consent:
          type: boolean
        networking_consent:
          type: boolean
      type: object
    service.CustomerAreaView:
      properties:
        holding:
          description: |-
            Holding is the Events somebody ELSE bought a ticket for and assigned to
            this Customer, which they accepted (#325, parent #322, ADR 0046).

            A THIRD LIST RATHER THAN ROWS MIXED INTO THE FIRST TWO, and the separation
            is the disclosure rule made structural. These are not this person's
            purchases: the Ticket Sale, the money, the Sale Confirmation and the
            Reversal Window all stayed with the buyer. A held Ticket rendered as a
            TicketSaleView would need an amount, a confirmation reference and a
            reversal offer, and a Holder may see none of them — so it is a different
            shape carrying different facts, and no surface can accidentally draw an
            Undo button on somebody else's purchase.

            Empty for almost everybody, and empty for a Confirmation Link session by
            construction: that credential opens ONE Ticket Sale, and a Ticket held on
            somebody else's sale is not it.
          items:
            $ref: '#/components/schemas/service.HeldTicketView'
          type: array
          uniqueItems: false
        past:
          items:
            $ref: '#/components/schemas/service.TicketSaleView'
          type: array
          uniqueItems: false
        upcoming:
          items:
            $ref: '#/components/schemas/service.TicketSaleView'
          type: array
          uniqueItems: false
      type: object
    service.CustomerOTPRequestResult:
      properties:
        message:
          type: string
      type: object
    service.CustomerProfileView:
      properties:
        avatar_url:
          description: |-
            The Customer's Avatar as a browser-loadable URL, null when they have none.
            Attaching and removing one goes through the avatar endpoints (avatar.go),
            never through the profile PATCH.
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone:
          description: |-
            The Customer's stored phone number in canonical E.164 form, null when they
            have none (#108). Shown here so a person can see, correct, and withdraw the
            number the platform holds about them without starting a checkout — the last
            of which is a capability in its own right, not an oversight.

            Canonical, not split: the Storefront resolves it back into a country
            selection and a national number for display, because that is a presentation
            concern and nothing below the form ever wants the halves (#103).
          type: string
        tax_id_number:
          type: string
        tax_id_type:
          type: string
      type: object
    service.CustomerSessionView:
      properties:
        avatar_url:
          description: |-
            The Customer's Avatar as a browser-loadable URL, null when they have none
            (the Storefront renders initials instead). A URL rather than an object key
            because no client of this view writes Avatars — the header only shows one.
          type: string
        consent_boxes:
          $ref: '#/components/schemas/service.ConsentBoxesView'
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone:
          description: |-
            The Customer's stored phone number in canonical E.164 form, null until they
            have one. It rides on the session for exactly the reason the Tax ID does: the
            checkout dialog prefills the field from here, which is what closes the "give
            it once, never again" loop the phone exists to close (#103, #108). The
            Storefront splits it back into a country selection and a national number for
            display; nothing below the form ever sees the halves.
          type: string
        tax_id_number:
          type: string
        tax_id_type:
          description: |-
            The Customer's stored Tax ID, both halves null until they have one. It is
            here so the Storefront checkout dialog can prefill it beside the email and
            name, which is the whole point of storing one (ADR 0016). Unmasked: it is
            the person's own Tax ID being shown back to the person, behind their own
            session.
          type: string
        ticket_sale_id:
          description: |-
            TicketSaleID is null for a full Customer Session, which spans every Ticket
            Sale the Customer owns. A Confirmation Link session names one sale here.
          type: string
        verified_at:
          type: string
      type: object
    service.DigestSubscriptionView:
      properties:
        digest_enabled:
          type: boolean
      type: object
    service.DrainResult:
      properties:
        claimed:
          description: |-
            Claimed is how many pending Digests this run took out of the queue. Zero is
            the ordinary answer on all but one hour of the week.
          type: integer
        empty:
          description: |-
            Empty is Digests whose Customer's Follows matched nothing they had not
            already been shown. NO EMAIL WAS SENT for these, which is the rule and not
            a failure: an empty Digest teaches its reader to ignore the next one.
          type: integer
        gave_up:
          description: |-
            GaveUp counts the Digests THIS RUN abandoned after exhausting their
            attempts. Each one is a Customer who gets no Digest this week, and it is
            the number worth alerting on.
          type: integer
        oldest_pending_week:
          type: string
        pending_total:
          description: |-
            PendingTotal is how many Digests are still waiting once this run finished,
            and OldestPendingWeek is the week the oldest of them belongs to (a date,
            absent when the queue is empty).

            They are the answer to "is this getting better or worse", and two curls a
            minute apart answer it without a database session. The oldest week is the
            one that matters most: a pending Digest from LAST week is a backlog that
            has outlived the thing it was about.
          type: integer
        pruned:
          description: |-
            Pruned is sent-ledger rows this run dropped because their Event has ended
            (#226). It is housekeeping rather than delivery and it is reported anyway,
            because the alternative is a table whose growth nobody can see until it is
            the reason a Digest is slow to compose.

            A number that stays high tick after tick means the prune is not keeping up
            with what is ending; a number that is zero forever on a live platform means
            it has stopped running at all.
          type: integer
        retrying:
          description: |-
            Retrying is Digests whose delivery failed and which are back in the queue
            on a backoff. It is the number that says a provider is unwell.
          type: integer
        sent:
          description: Sent is Digests delivered and recorded in the sent-ledger.
          type: integer
        skipped:
          description: |-
            Skipped is Digests whose Customer had unsubscribed by the time the drain
            reached them (#224). NOTHING WAS COMPOSED for these, which is what
            separates them from Empty: an empty Digest was worked out and found to say
            nothing, a skipped one was never worked out at all.

            It is its own number for the reason `skipped` is its own status: "their
            Follows matched nothing" is a reason to look at the composition, and "we
            deliberately did not write to this person" is the feature working. An
            operator who could not tell the two apart would read a week of unsubscribes
            as the matching having broken.

            It counts only the narrow window the enqueue filter cannot cover — somebody
            who unsubscribed after their Digest was already queued — so it is
            ordinarily zero even in a week with many unsubscribes.
          type: integer
      type: object
    service.EnqueueResult:
      properties:
        already_enqueued:
          description: |-
            AlreadyEnqueued is the Customers who already had a Digest for this week. It
            is reported rather than swallowed so that a repeated run reads as
            idempotent rather than as a failure that enqueued nothing.
          type: integer
        eligible:
          type: integer
        enqueued:
          type: integer
        week_start:
          description: |-
            WeekStart is the week this run declared, as a date — the Monday that begins
            it in Ecuador's zone (platform.DigestWeekStart). It is echoed back because
            the endpoint takes no arguments, so this is the only way a caller learns
            which week they just enqueued.
          type: string
      type: object
    service.Event:
      properties:
        discoverable:
          type: boolean
        id:
          type: string
        name:
          type: string
        starts_at:
          type: string
        status:
          type: string
      type: object
    service.EventDetail:
      properties:
        cover_image_key:
          type: string
        cover_image_url:
          type: string
        cover_video_key:
          description: |-
            CoverVideoKey and CoverVideoURL are the Event's optional Cover Video: the
            stored object key and the public URL derived from it at read time, never
            stored (ADR 0020).
          type: string
        cover_video_url:
          type: string
        created_at:
          type: string
        description:
          type: string
        discoverable:
          type: boolean
        ends_at:
          type: string
        fee_basis_points:
          type: integer
        fee_handling:
          description: |-
            FeeHandling is the Event's Fee Handling mode, and the two rates are the
            Platform Fee schedule it is read with. The rates travel with the Event so
            the staff forms can show an organizer what a price means for the buyer and
            for their own take-home using the same arithmetic checkout uses (ADR 0014).
          type: string
        fee_iva_basis_points:
          type: integer
        id:
          type: string
        name:
          type: string
        registration_click_count:
          description: |-
            RegistrationClickCount is how many times the hand-off to the Registration
            Link has been made. It counts clicks, never registrations or people: the
            platform loses sight of the buyer at the link and never learns what happened
            next. Read-only here — the redirect owns it, no Event form may write it.
          type: integer
        registration_mode:
          description: |-
            RegistrationMode is how this Event takes sign-ups: 'tickets' or 'external'
            (ADR 0028). RegistrationURL is the Registration Link, null while an external
            Event's registration page is still being built.
          type: string
        registration_url:
          type: string
        slug:
          type: string
        starts_at:
          type: string
        status:
          type: string
        ticket_assignment_enabled:
          description: |-
            TicketAssignmentEnabled is the platform's Ticket Assignment feature flag
            (ADR 0045), riding here for TicketQuestionsEnabled's reason: the staff
            app decides from this payload whether to offer the Holder List entry —
            which the API serves while EITHER flag is open (#333) — and a frontend
            environment variable would be a second copy of the answer, free to
            disagree with the one that matters.
          type: boolean
        ticket_questions_enabled:
          description: |-
            TicketQuestionsEnabled is the platform's Ticket Question feature flag
            (ADR 0045), not a property of this Event — it rides here for the reason
            FeeBasisPoints above does: the Ticket Type editor is composed from this
            payload, and the flag decides whether that editor offers a Ticket Question
            surface at all. Surfacing it lets the staff app hide the section rather
            than render one whose every request would 404, and it keeps the answer in
            ONE place: a second environment variable on the frontend could disagree
            with the backend about whether the feature is on.
          type: boolean
        timezone:
          type: string
        venue_address:
          type: string
        venue_name:
          type: string
      type: object
    service.EventListItem:
      properties:
        created_at:
          type: string
        discoverable:
          type: boolean
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        starts_at:
          type: string
        status:
          type: string
        timezone:
          type: string
      type: object
    service.EventView:
      properties:
        ends_at:
          type: string
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        starts_at:
          type: string
        timezone:
          type: string
        venue_name:
          type: string
      type: object
    service.FollowSuggestionsView:
      properties:
        organizations:
          items:
            $ref: '#/components/schemas/service.SuggestedOrganizationView'
          type: array
          uniqueItems: false
        tags:
          items:
            $ref: '#/components/schemas/service.SuggestedTagView'
          type: array
          uniqueItems: false
      type: object
    service.FollowView:
      properties:
        followed_at:
          type: string
        organization:
          $ref: '#/components/schemas/service.FollowedOrganizationView'
        tag:
          $ref: '#/components/schemas/service.FollowedTagView'
        type:
          type: string
      type: object
    service.FollowedOrganizationView:
      properties:
        logo_url:
          type: string
        name:
          type: string
        slug:
          type: string
      type: object
    service.FollowedTagView:
      properties:
        canonical_key:
          type: string
        curated:
          type: boolean
        name:
          type: string
      type: object
    service.FollowsView:
      properties:
        digest_enabled:
          description: |-
            DigestEnabled is whether the Follow Digest is switched on for this
            Customer (#224, ADR 0030).

            IT RIDES BESIDE THE FOLLOWS RATHER THAN ON AN ENDPOINT OF ITS OWN, and that
            is the point of putting it here. The Customer Area has one sentence to say
            — "the Digest is off, and everything you Follow still stands" — and it is
            one screen; two reads that could disagree is how a Following page comes to
            show an empty list beside a switch that says the mail is on, or a full list
            beside a switch that has not caught up. One read answers both halves, so
            they cannot skew.

            It is also the surface the criterion is written against: unsubscribing must
            leave every Follow "intact and visible in the Customer Area", and this is
            the response that proves both at once.
          type: boolean
        follows:
          items:
            $ref: '#/components/schemas/service.FollowView'
          type: array
          uniqueItems: false
      type: object
    service.HeldTicketAnswersView:
      properties:
        answerable:
          description: |-
            Answerable and AnswerableRefusal are the write window, exactly as on the
            staff and buyer views: false once the Event has started and on a
            reversed Sale, with the refusal as a token the Storefront translates.
            The READ is never gated by it.
          type: boolean
        answerable_refusal:
          type: string
        event_name:
          description: |-
            EventName and EventSlug are the two public facts about the Event — both
            already readable on the Storefront — that let the panel say which Event
            this Ticket is for and link there.
          type: string
        event_slug:
          type: string
        outstanding_count:
          description: |-
            OutstandingCount is how many required questions this Ticket has not yet
            answered — what keeps the panel open (ADR 0049).
          type: integer
        questions:
          description: |-
            Questions carries the Ticket Type's questions in the order they are
            asked, retired ones last, each with this Ticket's Answer or null.
          items:
            $ref: '#/components/schemas/service.TicketQuestionAnswerView'
          type: array
          uniqueItems: false
        ticket_id:
          description: |-
            TicketID names which Ticket this is, so the panel can write back against
            it and the buyer's sale page can match it to its row. Safe: the reader
            holds it.
          type: string
        ticket_type_name:
          description: |-
            TicketTypeName is the only thing telling two held Tickets on one Event
            apart that this reader is entitled to. NOT the ordinal: "2 of 4" is a
            fact about the Sale's other Tickets.
          type: string
      type: object
    service.HeldTicketView:
      properties:
        accepted_at:
          description: AcceptedAt is when they accepted, RFC3339 in UTC.
          type: string
        event:
          $ref: '#/components/schemas/service.EventView'
        organization:
          $ref: '#/components/schemas/internal_customers_service.OrganizationView'
        ticket_id:
          description: |-
            TicketID is this person's handle on the thing they hold. It is not a
            credential: every route that acts on a Ticket is reached either by a signed
            token or by the buyer's own session, and neither takes an id from here.
          type: string
        ticket_type_name:
          description: |-
            TicketTypeName is what kind of ticket it is — public, and a row on the
            Event's own page with its price beside it. What is NOT here is the price
            this Ticket was actually sold at, which a Promotion may have made different
            and which is the buyer's business either way.
          type: string
      type: object
    service.HolderAddressPurgeResult:
      properties:
        addresses_held:
          description: |-
            AddressesHeld is how many unaccepted holder addresses are sitting on
            Tickets across the platform once this run finished — the standing backlog,
            in the Reconciler's sense.

            IT IS WHAT MAKES A RUN THAT DELETED NOTHING LEGIBLE. Zero purged and a
            rising held figure is a healthy job on a platform whose Events have not
            started yet; zero purged and zero held is a platform where nobody is
            assigning anything. Neither is the same as a scheduler that is paused, and
            the log line below is where that distinction is actually recorded.
          type: integer
        addresses_purged:
          description: |-
            AddressesPurged is how many holder addresses this run took. Zero is the
            ordinary answer, and while TICKET_ASSIGNMENT_ENABLED is closed it is the
            only answer.
          type: integer
        events_purged:
          description: |-
            EventsPurged is how many Events those addresses came off, which is the
            figure that means something in human terms: forty addresses off one Event
            is a festival that has just happened, and forty off forty Events is a
            month of ordinary attrition.
          type: integer
        purged_at:
          description: |-
            PurgedAt is the instant this run read the clock at (RFC3339, UTC): every
            Event that had started by it lost the addresses nobody had accepted.

            Echoed back because the moment is the whole correctness argument, exactly
            as the Abandoned Answer Purge echoes its cutoff. An operator staring at an
            unexpected count should be able to see, without a deploy or a database
            session, which instant the job actually compared Event starts against.
          type: string
      type: object
    service.HolderListPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/service.HolderTicketView'
          type: array
          uniqueItems: false
        outstanding_count:
          description: |-
            OutstandingCount is how many Outstanding Answers the Event carries in ALL
            — debts, not Tickets, so a Ticket owing three counts three. It is the
            whole Event and never the page, because "how much don't I know yet" is a
            question about the Event. It is unaffected by the owingOnly filter, for
            the same reason.

            A POINTER, ABSENT WHILE TICKET_QUESTIONS_ENABLED IS CLOSED. This list is
            readable on assignment alone (#333), and a build in that state must not
            speak of debts a dark feature cannot define (ADR 0045).
          type: integer
        pagination:
          $ref: '#/components/schemas/service.OutstandingPagination'
      type: object
    service.HolderTicketView:
      properties:
        assignment_state:
          description: |-
            AssignmentState is `unassigned`, `assigned` or `accepted`, derived by
            catalog.AssignmentState and never stored.

            IT IS THE FIELD THAT MAKES THE REST READABLE, and the reason it is on the
            wire at all: a name arrives only with acceptance, so without the state an
            `assigned` Ticket whose Holder never clicked would be indistinguishable
            from one nobody was ever named for — and those are opposite facts to an
            Organizer deciding whether to chase.

            THREE VALUES AND NEVER FOUR. A Ticket whose unaccepted address the
            retention purge has taken (migration 081) reads `assigned` here, with
            NeverAccepted set beside it — see fillHolderListEntry.
          type: string
        channel:
          description: |-
            Channel is 'online', 'in_person' or 'import', and it EXPLAINS the row
            rather than filtering it. A door sale and a Sale Import start out owing
            every question because nobody ever put the questions to those buyers —
            there is no checkout form on either. They stand here beside the online
            ones, and the channel is what stops that reading as lost data.
          type: string
        confirmation_ref:
          type: string
        customer_email:
          type: string
        customer_first_name:
          description: |-
            The buyer: the party of record for the Sale, and the person to chase for
            any Ticket nobody has accepted. They are no longer the only one — an
            accepted Ticket names its Holder below — but they remain here on every row,
            because a Holder is the named person a Ticket was handed to and never its
            owner, and the Sale stays whole with the buyer either way.

            The two name parts stay APART, as they are on the Sales list and in the
            column they are read from. Joining them here would mean choosing an order
            for them, and which part leads a person's name is the reader's question and
            not this payload's.
          type: string
        customer_last_name:
          type: string
        holder_email:
          type: string
        holder_first_name:
          description: |-
            HolderFirstName, HolderLastName and HolderEmail are the person a Ticket was
            handed to, and they are filled ONLY once that person has ACCEPTED.

            THE DISCLOSURE RULE IS DECIDED HERE AND NOWHERE ELSE — see
            fillHolderListEntry, which is the one place to change if it is ever
            revisited. The address is disclosed deliberately and at a stated cost (ADR
            0047): an Organizer needs a way to reach the people attending its Event,
            and a name it cannot write to leaves it routing through buyers by hand,
            which is the problem assignment was built to end.
          type: string
        holder_last_name:
          type: string
        never_accepted:
          description: |-
            NeverAccepted marks a Ticket whose assignment the retention purge closed:
            somebody was named, nobody ever accepted, and the address is gone by
            definition (#334, migration 081).

            A PRESENTATION-LEVEL INDICATOR DERIVED AT READ TIME from
            holder_address_purged_at — deliberately NOT a fourth value in
            catalog.AssignmentState, which #331 rightly rejected. It exists because
            after the Event starts every unaccepted assignment otherwise reads
            `unassigned`, and the morning-after sheet could not distinguish "nobody
            was named" from "named and never claimed". It discloses nothing personal.
          type: boolean
        ordinal:
          description: |-
            Ordinal is which of its Ticket Sale Line's units this Ticket is,
            1..quantity. Internal and not a seat number, but the only thing telling
            two Tickets of one line apart — which is what lets staff say "the second
            of Ana's four".
          type: integer
        outstanding:
          description: |-
            Outstanding names the required questions this Ticket has not answered, in
            the order they are asked. Empty on a Ticket that owes nothing — which
            since #333 is an ordinary row of this list, not an absent one.

            A POINTER, ABSENT WHILE TICKET_QUESTIONS_ENABLED IS CLOSED, for
            OutstandingCount's reason — and a pointer to a slice rather than an
            `omitempty` slice so that "owes nothing" still reads as `[]` on the wire:
            a typed reader that has to check for null before iterating is a reader
            that will one day forget.
          items:
            $ref: '#/components/schemas/service.OutstandingQuestionView'
          type: array
          uniqueItems: false
        sold_at:
          type: string
        ticket_id:
          type: string
        ticket_sale_id:
          description: |-
            TicketSaleID and ConfirmationRef are how this row is ACTED ON. The staff
            Answers dialog is keyed on a Ticket Sale and names itself after the
            buyer's reference, so a row carrying neither would be a complaint nobody
            could act on. This is the jump from the list to answering the Ticket.
          type: string
        ticket_type_id:
          type: string
        ticket_type_name:
          type: string
      type: object
    service.MembershipView:
      properties:
        member_id:
          type: string
        organization_id:
          type: string
        organization_logo_url:
          type: string
        organization_name:
          type: string
        organization_slug:
          type: string
        role:
          type: string
      type: object
    service.OTPRequestResult:
      properties:
        message:
          type: string
      type: object
    service.OperatorConsentStateView:
      properties:
        marketing_consent:
          type: string
        networking_consent:
          type: string
        policy_accepted_at:
          description: |-
            PolicyAcceptedAt is when this Customer last accepted a Policy Version,
            RFC 3339, null where no acceptance was ever recorded.

            It is shown and is NOT actionable. Policy Acceptance is not withdrawable
            (ADR 0038): it is absent from counsel's form, it gates the platform on a
            basis other than consent, and clearing it would re-gate the person rather
            than free them.
          type: string
      type: object
    service.OperatorCustomerConsentView:
      properties:
        consent:
          $ref: '#/components/schemas/service.OperatorConsentStateView'
        customer:
          $ref: '#/components/schemas/service.OperatorCustomerIdentity'
        withdrew:
          $ref: '#/components/schemas/service.OperatorWithdrewView'
      type: object
    service.OperatorCustomerIdentity:
      properties:
        email:
          type: string
        first_name:
          description: |-
            FirstName and LastName as the platform holds them, so an Operator can
            check the name on the form against the record before acting on it.
          type: string
        id:
          type: string
        last_name:
          type: string
      type: object
    service.OperatorPayout:
      properties:
        amount_cents:
          type: integer
        created_at:
          type: string
        id:
          type: string
        note:
          type: string
        paid_at:
          type: string
        recorded_by:
          type: string
      type: object
    service.OperatorPayoutRequestProfile:
      properties:
        account_holder_name:
          type: string
        account_number_masked:
          description: |-
            AccountNumberMasked is "····4821". The field is named for what it holds,
            so no future reader mistakes it for something they can pay to.
          type: string
        account_type:
          description: |-
            AccountType is 'ahorros' or 'corriente': the word the receiving bank's own
            form uses, and no part of the account's identity.
          type: string
        bank_name:
          type: string
      type: object
    service.OperatorPayoutRequestWhole:
      properties:
        amount_cents:
          type: integer
        id:
          type: string
        note:
          type: string
        payable_balance_cents:
          description: |-
            PayableBalanceCents is what the Organization could have asked for at the
            moment it asked. It is a snapshot and never refreshed: the live figure
            moves, and the difference between the two is exactly what an operator needs
            in order to exercise the judgement the cap deliberately leaves to them.
          type: integer
        payout_id:
          type: string
        payout_profile:
          $ref: '#/components/schemas/service.PayoutRequestProfile'
        requested_at:
          type: string
        requested_by:
          description: RequestedBy is the asker's email, so the record outlives their
            Membership.
          type: string
        resolution_reason:
          description: |-
            The answer, all null while the request is pending or processing.
            ResolutionReason says why the request ended the way it did — a decline the
            platform made, or a failure the bank did — and PayoutID only on a payment
            (#177, #185).
          type: string
        resolved_at:
          type: string
        resolved_by:
          type: string
        status:
          type: string
        transfer_reference:
          description: |-
            TransferReference is the string the bank handed back to identify the
            transfer — the handle for chasing PayPhone about a specific one.
          type: string
        transfer_stale:
          description: |-
            TransferStale is the 72-hour flag: true when this request is `processing`
            and the transfer was submitted more than sales.PayoutTransferStaleAfter
            before the service's injected clock.

            COMPUTED AT READ TIME AND STORED NOWHERE. It is false for every other
            status by construction, so a paid request that took four days does not read
            as a problem after the fact — the flag is about a transfer nobody has
            confirmed, not about one that was slow.
          type: boolean
        transfer_submitted_at:
          description: |-
            TransferSubmittedAt is when an operator submitted the transfer, and null on
            a request that never went through `processing` — including one that went
            `pending → paid` directly, which is an instant transfer and legal.

            IT IS THE DATE THAT MAKES "up to 48 hours" CHECKABLE. Without it the
            organizer's sentence is boilerplate they cannot act on: they would know a
            transfer was sent and have no way to tell whether the wait has already
            outrun what they were promised. That is the whole reason this field is on
            the organizer's surface at all (#187).

            Its two companions on the row are deliberately NOT here, and the omission
            is of a piece with OrganizationID above rather than any kind of masking —
            nothing is masked on an Organization's own surface. TransferSubmittedBy
            answers "which colleague do I ask about this transfer", which is an
            operator's question about an internal handoff (ADR 0026 amendment); the
            organizer's question is whether their money is coming, and an operator's
            email is not the answer to it. TransferReference is the handle for chasing
            PayPhone about a specific transfer, and handing an organizer a reference
            their own bank cannot look up invites them to quote it at a teller who has
            never heard of it. Either can be added the day somebody wants it; neither
            is wanted yet.
          type: string
        transfer_submitted_by:
          description: |-
            TransferSubmittedBy is a different actor from ResolvedBy and is exposed
            beside it rather than folded into it: the operator who submits and the
            operator who confirms may be different people days apart, and an operator
            picking up a three-day-old request needs to know which colleague to ask.
          type: string
      type: object
    service.OperatorReversalMemo:
      description: |-
        OperatorReversal is the money memo an Operator Reversal left (#125), and
        null on every sale reversed any other way. It is operator-facing only: it
        rides this payload, which nobody but a Platform Operator can reach, and no
        Organization-facing surface carries it.
      properties:
        note:
          type: string
        operator:
          description: |-
            Operator is the acting operator's email, as their Staff Session knows it.
            Never taken from a request body: who asserted a money fact must not be
            something a caller can claim.
          type: string
        platform_fee_kept:
          type: boolean
        refunded_amount_cents:
          type: integer
      type: object
    service.OperatorSaleCustomer:
      properties:
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
      type: object
    service.OperatorSaleEvent:
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        starts_at:
          description: |-
            StartsAt is null on an Event with no schedule. An Online Sale always has
            one — publishing requires it — but this lookup reaches every Sales Channel,
            and an imported sale can belong to a draft Event.
          type: string
        timezone:
          description: |-
            Timezone is the EVENT's own zone, which interprets its schedule. It is not
            the platform's Ecuadorian clock, which is what the Reversal Window's cutoff
            is stated in; the two are never the same thing.
          type: string
      type: object
    service.OperatorWithdrewView:
      description: |-
        Withdrew is what the act on this request TOOK AWAY, and is null on the
        lookup, which took nothing away because it performed nothing.

        It is reported rather than left for the caller to infer from the state
        beside it, because it cannot be inferred: `denied` reads the same whether
        somebody just gave something up or was already refusing. It is also the
        answer to "was anybody written to?" — the confirmation mail is sent on
        exactly this predicate.
      properties:
        marketing_consent:
          type: boolean
        networking_consent:
          type: boolean
      type: object
    service.OptionalConsentsView:
      description: |-
        Consents is the pair as it now stands: the same shape every other act on
        this surface answers with, so the page cannot describe the same two facts
        in two ways.
      properties:
        marketing_consent:
          description: |-
            MarketingConsent is "granted", "denied", "pending_confirmation" or
            "unanswered".
          type: string
        networking_consent:
          description: NetworkingConsent is the same four.
          type: string
      type: object
    service.Organization:
      properties:
        created_at:
          type: string
        currency:
          type: string
        id:
          type: string
        name:
          type: string
        slug:
          type: string
      type: object
    service.OrganizationDetail:
      properties:
        events:
          items:
            $ref: '#/components/schemas/service.Event'
          type: array
          uniqueItems: false
        organization:
          $ref: '#/components/schemas/service.Organization'
        payable_balance_cents:
          description: |-
            PayableBalanceCents is the part of the Withdrawable Balance that has
            cleared — sales recorded before today in Ecuador with no Reversal Request
            still open (ADR 0026). Signed, never clamped, and never larger than the
            figure above it. It is shown to the operator and gates nothing they do.
          type: integer
        payout_requests:
          description: |-
            PayoutRequests is this Organization's own request history, newest first and
            with its account numbers masked (#176). It sits beside the payout history
            because that is the question it answers: has this Organization been paid
            recently, and are they asking again? (ADR 0026)
          items:
            $ref: '#/components/schemas/service.PayoutRequestSummary'
          type: array
          uniqueItems: false
        payouts:
          items:
            $ref: '#/components/schemas/internal_operator_service.Payout'
          type: array
          uniqueItems: false
        withdrawable_balance_cents:
          type: integer
      type: object
    service.OrganizationList:

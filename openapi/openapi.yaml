  /api/v1/staff/organization/payout-profile:
    get:
      description: Returns the acting Member's Organization's Payout Profile — the
        bank, whether the account is `ahorros` or `corriente`, the account number,
        the name on the account, and the Organization's own Tax ID for the factura
        (ADR 0026). The data payload is `null` when the Organization has never recorded
        one, which is an ordinary state rather than an error. The account number is
        returned whole, because this is the Organization's own editor; masking belongs
        to the operator surfaces that show many Organizations at once. Org Admin only
        — an Event Owner or Event Staff is refused.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopePayoutProfile'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Get the Organization's Payout Profile
      tags:
      - staff
    put:
      description: Records where the acting Member's Organization is paid, replacing
        any existing profile — there is at most one per Organization (ADR 0026). Every
        field is required. The account number is normalised by stripping spaces and
        dashes and must then be digits only; its leading zeros are preserved exactly,
        because an account number that loses one reaches the wrong account. The Tax
        ID identifies the party being paid and invoiced, so it is `cedula` or `ruc`
        and never `passport`, validated with the same check digits as a buyer's Tax
        ID (ADR 0016). Bad fields come back one by one as VALIDATION_FAILED, naming
        the field and never echoing what was typed. Org Admin only.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.payoutProfileBody'
                description: Payout Profile
                summary: request
        description: Payout Profile
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopePayoutProfile'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Set the Organization's Payout Profile
      tags:
      - staff
  /api/v1/staff/organization/payout-requests:
    get:
      description: 'Returns the acting Member''s Organization''s Payout Requests,
        newest first, for the request history shown beside the payout history (ADR
        0026). Each carries the amount asked for, the optional note, the status (`pending`,
        `processing` while the transfer has been submitted but not yet confirmed,
        then `paid`, `failed`, `declined` or `cancelled`), the asker''s email, the
        Payable Balance as it stood at the moment of asking, the frozen snapshot of
        the six Payout Profile fields the ask was made against — which no later profile
        edit alters — and, once answered, the resolver''s email, the resolution instant,
        the reason it ended that way on a decline or a failure, and the id of the
        Payout that settled it. No currency is returned: a request is always in the
        Organization''s own currency, which the payouts summary this history sits
        beside states once. Org Admin only.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopePayoutRequests'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: List the Organization's Payout Requests
      tags:
      - staff
    post:
      description: 'Records the acting Member''s Organization''s ask to be paid (ADR
        0026): an amount in the Organization''s currency, an optional note, and the
        bank details to pay it to. The bank details may be supplied as `payout_profile`
        — the request form is the Payout Profile editor, so anything sent there is
        validated exactly as PUT /staff/organization/payout-profile validates it and
        SAVED to the profile as well as snapshotted onto the request. Omit `payout_profile`
        to be paid where the stored profile says; a complete profile is required either
        way, and an Organization with none is refused with VALIDATION_FAILED naming
        each missing field. The ask is bounded by the Payable Balance AT THE MOMENT
        IT IS MADE and never again — one cent above it is refused with PAYOUT_REQUEST_EXCEEDS_PAYABLE_BALANCE,
        and the balance moving afterwards changes nothing about a recorded request.
        An Organization may have only one request outstanding at a time, enforced
        by a partial unique index: a second submission while one is OUTSTANDING —
        `pending`, or `processing` because an operator has submitted the transfer
        and the bank has not confirmed it — returns 200 with the EXISTING request
        rather than a conflict, so an organizer learns where their earlier ask went,
        and nothing about the outstanding request is edited by it. A newly recorded
        request returns 201. The request snapshots the six profile fields and the
        Payable Balance as they stood, and no later profile edit alters them. The
        asker is recorded as an email, so the record outlives their Membership. A
        request moves no money: no balance, no aggregate and no revenue figure knows
        requests exist. Org Admin only.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.payoutRequestBody'
                description: Payout Request
                summary: request
        description: Payout Request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopePayoutRequest'
          description: OK
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopePayoutRequest'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
      security:
      - BearerAuth: []
      summary: Submit a Payout Request
      tags:
      - staff
  /api/v1/staff/organization/payout-requests/{requestId}/cancel:
    post:
      description: 'Withdraws the acting Member''s Organization''s outstanding Payout
        Request (ADR 0026). Cancelling is the only change an Organization can make
        to a pending request — it cannot be edited, only cancelled and re-asked, which
        is what keeps "outstanding" singular and stops an operator looking at a figure
        that changed under them. The row is kept and moves to `cancelled`, stamped
        with the cancelling Member''s email and the instant, which frees the Organization
        to submit a new request. It is a compare-and-swap on the PENDING state, and
        only that state: ONCE AN OPERATOR HAS SUBMITTED THE TRANSFER the request is
        `processing` and can no longer be cancelled — the bank is already acting on
        the ask, and withdrawing it would leave a confirmed transfer with nothing
        to attach it to — so it is refused with 409 PAYOUT_REQUEST_NOT_PENDING whose
        message says the transfer is already being processed and may take up to 48
        hours. A request an operator paid or declined in the meantime is refused the
        same way, naming the state it actually reached, and a request that is not
        this Organization''s is 404 PAYOUT_REQUEST_NOT_FOUND. Nothing is ever locked.
        Org Admin only.'
      parameters:
      - description: Payout Request ID
        in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopePayoutRequest'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
      security:
      - BearerAuth: []
      summary: Cancel an outstanding Payout Request
      tags:
      - staff
  /api/v1/staff/organization/payouts:
    get:
      description: 'Returns the acting Member''s Organization''s Withdrawable Balance
        — the Net Proceeds of its active Online Sales (each line''s unit price minus
        the Platform Fee and Fee IVA snapshotted on it) minus every recorded Payout
        — and its Payable Balance, the same arithmetic counting only the sales that
        have cleared: those recorded before today in America/Guayaquil with no Reversal
        Request still open on them (ADR 0026). Both are in the Organization currency
        and both are signed: a sale reversed after a settlement makes them negative,
        and that is shown as-is. Cleared sales are a subset, so payable_balance_cents
        never exceeds withdrawable_balance_cents; the gap is money the platform holds
        but has not yet cleared, and a fully settled Organization that sold today
        shows a negative Payable Balance beside a positive Withdrawable one. The payout
        history follows, newest first. Read-only from this side: a Payout is recorded
        by a Platform Operator on the operator surface (ADR 0015), and appears here
        unchanged. Org Admin only.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopePayoutsSummary'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Get the Organization's balances and payout history
      tags:
      - staff

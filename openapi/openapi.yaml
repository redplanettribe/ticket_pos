  /api/v1/customer/auth/consent:
    post:
      description: 'Spends the short-lived, single-use `pending_consent_token` from
        a verify response, or from the Consent Withdrawal passcode door, on ONE of
        two acts — decided by the API from the submission''s contents and never by
        the form that sent it. POLICY ACCEPTANCE IS REQUIRED UNLESS EVERY ANSWER PRESENT
        IN THE SUBMISSION IS A DENIAL (ADR 0039). A submission mentioning `policy_acceptance`
        at all — true or false — one containing any grant, and one carrying no answer
        at all are all sign-in submissions, and a sign-in submission without acceptance
        is refused with POLICY_ACCEPTANCE_REQUIRED exactly as before; a submission
        whose only answers are `false` is a Consent Withdrawal and needs no acceptance,
        because an act that grants nothing, opens nothing and authorizes nothing has
        no processing for an acceptance to have informed anybody about. FINISHING
        A SIGN-IN writes the immutable Consent Record first — answers, channel, Policy
        Version, and the technical proof (IP, user agent, session, origin URL) — and
        mints the session on the far side of it, so nobody is ever signed in without
        evidence of what they authorized; `marketing_consent` and `networking_consent`
        default to false there, and false is an explicit No that records `denied`
        and, for marketing, switches the weekly Follow Digest off (ADR 0034); answers
        for boxes the Customer was not shown are ignored, so standing optional answers
        are never churned; an optional `follow` carries a Follow intent, honoured
        against the session this call mints exactly as on the verify routes; the response
        carries `session` and `session_id`. WITHDRAWING carries no `policy_acceptance`
        and names only the consents to take away, each as `false` — an omitted consent
        is not on the submission and is left exactly as it stands, so a bare token
        withdraws nothing and is refused. It MINTS NO CUSTOMER SESSION: the response
        carries `withdrawal` with the state of each optional consent afterwards and
        what the act actually took away, and `session`, `session_id`, `consent_required`
        and `follow` are all null. It can only ever move a consent to `denied` — no
        submission on this path can grant a consent, accept a Policy Version or open
        a session — so an intercepted passcode buys nothing its owner cannot undo
        from their own account. A withdrawal that moved a consent out of `granted`
        or `pending_confirmation` writes its Consent Record with the prior state and
        is confirmed to the Customer by email in their Mail Locale; one that moved
        nothing records the act and sends nothing. The Policy Version is resolved
        server-side and is never accepted from the request. The token is spent whatever
        the outcome and whichever act was attempted, so a refused submission is restarted
        by proving the address again; abandoning the step records nothing and leaves
        no session at all.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.consentSubmitBody'
                description: Pending consent token and answers
                summary: body
        description: Pending consent token and answers
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerConsentSubmission'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      summary: Submit sign-in consent, or withdraw consent
      tags:
      - customer
  /api/v1/customer/auth/google/verify:
    post:
      description: Exchanges an authorization code obtained on the Storefront at Google's
        token endpoint, and issues a Customer Session on the email address Google
        vouches for. Marks the Customer verified by the same rule a passcode does.
        An optional `locale` is remembered as the Customer's Mail Locale, exactly
        as on the passcode route. An optional `follow` carries a Follow intent and
        is honoured exactly as on the passcode route, because both doors are equal
        Proof of Email Ownership. Every failure returns one generic error, so the
        route reveals nothing about which addresses the platform knows.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_customers_handler.googleVerifyBody'
                description: Authorization code, PKCE verifier and redirect URI
                summary: body
        description: Authorization code, PKCE verifier and redirect URI
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerVerifyGoogle'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      summary: Verify a Google Sign-In
      tags:
      - customer
  /api/v1/customer/auth/logout:
    post:
      description: Destroys the Customer Session. The token is worthless immediately;
        a Staff Session is unaffected.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerLogout'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Customer sign-out
      tags:
      - customer
  /api/v1/customer/auth/otp/request:
    post:
      description: 'Sends a one-time passcode for Customer sign-in. The response is
        identical whether or not the email is known, so it does not reveal who the
        platform''s Customers are. An optional `locale` names the language of the
        Storefront page the passcode was asked from and words that one email only:
        it does not update the Customer''s stored Mail Locale, which only a completed
        sign-in writes. A language the platform does not serve is ignored rather than
        refused, and the passcode is sent in English.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_customers_handler.otpRequestBody'
                description: Email address
                summary: body
        description: Email address
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerOTPRequest'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Too Many Requests
      summary: Request Customer passcode
      tags:
      - customer
  /api/v1/customer/auth/otp/verify:
    post:
      description: 'Verifies a Customer one-time passcode, marks the Customer verified,
        and issues a Customer Session. An optional `locale` names the language of
        the Storefront the sign-in happened on and is remembered as the Customer''s
        Mail Locale; a language the platform does not serve is ignored rather than
        refused. An optional `follow` carries a Follow the visitor pressed before
        signing in, as `organization:<slug>`. It is applied against the Customer Session
        this call mints and against nothing else, so an email in this request can
        never become the address that gets subscribed; the Follow that was made comes
        back in `follow`, or null. A malformed intent — an unknown kind, or a subject
        that is not a well-formed slug — is refused with 400 before the passcode is
        checked, so it does not spend it. A subject that resolves to nothing does
        not fail the sign-in: the session is issued and `follow` is null.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_customers_handler.otpVerifyBody'
                description: Email and passcode
                summary: body
        description: Email and passcode
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerVerifyOTP'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Too Many Requests
      summary: Verify Customer passcode
      tags:
      - customer
  /api/v1/customer/auth/session:
    get:
      description: 'Returns which email the caller is signed in as, and extends the
        sliding session window. consent_boxes reports which consent checkboxes a capture
        surface must still show this Customer — the checkout dialog reads it here
        so that who is buying and what may still be asked of them come from one snapshot
        of one session (#254). A box is true when its answer is outstanding: policy_acceptance
        when there is no acceptance of the CURRENT Policy Version, and each optional
        consent when its state is unanswered, with a Pending Confirmation counting
        as unanswered because somebody else''s tick is not the owner''s answer (ADR
        0035). It never says what to pre-tick; boxes are always drawn unticked. A
        Confirmation Link session (ticket_sale_id set) reports all three true whatever
        the stored state says: it is minted from a forwarded email rather than from
        Proof of Email Ownership, so a capture under it is treated as a guest''s on
        the write side too.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerSession'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Get Customer Session
      tags:
      - customer
  /api/v1/customer/consent/confirm:
    post:
      description: 'Confirms the optional consents (Marketing, Networking) that a
        guest checkout left in Pending Confirmation, for the Customer named by a signed,
        non-expiring confirmation token carried in their Sale Confirmation email.
        Requires no sign-in and accepts no credential: pressing a link sent to that
        address is itself the proof of ownership the guest''s tick lacked (ADR 0035),
        and a guest buyer may have no account to sign in to. It flips only what the
        token was minted for AND is still pending, so a press cannot resurrect an
        answer the owner has since given themselves — a later proven answer outranks
        an older pending. Idempotent and never an error when there is nothing left
        to confirm: a second press, or a press against state the owner has already
        resolved, answers 200 with already_resolved. Granting Marketing Consent turns
        the weekly Follow Digest on in lockstep (ADR 0034), and every press that changes
        something writes an immutable Consent Record on the email_confirmation channel.
        Deliberately a POST with no GET counterpart, so that a mail security scanner
        prefetching the link cannot grant consent nobody gave; a GET is answered 405.
        A malformed, forged, or wrong-purpose token is CONSENT_CONFIRMATION_LINK_INVALID.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.consentConfirmationBody'
                description: Signed consent confirmation token
                summary: body
        description: Signed consent confirmation token
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerConsentConfirmation'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
      summary: Confirm a pending consent from a Sale Confirmation link
      tags:
      - customer
  /api/v1/customer/consent/withdrawal/passcode/verify:
    post:
      description: 'Redeems a Customer one-time passcode for the short-lived, single-use
        `pending_consent_token` that a Consent Withdrawal is submitted with, for a
        Customer who will not or cannot sign in (ADR 0039). IT MINTS NO CUSTOMER SESSION
        AND NEVER CAN — not for a Customer who owes a Policy Acceptance, and not for
        one who has accepted the current edition and would have been signed straight
        in by the ordinary verify — so proving an address in order to withdraw does
        not leave anybody logged in on a shared machine. The passcode is the ordinary
        Customer passcode requested at /api/v1/customer/auth/otp/request, redeemed
        here instead of at the verify: it is proof of email ownership either way,
        so the Customer record is created or reused and marked verified exactly as
        a sign-in would, and an optional `locale` is remembered as the Customer''s
        Mail Locale, which is the language the withdrawal''s confirmation email is
        written in. The token it returns is the same credential a held sign-in returns
        and is spent at the same endpoint, /api/v1/customer/auth/consent, where a
        submission whose every answer is a denial needs no `policy_acceptance` and
        one containing any grant still does. Nothing about a Customer is disclosed
        here: the response is the token and its expiry, never their consent state,
        and a wrong passcode fails exactly as it fails on the sign-in door.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.consentWithdrawalProofBody'
                description: Email and passcode
                summary: body
        description: Email and passcode
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerConsentWithdrawalProof'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Too Many Requests
      summary: Prove email ownership to withdraw consent
      tags:
      - customer
  /api/v1/customer/digest:
    put:
      description: 'Sets whether the signed-in Customer receives the weekly Follow
        Digest, and returns the switch as it now stands. This is the Customer Area''s
        toggle beside the Following list, and it is the only way to turn the Digest
        back ON — the unsubscribe link is unauthenticated because somebody who wants
        quiet must be able to have it without signing in, and none of that argument
        applies to switching somebody''s mail back on. Changes no Follow either way:
        the list is exactly as it was, and a Customer who turns the Digest off keeps
        everything they Followed. Requires a full Customer Session; a Confirmation
        Link session is refused with CUSTOMER_SESSION_SCOPE_INSUFFICIENT, because
        a forwarded receipt is not authority to subscribe that inbox to weekly mail.
        Takes the state asked for rather than flipping, so a retried or double-tapped
        request means the same thing once.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.digestSubscriptionBody'
                description: Whether the Digest is on
                summary: body
        description: Whether the Digest is on
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerDigestSubscription'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Turn the Follow Digest on or off
      tags:
      - customer
  /api/v1/customer/follow-suggestions:
    get:
      description: 'Returns Tags and Organizations the signed-in Customer does not
        Follow. Ranked first by Co-occurrence with the Tags the Customer Follows —
        two Tags co-occur when one Event carries both, and an Organization is related
        to a Tag when its upcoming Events carry it. The Tags carried by the upcoming
        Events of the Organizations the Customer Follows seed that ranking too, as
        derived Tags weighted below the Tags the Customer chose, and a derived Tag
        is itself never offered back to that Customer. Tag scores are normalised by
        a damped function of each candidate''s own Activity so a Tag riding alongside
        nearly everything is not offered to everyone, and Organization scores left
        unnormalised because an Organization spans only its own programme. Co-occurrence
        is a fact about the catalogue and never about other Customers; no Follows
        but the reader''s own are read. Remaining slots fall back to Activity — the
        count of discoverable upcoming Events carrying a Tag or run by an Organization,
        over exactly the subset the public explorer lists — which is the whole ranking
        for a Customer who Follows nothing at all. Activity measures supply and never
        audience: it counts Events, and no follower count is computed, stored or exposed.
        Two groups rather than one interleaved list, because a Tag''s rank and an
        Organization''s are not the same unit; subjects reuse the shapes the Follows
        listing publishes. Each entry carries the reason it was chosen, naming the
        producing Tag by canonical key so no language crosses the wire — null on anything
        ranked by Activity, which has no producing Tag. Subjects the Customer already
        Follows are excluded, a Custom Tag needs more than one upcoming Event to qualify,
        and an Organization with nothing upcoming never appears. Both orderings are
        total. An empty result is a 200 with empty groups, never an error. Requires
        a full Customer Session: a Confirmation Link session is refused with CUSTOMER_SESSION_SCOPE_INSUFFICIENT,
        because what a person is suggested is derived from what they Follow, which
        is private to them.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerFollowSuggestions'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: List Suggested Follows
      tags:
      - customer
  /api/v1/customer/follows:
    get:
      description: 'Returns everything the signed-in Customer Follows, most recently
        followed first. One list rather than one per kind: each entry carries a `type`
        discriminator and the subject hangs off the field named by it, so a client
        switches on `type` and keeps working as further kinds of Follow are added.
        Always scoped by the Customer Session, never by any identifier in the request.
        Requires a full Customer Session: a Confirmation Link session is refused with
        CUSTOMER_SESSION_SCOPE_INSUFFICIENT.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerFollows'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: List the Customer's Follows
      tags:
      - customer
  /api/v1/customer/follows/organizations/{slug}:
    delete:
      description: 'Removes the signed-in Customer''s Follow of the Organization named
        by slug. Unfollowing something not followed is not an error — the caller asked
        for a state that already holds. A slug no Organization owns is ORGANIZATION_NOT_FOUND.
        Requires a full Customer Session: a Confirmation Link session is refused with
        CUSTOMER_SESSION_SCOPE_INSUFFICIENT. This is an Unfollow and not an Unsubscribe:
        it removes one Follow, where Unsubscribing would leave every Follow standing
        and silence the Follow Digest.'
      parameters:
      - description: Organization slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerLogout'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Unfollow an Organization
      tags:
      - customer
    post:
      description: 'Records that the signed-in Customer Follows the Organization named
        by slug, and returns the Follow. Idempotent: following something already followed
        returns the existing Follow with its original `followed_at` rather than a
        conflict, so a retried or double-tapped request is safe. Answers 200 on both
        the first call and every repeat. A slug no Organization owns is ORGANIZATION_NOT_FOUND.
        Requires a full Customer Session: a Confirmation Link session is refused with
        CUSTOMER_SESSION_SCOPE_INSUFFICIENT, because a forwarded Sale Confirmation
        is not authority to subscribe somebody''s inbox to mail.'
      parameters:
      - description: Organization slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerFollow'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Follow an Organization
      tags:
      - customer
  /api/v1/customer/follows/tags/{canonicalKey}:
    delete:
      description: 'Removes the signed-in Customer''s Follow of the Tag named by its
        canonical key. Unfollowing something not followed is not an error — the caller
        asked for a state that already holds. A key naming no Tag is TAG_NOT_FOUND.
        Requires a full Customer Session: a Confirmation Link session is refused with
        CUSTOMER_SESSION_SCOPE_INSUFFICIENT. This is an Unfollow and not an Unsubscribe:
        it removes one Follow, where Unsubscribing would leave every Follow standing
        and silence the Follow Digest.'
      parameters:
      - description: Tag canonical key
        in: path
        name: canonicalKey
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerLogout'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Unfollow a Tag
      tags:
      - customer
    post:
      description: 'Records that the signed-in Customer Follows the Tag named by its
        canonical key, and returns the Follow. Any Tag may be Followed, Preset or
        Custom — ADR 0030 bounds how much mail a Follow can produce with the weekly
        Follow Digest''s cap rather than by narrowing what is followable. Idempotent:
        following something already followed returns the existing Follow with its
        original `followed_at`, so a retried or double-tapped request is safe, and
        the answer is 200 on the first call and every repeat. The key is canonicalized
        exactly as the shared Tag pool canonicalizes everywhere else, so casing and
        spacing cannot produce two Follows of one Tag. A key naming no Tag is TAG_NOT_FOUND:
        Following never coins a Tag. Requires a full Customer Session: a Confirmation
        Link session is refused with CUSTOMER_SESSION_SCOPE_INSUFFICIENT.'
      parameters:
      - description: Tag canonical key
        in: path
        name: canonicalKey
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerFollow'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Follow a Tag
      tags:
      - customer
  /api/v1/customer/held-tickets:
    get:
      description: 'Returns every Ticket the signed-in Customer holds — the Self-held
        Ticket of their own purchase and every Ticket they accepted by Assignment
        Link, indistinguishably (ADR 0049) — each with the Ticket Questions its Ticket
        Type asks, whatever has been answered so far and its Outstanding Answer count.
        Authorization is the Customer Session and nothing else: a Ticket is listed
        because this Customer holds it, never because they bought the Sale it is on.
        A Confirmation Link session is narrowed to the Sale it names and sees only
        that Sale''s Self-held Ticket. A Holder''s row shows the Event, the Ticket
        Type and their own questions — never the buyer, the price, the Tax ID, the
        Sale Confirmation reference or the Sale''s other Tickets. A reversed Sale''s
        Ticket stays listed only for its buyer, read-only; a Holder who is not the
        buyer stops holding it, as they do when the buyer reassigns it. Answers 404
        while the Ticket Question feature flag is off.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeHeldTickets'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List the tickets you hold
      tags:
      - customer
  /api/v1/customer/held-tickets/{ticketId}/answers/{questionId}:
    put:
      description: 'Writes the Answer to one Ticket Question on one Ticket the signed-in
        Customer holds, creating it or correcting what was there, and returns that
        Ticket with its questions, Answers and Outstanding Answer count. Only the
        Holder answers (ADR 0049): the buyer for their Self-held Ticket, a Holder
        for the Ticket they accepted, both through this route. A Ticket the caller
        does not hold — one on their own Sale that somebody else holds included —
        is refused with 404 TICKET_NOT_FOUND, indistinguishably from one that does
        not exist. Refused with 400 INVALID_ANSWER when the value does not fit the
        question''s kind, with 409 once the Event has started (EVENT_STARTED_ANSWERS_CLOSED)
        or the Ticket Sale has been reversed (TICKET_SALE_REVERSED). Answers 404 while
        the Ticket Question feature flag is off.'
      parameters:
      - description: Ticket id
        in: path
        name: ticketId
        required: true
        schema:
          type: string
      - description: Ticket question ID
        in: path
        name: questionId

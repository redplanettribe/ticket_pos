  /api/v1/staff/events/{id}/affiliate-links/{linkId}:
    delete:
      description: 'Deletes an Affiliate Link, but only while it has zero clicks,
        no attributed sales, and no checkout in progress under it — so a link created
        by mistake can be taken back and one that has actually promoted anything cannot.
        An attributed Ticket Sale of any status counts as history, a reversed one
        included, because it still names the link that drove it, and a pending Payment
        blocks the delete because it may still become such a sale. A checkout that
        was abandoned or declined does not block it: nobody bought anything, and the
        Payment simply stops naming the link. A link with history is refused with
        AFFILIATE_LINK_HAS_HISTORY; deactivate it instead. Org Admin and Event Owner
        only.'
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Affiliate link ID
        in: path
        name: linkId
        required: true
        schema:
          type: string
      responses:

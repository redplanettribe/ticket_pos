components:
  schemas:
    handler.answerBody:
      properties:
        checked:
          description: Checked answers checkbox.
          type: boolean
        date:
          description: |-
            Date answers date, as a calendar date YYYY-MM-DD. Never an instant: a
            date carries no time and no zone, so nothing can shift it by a day.
          type: string
        number:
          description: |-
            Number answers number, as a decimal STRING rather than a JSON number.
            JSON numbers are doubles in most parsers, and a value that survives a
            NUMERIC column only to be rounded on the way through the wire would defeat
            the column. See catalog.SubmittedAnswer.
          type: string
        option_ids:
          description: |-
            OptionIDs answers single_choice (one) and multi_choice (any number). They
            are OPTION IDENTITIES and never labels, because a label could not survive
            a rename — which is the whole reason an Option has an id.

            An empty array is somebody clearing their choices, which is refused as an
            empty Answer; the way to say "not said" is to DELETE the Answer.
          items:
            type: string
          type: array
          uniqueItems: false
        text:
          description: Text answers short_text and long_text.
          type: string
      type: object
    handler.assignmentLinkAnswerBody:
      properties:
        checked:
          description: Checked answers checkbox.
          type: boolean
        date:
          description: |-
            Date answers date, as a calendar date YYYY-MM-DD. Never an instant: a
            date carries no time and no zone, so nothing can shift it by a day.
          type: string
        number:
          description: |-
            Number answers number, as a decimal STRING rather than a JSON number.
            JSON numbers are doubles in most parsers, and a value that survives a
            NUMERIC column only to be rounded on the way through the wire would defeat
            the column. See catalog.SubmittedAnswer.
          type: string
        option_ids:
          description: |-
            OptionIDs answers single_choice (one) and multi_choice (any number). They
            are OPTION IDENTITIES and never labels, because a label could not survive
            a rename — which is the whole reason an Option has an id.

            An empty array is somebody clearing their choices, which is refused as an
            empty Answer; the way to say "not said" is to DELETE the Answer.
          items:
            type: string
          type: array
          uniqueItems: false
        text:
          description: Text answers short_text and long_text.
          type: string
        token:
          description: |-
            Token is the signed Assignment Link token, and it is the ONLY authority
            this write has.
          type: string
      type: object
    handler.assignmentLinkBody:
      properties:
        token:
          description: |-
            Token is the signed Assignment Link token, exactly as it arrived in the
            address. The Storefront reads it out of its own URL and relays it here;
            nothing else about the caller is asked for, or would be believed.
          type: string
      type: object
    handler.assignmentLinkNameBody:
      properties:
        first_name:
          description: |-
            FirstName and LastName are stored separately (ADR 0005) and written to the
            Customer as their current asserted name. Required and bounded HERE, in the
            handler, as the standard VALIDATION_FAILED envelope (#336): the token
            names the Ticket, so unlike the buyer's Holder email write there is no id
            for an early 400 to leak (see the INVALID_HOLDER_EMAIL exception in the
            api-errors skill). The bound is catalog.MaxHolderNameLength, so the
            domain still owns the number.
          type: string
        last_name:
          type: string
        token:
          description: |-
            Token is the signed Assignment Link token, exactly as it arrived in the
            address. The Storefront reads it out of its own URL and relays it here;
            nothing else about the caller is asked for, or would be believed.
          type: string
      type: object
    handler.avatarUploadURLBody:
      properties:
        content_type:
          type: string
        file_name:
          type: string
      type: object
    handler.beginCustomerCheckoutBody:
      properties:
        affiliate_codes:
          items:
            type: string
          type: array
          uniqueItems: false
        answers:
          items:
            $ref: '#/components/schemas/handler.checkoutAnswerBody'
          type: array
          uniqueItems: false
        customer_first_name:
          type: string
        customer_last_name:
          type: string
        customer_phone:
          type: string
        customer_tax_id_number:
          type: string
        customer_tax_id_type:
          type: string
        lines:
          items:
            $ref: '#/components/schemas/handler.checkoutLineBody'
          type: array
          uniqueItems: false
        locale:
          type: string
        marketing_consent:
          type: boolean
        networking_consent:
          type: boolean
        policy_acceptance:
          description: |-
            The consent boxes, POINTERS with a load-bearing nil exactly as on the
            public body — absent means the box was not shown, which is a different fact
            from `false`.

            On this route the absences are the ordinary case rather than the exception:
            a Customer meets the boxes at sign-in now, so the dialog behind a session
            draws only what that Customer has not answered, and a Customer who has
            answered everything sends none of these at all. Which boxes they were owed
            is still the SERVICE's finding and never this body's assertion.
          type: boolean
      type: object
    handler.buyerAssignmentBody:
      properties:
        holder_email:
          description: |-
            HolderEmail is the address as the buyer typed it. Normalised and shape
            checked by catalog.ParseHolderEmail in the service, and NOT here — the
            address is a domain value with one definition, and a second check in the
            handler is a second place for it to disagree.
          type: string
      type: object
    handler.checkoutAnswerBody:
      properties:
        checked:
          type: boolean
        date:
          type: string
        number:
          type: string
        option_ids:
          items:
            type: string
          type: array
          uniqueItems: false
        text:
          type: string
        ticket_index:
          description: |-
            TicketIndex is which of that Ticket Type's tickets this Answer is about,
            ONE-BASED: 1..quantity, counted across the whole cart's holding of that
            Ticket Type. It becomes the minted Ticket's `ordinal` when the sale
            commits, which is what makes "in order" mean anything (ADR 0043).
          type: integer
        ticket_question_id:
          type: string
        ticket_type_id:
          type: string
      type: object
    handler.checkoutLineBody:
      properties:
        quantity:
          type: integer
        ticket_type_id:
          type: string
      type: object
    handler.commitImportBody:
      properties:
        idempotency_key:
          type: string
        sales:
          items:
            $ref: '#/components/schemas/handler.importSaleRow'
          type: array
          uniqueItems: false
        source:
          type: string
      type: object
    handler.confirmCheckoutBody:
      properties:
        provider_params:
          additionalProperties:
            type: string
          description: |-
            ProviderParams are the query params the provider's return redirect
            carried, relayed verbatim by the Storefront return handler (for the stub:
            {"outcome": "approved"|"declined"}).
          type: object
      type: object
    handler.confirmationLinkBody:
      properties:
        follow:
          description: |-
            Follow exists on this body only so that it can be refused, and refused
            loudly (#219).

            A Confirmation Link mints a sale-scoped session, which is possession of an
            email somebody was SENT and may well have been forwarded. #217 already
            refuses that session the three Follow routes; an intent riding the
            redemption would be the same subscription by another road — whoever a Sale
            Confirmation reached could sign the ticket-holder's address up for a
            weekly email without ever proving they own it (ADR 0010, CONTEXT.md
            "Follow"). Leaving the field off the struct would have refused it too, by
            silently dropping it, and silence is the wrong answer to a request that
            must never work.
          type: string
        token:
          type: string
      type: object
    handler.consentConfirmationBody:
      properties:
        token:
          type: string
      type: object
    handler.consentSubmitBody:
      properties:
        follow:
          description: |-
            Follow is the Follow intent, relayed here for the same reason it is
            relayed on the verify: this is now the request that produces a session, and
            a Follow is written against the session a sign-in produced and against
            nothing a body could name (#219). A visitor who pressed Follow and was
            then stopped for consent must not silently lose it.
          type: string
        marketing_consent:
          description: |-
            MarketingConsent and NetworkingConsent are the optional boxes. On a sign-in
            submission ABSENT IS FALSE AND FALSE IS AN EXPLICIT NO — an unticked box
            that was shown is a refusal, recorded as `denied`, and for Marketing that
            turns the Follow Digest off (ADR 0034). That is what the surface means: the
            boxes are rendered unticked and a person who submits without touching them
            has answered.

            An answer for a box this Customer was not shown is ignored by the service,
            which recomputes what they were owed rather than trusting this body.

            THEY ARE POINTERS SO THAT A WITHDRAWAL CAN BE TOLD FROM A SIGN-IN (#270,
            ADR 0039), and nothing about the sign-in reading above changes: an absent
            field still submits false there, because withdrawalOnly below sends a
            submission carrying a Policy Acceptance down the same path it always took.
            What the pointer buys is the OTHER submission — one with no acceptance in
            it, naming the consents it takes away and nothing else — where absent has
            to mean "not on this submission at all" rather than "answered No", or a
            bare token would be a withdrawal of two consents nobody mentioned.
          type: boolean
        networking_consent:
          type: boolean
        pending_consent_token:
          description: PendingConsentToken is the credential from the consent-required
            outcome.
          type: string
        policy_acceptance:
          description: |-
            PolicyAcceptance is the required box. Absent is false, and false is
            refused: the API is the guarantee, the disabled submit button is a
            courtesy.

            IT IS A POINTER SO THAT MENTIONING IT AT ALL MEANS SOMETHING (#270). A
            submission carrying this field is a sign-in submission whatever it says —
            `false` is a refusal of the policy, not a withdrawal of a consent — and it
            follows the rules it always did. Only a submission that does not mention
            Policy Acceptance at all can be the other act. The two readings agree
            everywhere they overlap: absent is false on the sign-in path exactly as it
            has always been.
          type: boolean
      type: object
    handler.consentWithdrawalProofBody:
      properties:
        code:
          type: string
        email:
          type: string
        locale:
          description: |-
            Locale is the language of the Storefront page the withdrawal is being made
            from, remembered as the Customer's Mail Locale exactly as it is on the
            sign-in door (ADR 0033). It matters more here than there: the confirmation
            of the withdrawal is written in it, and a message about somebody's legal
            rights is the last one that may arrive in a language they cannot read.
            Optional, and a language the platform does not serve is dropped rather than
            made a reason a person cannot exercise a right.
          type: string
      type: object
    handler.correctSaleBody:
      properties:
        amount_cents:
          type: integer
        customer_email:
          type: string
        customer_first_name:
          type: string
        customer_last_name:
          type: string
        customer_tax_id_number:
          type: string
        customer_tax_id_type:
          type: string
        payment_method:
          type: string
        quantity:
          type: integer
        send_confirmation:
          type: boolean
        sold_at:
          type: string
        ticket_type_id:
          type: string
      type: object
    handler.coverUploadURLBody:
      properties:
        content_type:
          type: string
        file_name:
          type: string
      type: object
    handler.createAffiliateLinkBody:
      properties:
        name:
          type: string
      type: object
    handler.createEventBody:
      properties:
        name:
          type: string
        registration_mode:
          description: |-
            RegistrationMode and RegistrationURL let an Event be created as externally
            registered in one step. Both absent is the ordinary ticketed Event.
          type: string
        registration_url:
          type: string
        slug:
          type: string
      type: object
    handler.createOrganizationBody:
      properties:
        name:
          type: string
        slug:
          type: string
      type: object
    handler.createTicketTypeBody:
      properties:
        capacity:
          type: integer
        description:
          type: string
        max_per_customer:
          description: |-
            MaxPerCustomer is the Purchase Limit. Absent or null means the Ticket Type
            is unrestricted, which is the default and the state of every Ticket Type
            that predates ADR 0025.
          type: integer
        name:
          type: string
        price_cents:
          type: integer
      type: object
    handler.declinePayoutRequestBody:
      properties:
        reason:
          type: string
      type: object
    handler.digestSubscriptionBody:
      properties:
        enabled:
          type: boolean
      type: object
    handler.fulfilPayoutRequestBody:
      properties:
        amount_cents:
          type: integer
        note:
          type: string
        paid_at:
          type: string
      type: object
    handler.healthResponse:
      properties:
        status:
          example: ok
          type: string
      type: object
    handler.heldAnswerBody:
      properties:
        checked:
          description: Checked answers checkbox.
          type: boolean
        date:
          description: |-
            Date answers date, as a calendar date YYYY-MM-DD. Never an instant: a
            date carries no time and no zone, so nothing can shift it by a day.
          type: string
        number:
          description: |-
            Number answers number, as a decimal STRING rather than a JSON number.
            JSON numbers are doubles in most parsers, and a value that survives a
            NUMERIC column only to be rounded on the way through the wire would defeat
            the column. See catalog.SubmittedAnswer.
          type: string
        option_ids:
          description: |-
            OptionIDs answers single_choice (one) and multi_choice (any number). They
            are OPTION IDENTITIES and never labels, because a label could not survive
            a rename — which is the whole reason an Option has an id.

            An empty array is somebody clearing their choices, which is refused as an
            empty Answer; the way to say "not said" is to DELETE the Answer.
          items:
            type: string
          type: array
          uniqueItems: false
        text:
          description: Text answers short_text and long_text.
          type: string
      type: object
    handler.importSaleRow:
      properties:
        amount_cents:
          type: integer
        customer_email:
          type: string
        customer_first_name:
          type: string
        customer_last_name:
          type: string
        payment_method:
          type: string
        quantity:
          type: integer
        sold_at:
          type: string
        ticket_type_id:
          type: string
      type: object
    handler.manualSaleBody:
      properties:
        amount_cents:
          type: integer
        customer_email:
          type: string
        customer_first_name:
          type: string
        customer_last_name:
          type: string
        customer_tax_id_number:
          type: string
        customer_tax_id_type:
          type: string
        payment_method:
          type: string
        quantity:
          description: |-
            Quantity is a whole number of tickets. It is decoded as a raw JSON number
            and documented as an integer; manualSaleQuantity explains why the Go type
            is not one, and no client should read it as licence to send a decimal.
          type: integer
        sold_at:
          type: string
        ticket_type_id:
          type: string
      type: object
    handler.markFailedBody:
      properties:
        reason:
          type: string
      type: object
    handler.markProcessingBody:
      properties:
        transfer_reference:
          type: string
      type: object
    handler.optionalConsentBody:
      properties:
        granted:
          type: boolean
      type: object
    handler.payoutProfileBody:
      properties:
        account_holder_name:
          type: string
        account_number:
          type: string
        account_type:
          type: string
        bank_name:
          type: string
        tax_id_number:
          type: string
        tax_id_type:
          type: string
      type: object
    handler.payoutRequestBody:
      properties:
        amount_cents:
          type: integer
        note:
          type: string
        payout_profile:
          $ref: '#/components/schemas/handler.payoutProfileBody'
      type: object
    handler.promotionBody:
      properties:
        ends_at:
          type: string
        promotional_price_cents:
          type: integer
        starts_at:
          type: string
      type: object
    handler.recordConsentWithdrawalBody:
      properties:
        marketing_consent:
          type: boolean
        networking_consent:
          type: boolean
        request_reference:
          type: string
      type: object
    handler.recordPayoutBody:
      properties:
        amount_cents:
          type: integer
        note:
          type: string
        paid_at:
          type: string
      type: object
    handler.reorderTicketQuestionsBody:
      properties:
        question_ids:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    handler.reverseSaleBody:
      properties:
        note:
          type: string
        platform_fee_kept:
          type: boolean
        refunded_amount_cents:
          type: integer
      type: object
    handler.revokeTicketQuestionBody:
      properties:
        reason:
          type: string
      type: object
    handler.selectOrganizationBody:
      properties:
        member_id:
          type: string
      type: object
    handler.setDiscoverableBody:
      properties:
        discoverable:
          type: boolean
      type: object
    handler.setEventTagsBody:
      properties:
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    handler.staffLocaleBody:
      properties:
        locale:
          type: string
      type: object
    handler.ticketQuestionBody:
      properties:
        kind:
          description: Kind is one of the seven; see catalog.ParseTicketQuestionKind.
          type: string
        label:
          description: |-
            Label is the Organization's own words, stored as coined and read
            identically in every Locale (ADR 0027).
          type: string
        option_labels:
          description: |-
            OptionLabels are the Options a choice question is created with. Read on
            create only; update ignores it, because the Option endpoints own Options
            once the question exists.
          items:
            type: string
          type: array
          uniqueItems: false
        required:
          description: |-
            Required produces an Outstanding Answer and nothing more. Absent is false,
            which is the right default: a question nobody said was required is not.
          type: boolean
        timing:
          description: |-
            Timing is 'at_checkout' or 'after_purchase'. Absent means at_checkout,
            which is the only value v1 writes.
          type: string
      type: object
    handler.ticketQuestionOptionBody:
      properties:
        label:
          type: string
      type: object
    handler.undoImportBody:
      properties:
        notify_buyers:
          type: boolean
      type: object
    handler.unsubscribeBody:
      properties:
        token:
          type: string
      type: object
    handler.updateAffiliateLinkBody:
      properties:
        active:
          type: boolean
        name:
          type: string
      type: object
    handler.updateAvatarBody:
      properties:
        image_key:
          type: string
      type: object
    handler.updateEventBody:
      properties:
        cover_image_key:
          type: string
        cover_video_key:
          description: |-
            CoverVideoKey attaches or clears the Cover Video. Absent leaves it alone,
            an empty string clears it, mirroring cover_image_key.
          type: string
        description:
          type: string
        ends_at:
          type: string
        fee_handling:
          description: |-
            FeeHandling is the Event's Fee Handling mode. Absent means "leave it
            alone": a form that does not know about the switch must not reset it.
          type: string
        name:
          type: string
        registration_mode:
          description: |-
            RegistrationMode is 'tickets' or 'external' (ADR 0028), and RegistrationURL
            is the Registration Link. Both follow fee_handling's rule — absent leaves
            the stored value alone — and the link additionally clears on an empty
            string, the way cover_image_key does.
          type: string
        registration_url:
          type: string
        slug:
          type: string
        starts_at:
          type: string
        timezone:
          type: string
        venue_address:
          type: string
        venue_name:
          type: string
      type: object
    handler.updateProfileBody:
      properties:
        first_name:
          type: string
        last_name:
          type: string
        phone:
          description: |-
            The phone number in canonical E.164 form, e.g. +593987654321. Null or blank
            clears the stored number; omitting the field leaves it untouched.
          type: string
        tax_id_number:
          type: string
        tax_id_type:
          type: string
      type: object
    handler.updateTicketTypeBody:
      properties:
        capacity:
          type: integer
        description:
          type: string
        max_per_customer:
          description: |-
            MaxPerCustomer is the Purchase Limit. This endpoint is a full restatement
            of the Ticket Type rather than a patch — every scalar above lands as its
            zero value when omitted — so absent and explicit null both clear the
            Purchase Limit, exactly as they clear Description.
          type: integer
        name:
          type: string
        price_cents:
          type: integer
        sort_order:
          type: integer
      type: object
    handler.videoUploadURLBody:
      properties:
        content_type:
          type: string
        file_name:
          description: |-
            FileName is accepted for symmetry with the cover upload request and to let
            clients send what the user picked, but it never shapes the key: a Cover
            Video is always an MP4, so the extension is fixed.
          type: string
      type: object
    internal_catalog_openapi.MessageData:
      properties:
        message:
          type: string
      type: object
    internal_customers_handler.googleVerifyBody:
      properties:
        code:
          type: string
        code_verifier:
          type: string
        follow:
          description: |-
            Follow is read exactly as it is on the passcode door too, and deliberately
            so: both doors are Proof of Email Ownership and neither is worth more than
            the other (ADR 0011), so a visitor who pressed Follow and then chose Google
            must not silently lose it. This body cannot name an email at all, which
            makes the rule that the intent never chooses a subscriber structural here.
          type: string
        locale:
          description: Locale is read exactly as it is on the passcode door; see otpVerifyBody.
          type: string
        redirect_uri:
          type: string
      type: object
    internal_customers_handler.otpRequestBody:
      properties:
        email:
          type: string
        locale:
          description: |-
            Locale is the language of the Storefront page this passcode was asked
            from, and it words THAT ONE EMAIL AND NOTHING ELSE (ADR 0033).

            It is emphatically not the Mail Locale being set: this route is anonymous,
            so anybody could name anybody's address here, and letting that rewrite a
            stored property of a stranger's record would be a way to change what
            language their receipts arrive in. Only a completed sign-in remembers a
            language — see otpVerifyBody.

            Optional, and never a reason to refuse: a caller with no page to name one
            omits it, and a language this platform does not serve is dropped. The
            passcode goes out in English either way, because a person locked out of
            their tickets must not be kept there by a spelling.
          type: string
      type: object
    internal_customers_handler.otpVerifyBody:
      properties:
        code:
          type: string
        email:
          type: string
        follow:
          description: |-
            Follow is the Follow somebody asked for before they could be asked who
            they are (#219): one string, "organization:<slug>", carried explicitly
            from the sign-in address rather than stashed in browser storage so that it
            is server-visible and can be validated at all.

            It names a subject and never a subscriber. Whose Follow it becomes is
            decided by the session this verification mints and by nothing in this
            body — the Email field above proves who is signing in, and is never read
            as who is being subscribed. Optional; see service.ParseFollowIntent.
          type: string
        locale:
          description: |-
            Locale is the language of the Storefront page this sign-in happened on,
            and it is the one field here that is not part of proving anything. It is
            remembered as the Customer's Mail Locale (ADR 0030), because a Locale is
            a property of a page's address and the Follow Digest is mail. Optional and
            never validated into a refusal: a caller with no page to name — anything
            but the Storefront — omits it and leaves what was remembered standing, and
            a language this platform does not serve is dropped rather than made a
            reason a person cannot sign in.
          type: string
      type: object
    internal_customers_openapi.MessageData:
      properties:
        message:
          type: string
      type: object
    internal_customers_service.OrganizationView:
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
      type: object
    internal_identity_handler.googleVerifyBody:
      properties:
        code:
          type: string
        code_verifier:
          type: string
        locale:
          description: Locale, exactly as on the passcode door and for the same reason.
          type: string
        redirect_uri:
          type: string
      type: object
    internal_identity_handler.otpRequestBody:
      properties:
        email:
          type: string
      type: object
    internal_identity_handler.otpVerifyBody:
      properties:
        code:
          type: string
        email:
          type: string
        locale:
          description: |-
            Locale is the language the login page was rendered in, as the caller
            detected it. Optional, and remembered as the Staff Locale only when the
            person has none. It is the one locale field on a read-adjacent route in
            this API and it names a fact about a person, not a language for the API to
            answer in (ADR 0027).
          type: string
      type: object
    internal_identity_openapi.MessageData:
      properties:
        message:
          type: string
      type: object
    internal_operator_service.Payout:
      properties:
        amount_cents:
          type: integer
        created_at:
          type: string
        id:
          type: string
        note:
          type: string
        paid_at:
          type: string
        recorded_by:
          type: string
      type: object
    internal_sales_service.Payout:
      properties:
        amount_cents:
          type: integer
        id:
          type: string
        note:
          type: string
        paid_at:

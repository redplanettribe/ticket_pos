  /api/v1/staff/events/{id}/outstanding-answers:
    get:
      description: 'A page of the Event''s Holder List: EVERY Ticket of every live
        Ticket Sale, oldest sale first — the Organization''s answer to "who is coming".
        Available while EITHER the Ticket Assignment or the Ticket Question feature
        flag is open, and 404 only when both are dark. Each row carries the Ticket''s
        `assignment_state` — `unassigned`, `assigned` or `accepted` — and, once a
        Holder has ACCEPTED, that Holder''s own name and email address (ADR 0047).
        Nothing about a Holder is disclosed before acceptance: an address a buyer
        typed and its owner never accepted is reported as `assigned` and never named.
        A Ticket whose unaccepted address the retention purge took reads `assigned`
        with `never_accepted` beside it, derived at read time from the purge marker
        — somebody was named and never claimed the Ticket, which after the Event has
        started is a different fact from nobody having been named; no address travels
        with it, because the address is gone by definition. All assignment fields
        are ABSENT while the Ticket Assignment flag is off. Where the Ticket Question
        feature is open, each row also names the required questions it has not answered,
        in `outstanding` — an empty array is a Ticket that owes nothing, and stays
        on the list, because the roster is the point and the questions are a column
        on it. `outstanding=true` filters the list to the Tickets that still owe —
        Outstanding Answers is a filter of this list, not its definition. `outstanding_count`
        is the Event''s total number of debts across the whole roster, unaffected
        by the filter, while `pagination.total` counts the Tickets of the current
        view. Both `outstanding` and `outstanding_count` are absent while the Ticket
        Question flag is off. Tickets of `in_person` and `import` sales appear beside
        the `online` ones and start out owing everything, because those buyers were
        never asked — each row carries its `channel` so that reads as history rather
        than as loss. Started Events still report the whole roster and its debts,
        because "who came and who never told us" is what a reader after the fact came
        to find out.'
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Page number (default 1)
        in: query
        name: page
        schema:
          type: integer
      - description: Rows per page (default 50, max 100)
        in: query
        name: page_size
        schema:
          type: integer
      - description: Only the Tickets that still owe a required Answer
        in: query
        name: outstanding
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeHolderList'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      security:
      - BearerAuth: []
      summary: List an event's holder list
      tags:
      - staff

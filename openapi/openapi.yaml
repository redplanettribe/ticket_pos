  /api/v1/operator/organizations/{orgID}:
    get:
      description: 'Returns the operator''s drill-down into one Organization: the
        Organization itself, its signed Withdrawable Balance, its signed Payable Balance
        — the same arithmetic counting only sales recorded before today in America/Guayaquil
        with no Reversal Request still open (ADR 0026), never larger than the Withdrawable
        Balance and negative when a settlement got ahead of what had cleared — its
        Events in every status (soonest-last, unscheduled Events last), and its full
        payout history newest first with the recording operator''s email, null for
        Payouts entered directly in the database before the Operator Dashboard existed.
        Both balances are shown to the operator and neither gates recording a Payout,
        which stays unconditional (ADR 0015). Platform Operator only.'
      parameters:

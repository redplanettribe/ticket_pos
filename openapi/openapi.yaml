  /api/v1/staff/events/{id}/affiliate-links:
    get:
      description: 'Lists an Event''s Affiliate Links, newest first: name, immutable
        code, active status, the full copyable Storefront URL, when it was created,
        the clicks it has drawn to the Event page, and the link''s Affiliate Attribution
        figures — sales_count, the ACTIVE Ticket Sales it drove, and net_proceeds_cents,
        what those sales left the Organization after the Platform Fee and its Fee
        IVA. Both figures are display-only and count active sales only: a Sale Reversal
        by any route drops the sale out of each, and an attributed free claim counts
        as a sale worth nothing. On an Event that registers externally both are null
        rather than 0: such a link can never attribute a sale, so it is measured by
        its clicks alone and a zero would misreport it as a failure. Org Admin and
        Event Owner only.'

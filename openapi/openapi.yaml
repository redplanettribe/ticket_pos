  /api/v1/operator/organizations/{orgID}:
    get:
      description: 'Returns the operator''s drill-down into one Organization: the
        Organization itself, its signed Withdrawable Balance, its Events in every
        status (soonest-last, unscheduled Events last), and its full payout history
        newest first with the recording operator''s email — null for Payouts entered
        directly in the database before the Operator Dashboard existed. Platform Operator

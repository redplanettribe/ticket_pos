          type: array
          uniqueItems: false
      type: object
    service.CustomerOTPRequestResult:
      properties:
        message:
          type: string
      type: object
    service.CustomerProfileView:
      properties:
        avatar_url:
          description: |-
            The Customer's Avatar as a browser-loadable URL, null when they have none.
            Attaching and removing one goes through the avatar endpoints (avatar.go),
            never through the profile PATCH.
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone:
          description: |-
            The Customer's stored phone number in canonical E.164 form, null when they
            have none (#108). Shown here so a person can see, correct, and withdraw the
            number the platform holds about them without starting a checkout — the last
            of which is a capability in its own right, not an oversight.

            Canonical, not split: the Storefront resolves it back into a country
            selection and a national number for display, because that is a presentation
            concern and nothing below the form ever wants the halves (#103).
          type: string
        tax_id_number:
          type: string
        tax_id_type:
          type: string
      type: object
    service.CustomerSessionView:
      properties:
        avatar_url:
          description: |-
            The Customer's Avatar as a browser-loadable URL, null when they have none
            (the Storefront renders initials instead). A URL rather than an object key
            because no client of this view writes Avatars — the header only shows one.
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone:
          description: |-
            The Customer's stored phone number in canonical E.164 form, null until they
            have one. It rides on the session for exactly the reason the Tax ID does: the
            checkout dialog prefills the field from here, which is what closes the "give
            it once, never again" loop the phone exists to close (#103, #108). The
            Storefront splits it back into a country selection and a national number for
            display; nothing below the form ever sees the halves.
          type: string
        tax_id_number:
          type: string
        tax_id_type:
          description: |-
            The Customer's stored Tax ID, both halves null until they have one. It is
            here so the Storefront checkout dialog can prefill it beside the email and
            name, which is the whole point of storing one (ADR 0016). Unmasked: it is
            the person's own Tax ID being shown back to the person, behind their own
            session.
          type: string
        ticket_sale_id:
          description: |-
            TicketSaleID is null for a full Customer Session, which spans every Ticket
            Sale the Customer owns. A Confirmation Link session names one sale here.
          type: string
        verified_at:
          type: string
      type: object
    service.Event:
      properties:
        discoverable:
          type: boolean
        id:
          type: string
        name:
          type: string
        starts_at:
          type: string
        status:
          type: string
      type: object
    service.EventDetail:
      properties:
        cover_image_key:
          type: string
        cover_image_url:
          type: string
        cover_video_key:
          description: |-
            CoverVideoKey and CoverVideoURL are the Event's optional Cover Video: the
            stored object key and the public URL derived from it at read time, never
            stored (ADR 0020).
          type: string
        cover_video_url:
          type: string
        created_at:
          type: string
        description:
          type: string
        discoverable:
          type: boolean
        ends_at:
          type: string
        fee_basis_points:
          type: integer
        fee_handling:
          description: |-
            FeeHandling is the Event's Fee Handling mode, and the two rates are the
            Platform Fee schedule it is read with. The rates travel with the Event so
            the staff forms can show an organizer what a price means for the buyer and
            for their own take-home using the same arithmetic checkout uses (ADR 0014).
          type: string
        fee_iva_basis_points:
          type: integer
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        starts_at:
          type: string
        status:
          type: string
        timezone:
          type: string
        venue_address:
          type: string
        venue_name:
          type: string
      type: object
    service.EventListItem:
      properties:
        created_at:
          type: string
        discoverable:
          type: boolean
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        starts_at:
          type: string
        status:
          type: string
        timezone:
          type: string
      type: object
    service.EventView:
      properties:
        ends_at:
          type: string
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        starts_at:
          type: string
        timezone:
          type: string
        venue_name:
          type: string
      type: object
    service.MembershipView:
      properties:
        member_id:
          type: string
        organization_id:
          type: string
        organization_logo_url:
          type: string
        organization_name:
          type: string
        organization_slug:
          type: string
        role:
          type: string
      type: object
    service.OTPRequestResult:
      properties:
        message:
          type: string
      type: object
    service.OperatorPayout:
      properties:
        amount_cents:
          type: integer
        created_at:
          type: string
        id:
          type: string
        note:
          type: string
        paid_at:
          type: string
        recorded_by:
          type: string
      type: object
    service.OperatorReversalMemo:
      description: |-
        OperatorReversal is the money memo an Operator Reversal left (#125), and
        null on every sale reversed any other way. It is operator-facing only: it
        rides this payload, which nobody but a Platform Operator can reach, and no
        Organization-facing surface carries it.
      properties:
        note:
          type: string
        operator:
          description: |-
            Operator is the acting operator's email, as their Staff Session knows it.
            Never taken from a request body: who asserted a money fact must not be
            something a caller can claim.
          type: string
        platform_fee_kept:
          type: boolean
        refunded_amount_cents:
          type: integer
      type: object
    service.OperatorSaleCustomer:
      properties:
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
      type: object
    service.OperatorSaleEvent:
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        starts_at:
          description: |-
            StartsAt is null on an Event with no schedule. An Online Sale always has
            one — publishing requires it — but this lookup reaches every Sales Channel,
            and an imported sale can belong to a draft Event.
          type: string
        timezone:
          description: |-
            Timezone is the EVENT's own zone, which interprets its schedule. It is not
            the platform's Ecuadorian clock, which is what the Reversal Window's cutoff
            is stated in; the two are never the same thing.
          type: string
      type: object
    service.Organization:
      properties:
        created_at:
          type: string
        currency:
          type: string
        id:
          type: string
        name:
          type: string
        slug:
          type: string
      type: object
    service.OrganizationDetail:
      properties:
        events:
          items:
            $ref: '#/components/schemas/service.Event'
          type: array
          uniqueItems: false
        organization:
          $ref: '#/components/schemas/service.Organization'
        payouts:
          items:
            $ref: '#/components/schemas/internal_operator_service.Payout'
          type: array
          uniqueItems: false
        withdrawable_balance_cents:
          type: integer
      type: object
    service.OrganizationList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/service.OrganizationListItem'
          type: array
          uniqueItems: false
        pagination:
          $ref: '#/components/schemas/service.PageInfo'
      type: object
    service.OrganizationListItem:
      properties:
        currency:
          type: string
        events_count:
          description: EventsCount counts the Organization's Events in every status.
          type: integer
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        withdrawable_balance_cents:
          description: |-
            WithdrawableBalanceCents is signed: negative means the Organization owes
            the platform after a sale was reversed post-settlement, and the list says
            so rather than clamping it to zero.
          type: integer
      type: object
    service.PageInfo:
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      type: object
    service.PayoutsSummary:
      properties:
        currency:
          type: string
        payouts:
          items:
            $ref: '#/components/schemas/internal_sales_service.Payout'
          type: array
          uniqueItems: false
        withdrawable_balance_cents:
          description: |-
            WithdrawableBalanceCents is the Net Proceeds of the Organization's active
            Online Sales minus every Payout recorded against it. It is signed on
            purpose: a sale reversed after it was paid out leaves the Organization
            owing the platform, and clamping that to zero would hide it.
          type: integer
      type: object
    service.PlatformSummary:
      properties:
        totals:
          items:
            $ref: '#/components/schemas/service.PlatformTotals'
          type: array
          uniqueItems: false
      type: object
    service.PlatformTotals:
      properties:
        currency:
          type: string
        fee_iva_cents:
          type: integer
        kept_fee_cents:
          description: |-
            KeptFeeCents and KeptFeeIVACents are the part of the two figures above
            that stands on reversed sales, because an Operator Reversal stated the
            platform kept its commission on the refunded sale (#127). They are already
            included in PlatformFeeCents and FeeIVACents — never add them again — and
            travel together like every fee figure here. Zero means no Operator
            Reversal has ever kept a fee, and the dashboard then says nothing.
          type: integer
        kept_fee_iva_cents:
          type: integer
        platform_fee_cents:
          type: integer
        total_owed_cents:
          description: |-
            TotalOwedCents sums only the positive Withdrawable Balances: what the
            platform owes. An Organization in the red after a post-settlement reversal
            owes the platform instead, and netting that off would understate the cash
            that must stay on hand.
          type: integer
      type: object
    service.PromotionView:
      description: |-
        Promotion is the Ticket Type's one Promotion slot, or null when it is
        empty. It travels with the Ticket Type so the editor can render the
        Promotion's state without a second request; PriceCents above stays the
        List Price whether or not a Promotion is live (ADR 0021).
      properties:
        ends_at:
          type: string
        promotional_price_cents:
          type: integer
        starts_at:
          type: string
      type: object
    service.PublicEventCard:
      properties:
        cover_image_url:
          type: string
        currency:
          type: string
        ends_at:
          type: string
        name:
          type: string
        organization:
          $ref: '#/components/schemas/service.PublicOrganizationSummary'
        price_from_cents:
          type: integer
        slug:
          type: string
        sold_out:
          type: boolean
        starts_at:
          type: string
        tags:
          items:
            $ref: '#/components/schemas/service.TagView'
          type: array
          uniqueItems: false
        timezone:
          type: string
        venue_name:
          type: string
      type: object
    service.PublicEventDetail:
      properties:
        cover_image_url:
          type: string
        cover_video_url:
          description: |-
            CoverVideoURL is the Event's optional Cover Video, played in the hero over
            the Cover Image poster. Only the key's derived URL is public; listings and
            link previews stay on the Cover Image (ADR 0020).
          type: string
        currency:
          type: string
        description:
          type: string
        ends_at:
          type: string
        has_ended:
          type: boolean
        name:
          type: string
        organization:
          $ref: '#/components/schemas/service.PublicOrganizationSummary'
        price_includes_fee:
          description: |-
            PriceIncludesFee reports that the quoted prices carry the platform's
            service fee — true under 'pass_on' Fee Handling. It is the whole basis of
            the Storefront's single muted "includes service fee" note: under 'absorb'
            the buyer pays exactly what the Organization set and no fee is mentioned
            anywhere. No amount is exposed; the platform's cut is never a number a
            Customer sees (ADR 0014).
          type: boolean
        slug:
          type: string
        starts_at:
          type: string
        tags:
          items:
            $ref: '#/components/schemas/service.TagView'
          type: array
          uniqueItems: false
        ticket_types:
          items:
            $ref: '#/components/schemas/service.PublicTicketType'
          type: array
          uniqueItems: false
        timezone:
          type: string
        venue_address:
          type: string
        venue_name:
          type: string
      type: object
    service.PublicEventPage:
      properties:
        events:
          items:
            $ref: '#/components/schemas/service.PublicEventCard'
          type: array
          uniqueItems: false
        next_cursor:
          type: string
      type: object
    service.PublicOrganizationEvents:
      properties:
        organization:
          $ref: '#/components/schemas/service.PublicOrganizationSummary'
        past:
          items:
            $ref: '#/components/schemas/service.PublicEventCard'
          type: array
          uniqueItems: false
        upcoming:
          items:
            $ref: '#/components/schemas/service.PublicEventCard'
          type: array
          uniqueItems: false
      type: object
    service.PublicOrganizationSummary:
      properties:
        logo_url:
          type: string
        name:
          type: string
        slug:
          type: string
      type: object
    service.PublicPromotion:
      properties:
        ends_at:
          type: string
        list_price_cents:
          type: integer
        promotional_price_cents:
          type: integer
      type: object
    service.PublicTicketType:
      properties:
        currency:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        price_cents:
          type: integer
        promotion:
          $ref: '#/components/schemas/service.PublicPromotion'
        remaining:
          type: integer
        sold_out:
          type: boolean
      type: object
    service.ReversalOffer:
      properties:
        reversible:
          type: boolean
        reversible_until:
          description: |-
            ReversibleUntil is the instant this offer runs out, RFC3339 in UTC. Named
            for Reversible rather than for the Reversal Window: it is the deadline on
            the offer, and an offer can be absent while the Window is still open (a
            Payment Provider that cannot reverse), in which case it is null.
          type: string
        ticket_sale_id:
          description: |-
            TicketSaleID names the sale this offer is about, so a guest surface can
            send somebody to their own purchase in the Customer Area rather than to the
            whole list (#121).

            It is an identifier and not a credential: reaching that sale still requires
            a Customer Session, which this endpoint cannot mint and does not check. It
            is null exactly when the offer is, because a destination for an undo that
            is not on offer is a link to nothing.
          type: string
      type: object
    service.Sale:
      properties:
        amount_cents:
          type: integer
        channel:
          description: 'Channel is the Sales Channel: ''online'', ''in_person'' or
            ''import''.'
          type: string
        confirmation_ref:
          type: string
        currency:
          type: string
        customer:
          $ref: '#/components/schemas/service.OperatorSaleCustomer'
        event:
          $ref: '#/components/schemas/service.OperatorSaleEvent'
        fee_iva_cents:
          type: integer
        id:
          type: string
        net_proceeds_cents:
          type: integer
        operator_reversal:
          $ref: '#/components/schemas/service.OperatorReversalMemo'
        payment_method:
          description: |-
            PaymentMethod is who settled the money: the Payment Provider on a paid
            Online Sale, 'free' where the platform settled a zero total itself
            (ADR 0017), cash or transfer on a Direct Sale, null where the channel
            carries none.
          type: string
        platform_fee_cents:
          type: integer
        recorded_at:
          type: string
        reversal_window_closes_at:
          description: |-
            ReversalWindowClosesAt is when the Reversal Window shuts for this sale:
            the earlier of 20:00 Ecuador time on the day of purchase and the Event's
            start. Null on a sale that never had a window at all — anything but an
            Online Sale, or an Event with no recorded start.
          type: string
        reversal_window_passed:
          description: |-
            ReversalWindowPassed is the question the operator came to ask: is the
            buyer's own undo out of reach? True once the window has shut, and true as
            well on a sale that never had one, because either way no in-window path
            remains. It says nothing about whether the sale may be reversed — the
            window is deliberately irrelevant to an Operator Reversal (#123).
          type: boolean
        reversed_at:
          description: |-
            ReversedAt/ReversedBy are the Sale Reversal's provenance, both null on an
            active sale and both null on a sale reversed before either was recorded —
            history is shown as it is, never backfilled (ADR 0018).
          type: string
        reversed_by:
          type: string
        sold_at:
          type: string
        source:
          type: string
        status:
          description: |-
            Status is 'active' or 'reversed'. A reversed sale is never deleted and
            keeps its reference, so it is found here exactly as an active one is.
          type: string
        ticket_count:
          type: integer
        ticket_types:
          items:
            $ref: '#/components/schemas/service.SaleLine'
          type: array
          uniqueItems: false
      type: object
    service.SaleLine:
      properties:
        quantity:
          type: integer
        ticket_type_name:
          type: string
      type: object
    service.SaleLookup:
      properties:
        organization:
          $ref: '#/components/schemas/service.Organization'
        sale:
          $ref: '#/components/schemas/service.Sale'
      type: object
    service.SaleReversal:
      properties:
        confirmation_ref:
          type: string
        operator_reversal:
          $ref: '#/components/schemas/service.OperatorReversalMemo'
        reversed_at:
          type: string
        reversed_by:
          description: ReversedBy is always sales.ReversalActorOperator here.
          type: string
        status:
          description: |-
            Status is always "reversed"; a marking that did not happen is an error,
            never a result carrying some other word.
          type: string
        ticket_sale_id:
          type: string
      type: object
    service.SaleReversalResult:
      properties:
        confirmation_ref:
          type: string
        reversed_at:
          type: string
        status:
          description: |-
            Status is always "reversed"; a reversal that did not happen is an error,
            never a result carrying some other word.
          type: string
        ticket_sale_id:
          type: string
      type: object
    service.SalesSummary:
      properties:
        currency:
          type: string
        net_proceeds_cents:
          type: integer
        sales_count:
          type: integer
      type: object
    service.SessionView:
      properties:
        active_member:
          $ref: '#/components/schemas/service.ActiveMemberView'
        email:
          type: string
        is_platform_operator:
          description: |-
            IsPlatformOperator says whether this session's email is on the platform
            operator allowlist, so the staff app knows whether to render the Operator
            Dashboard navigation. It is a hint for the UI, never the gate: the
            operator middleware re-checks the allowlist on every request (ADR 0015).
            It is orthogonal to Memberships — an operator may have none.
          type: boolean
        memberships:
          items:
            $ref: '#/components/schemas/service.MembershipView'
          type: array
          uniqueItems: false
      type: object
    service.TagView:
      properties:
        curated:
          type: boolean
        name:
          type: string
      type: object
    service.TicketSaleLineView:
      properties:
        quantity:
          type: integer
        ticket_type_name:
          type: string
        unit_price_cents:
          type: integer
      type: object
    service.TicketSaleView:
      properties:
        amount_cents:
          type: integer
        confirmation_ref:
          type: string
        currency:
          type: string
        event:
          $ref: '#/components/schemas/service.EventView'
        id:
          type: string
        lines:
          items:
            $ref: '#/components/schemas/service.TicketSaleLineView'
          type: array
          uniqueItems: false
        organization:
          $ref: '#/components/schemas/internal_customers_service.OrganizationView'
        reversible:
          description: |-
            Reversible reports whether the Customer could undo this Ticket Sale right
            now (ADR 0018) — and it is the exact question the reversal endpoint asks
            itself, so a true here is an offer the API will honour if taken promptly.

            It is an answer about this instant and nothing more. It is not a promise:
            the window is offered, not guaranteed, and a true read a minute ago may be
            a refusal a minute from now.

            Three things must all hold. The sale is an active Online Sale — an
            In-Person Sale or an imported one was never collected by the platform, so
            the platform has nothing to give back, and a sale already reversed cannot
            be reversed again. Its Reversal Window is open. And its Payment can in fact
            be undone: a free claim always can, since there is nothing to return, while
            a paid one can only when the Payment Provider that collected it supports
            reversal. That last clause is why a paid purchase inside its window can
            report false — the alternative is an Undo button that fails when pressed.
          type: boolean
        reversible_until:
          description: |-
            ReversibleUntil is the instant this offer runs out, RFC3339 in UTC, so the
            Customer can be told how long they have.

            It is named for Reversible, not for the Reversal Window, because it is the
            deadline on the offer above rather than a publication of the platform's
            rule. The two are the same instant today only because every Payment this
            deployment accepts happens to be reversible; a Payment Provider that could
            not give money back would leave a sale with an open Window and no offer at
            all, and this field would correctly be null rather than reporting a
            deadline nobody could act on.

            Null whenever Reversible is false, and deliberately so: a deadline on a sale
            nobody may reverse means nothing, and a client that cannot draw one cannot
            mislead somebody with it.
          type: string
        sold_at:
          type: string
        status:
          type: string
        tax_id_number:
          type: string
        tax_id_type:
          description: |-
            TaxIDType and TaxIDNumber are the Tax ID this sale was transacted under
            (ADR 0016), so a Customer can tell a personal purchase from one made under
            a company RUC. They are the sale's immutable snapshot, never the
            Customer's current stored assertion: editing a profile or buying again
            under a different Tax ID changes nothing here.

            Both are null together on sales recorded before the feature and on
            imported sales that never carried one; history is not backfilled, and the
            client draws "—" rather than a value nobody supplied.
          type: string
      type: object
    service.TicketTypeDetail:
      properties:
        capacity:
          type: integer
        created_at:
          type: string
        currency:
          type: string
        description:
          type: string
        event_id:
          type: string
        id:
          type: string
        name:
          type: string
        price_cents:
          type: integer
        promotion:
          $ref: '#/components/schemas/service.PromotionView'
        sold_count:
          type: integer
        sort_order:
          type: integer
        updated_at:
          type: string
      type: object
    storage.CoverUploadResult:
      properties:
        object_key:
          type: string
        public_url:
          type: string
        upload_url:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: Staff session token as Bearer <session_id>. The Staff BFF also
        accepts an httpOnly cookie.
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: |-
    Ticket POS backend API.
    JSON endpoints use the standard envelope with data, error, and request_id.
    /health is the only endpoint that returns a bare JSON object.
  title: Ticket POS API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/v1/auth/google/verify:
    post:
      description: Exchanges an authorization code obtained on the Staff app at Google's
        token endpoint, using the staff OAuth client, and issues a Staff Session on
        the email address Google vouches for. The session and the auth-fork that follows
        are identical to a passcode's. Every failure returns one generic error, so
        the route reveals nothing about which addresses the platform knows.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_identity_handler.googleVerifyBody'
                description: Authorization code, PKCE verifier and redirect URI
                summary: body
        description: Authorization code, PKCE verifier and redirect URI
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeVerifyGoogle'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      summary: Verify a Google Sign-In
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Destroys the authenticated session.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeLogout'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/v1/auth/otp/request:
    post:
      description: Sends a one-time passcode to the given email address.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_identity_handler.otpRequestBody'
                description: Email address
                summary: body
        description: Email address
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOTPRequest'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Too Many Requests
      summary: Request OTP
      tags:
      - auth
  /api/v1/auth/otp/verify:
    post:
      description: Verifies a one-time passcode and creates a server-side session.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_identity_handler.otpVerifyBody'
                description: Email and passcode
                summary: body
        description: Email and passcode
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeVerifyOTP'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Too Many Requests
      summary: Verify OTP
      tags:
      - auth
  /api/v1/auth/session:
    get:
      description: Returns the authenticated session and membership summary.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeSession'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Get session
      tags:
      - auth
  /api/v1/customer/auth/confirmation-link:
    post:
      description: Exchanges the signed token from a Sale Confirmation for a short-lived
        Customer Session scoped to that one Ticket Sale. Does not mark the Customer
        verified. If a full Customer Session is presented in Authorization, it is
        returned unchanged rather than narrowed.
      requestBody:
        content:

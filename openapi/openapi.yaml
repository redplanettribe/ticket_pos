    post:
      description: 'Records off-platform (cash/transfer) sales against an Event, decrementing
        capacity and emailing each customer a Sale Confirmation. All-or-nothing and
        idempotent. Accepts an uploaded .csv/.xlsx file (with optional `skip_rows`,
        a comma-separated list of file row numbers to exclude, e.g. resolved duplicates)
        or a JSON body. The file form re-runs the preview''s max_per_customer check
        rather than trusting that a preview ran, so a row over a ticket type''s limit
        fails the batch with VALIDATION_FAILED. The JSON form does NOT check it, and
        no parity should be inferred: it carries no per-row complaint channel to report
        a refusal through, and a Purchase Limit is a guardrail an Organization sets
        for itself — the same Org Admin may clear the limit, import, and set it back,
        which is the documented way to import history recorded before the limit existed
        (ADR 0025). An Event that registers externally sells no tickets on this platform,
        so every form of this call — both Sales Sources, file and JSON alike — is
        refused with EVENT_IS_EXTERNAL_REGISTRATION before the body is judged and
        before any Ticket Type is resolved: the refusal names the mode rather than
        a Ticket Type that does not exist and never will (ADR 0028). Each row''s Tickets
        are minted one per unit and the row''s BUYER holds the first of them as a
        Self-held Ticket — assigned to them and `accepted` in the same transaction,
        so the Holder List names them (ADR 0055). The warrant is the transcription
        rather than a proof: a Sale Import records a transaction that already happened,
        so the email column is the person who bought, and the buyer is PRESUMED to
        attend. It makes nobody Verified, sends no Assignment mail, and the buyer''s
        remedy for a wrong presumption is reassignment, exactly as an online buyer''s
        is. There is deliberately NO opt-out column on the template. Nothing is written
        while TICKET_ASSIGNMENT_ENABLED is off.'

      description: 'Reverses the most recent committed Sale Import batch on an Event:
        marks its Ticket Sales reversed, restores each Ticket Type''s sold_count,
        and marks the batch reversed. Only the latest batch is reversible (409 IMPORT_NOT_LATEST_BATCH

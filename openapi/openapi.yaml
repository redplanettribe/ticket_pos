  /api/v1/operator/payout-requests:
    get:
      description: 'Returns a page of every OUTSTANDING Payout Request across every
        Organization on the platform — `pending` ones nobody has answered, and `processing`
        ones whose transfer an operator has submitted and the bank has not confirmed
        — the operator''s work queue, and the second cross-Organization view on this
        surface after sale lookup. Ordered OLDEST FIRST, deliberately breaking the
        newest-first convention the payout and sale histories use: this is a work
        queue rather than a history, and the oldest unanswered request is the one
        about to become a complaint (ADR 0026). Each row carries the ask (amount,
        note, asker''s email, the instant it was made) with the Payable Balance AS
        IT STOOD when it was made, and the Organization it belongs to. ACCOUNT NUMBERS
        ARE MASKED here and nowhere unmasked but the single-request endpoint: this
        is the one screen showing every Organization''s bank details at once, so account_number_masked
        is "····4821" and the payload carries no whole account number and no Tax ID
        at all. Answered requests — paid, failed, declined or cancelled — are not
        in the queue; they stay readable by id and on their Organization''s detail
        page. A `processing` request IS in the queue, deliberately: a transfer nobody
        confirmed is precisely the work that must not fall out of sight, and each
        row carries its status so it does not read as unactioned. Such a row also
        carries the transfer: transfer_submitted_by (which operator sent it — a DIFFERENT
        actor from resolved_by, who ends the request), transfer_submitted_at, and
        transfer_reference (whatever the bank handed back, often null). All three
        are null on any request that never went through `processing`, including one
        paid instantly. transfer_stale is true when a request has been `processing`
        for more than 72 HOURS: COMPUTED AT READ TIME from the server''s clock, never
        stored and never reconciled by a job — the operator learns what the bank did
        by looking, and this flag is the only backstop for a transfer that quietly
        died. 72 rather than 48 because 48 is the advertised worst case, and a flag
        that fires on healthy transfers stops being read. It is false for every other
        status, so a paid request that took four days is not flagged after the fact.
        Response is the ADR-0006 nested envelope { data, pagination }; page_size defaults
        to 50 (max 100) and page floors at 1. Read-only. Platform Operator only.'
      parameters:
      - description: Page number (1-based; floors at 1)
        in: query
        name: page
        schema:
          type: integer
      - description: Page size (default 50, max 100)
        in: query
        name: page_size
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOperatorPayoutRequestQueue'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: List every outstanding Payout Request, oldest first
      tags:
      - operator
  /api/v1/operator/payout-requests/{requestID}:
    get:
      description: 'Returns everything needed to execute one transfer: the ask (amount,
        note, the asker''s email, the instant), the Organization it belongs to, and
        the snapshot Payout Profile IN FULL — bank, account type, WHOLE account number,
        the name on the account and the Organization''s Tax ID for the factura. This
        is the only endpoint that returns an unmasked account number, and it returns
        one request at a time: an operator who opens a request is about to retype
        that number into a banking app. The snapshot is frozen and no later edit of
        the Organization''s Payout Profile rewrites it (ADR 0026). Two readings of
        the money travel with it: request.payable_balance_cents is the Payable Balance
        AS IT STOOD when the ask was made, while payable_balance_cents and withdrawable_balance_cents
        are the LIVE figures now — so an operator can tell an Organization that asked
        for what it had from one that asked for four times as much. The cap was checked
        at request time and is never checked again; neither live figure gates anything,
        and the operator at the bank exercises the judgement. Requests in every state
        are readable here, including paid, declined, failed and cancelled ones that
        have left the queue. A request whose transfer has been submitted carries it:
        transfer_submitted_by is WHICH OPERATOR sent it — a different actor from resolved_by,
        because the colleague who submits and the one who confirms may be days apart
        — with transfer_submitted_at and the optional transfer_reference. transfer_stale
        is true once such a request has been `processing` for more than 72 hours,
        computed at read time from the server''s clock and stored nowhere. An unknown
        or malformed id is 404 PAYOUT_REQUEST_NOT_FOUND. Read-only. Platform Operator
        only.'
      parameters:
      - description: Payout Request ID
        in: path
        name: requestID
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOperatorPayoutRequestDetail'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Get one Payout Request with the details needed to pay it
      tags:
      - operator
  /api/v1/operator/payout-requests/{requestID}/decline:
    post:
      description: 'Marks the Payout Request `declined` and records why, who said
        so (taken from the Staff Session, never from the body) and when. THE REASON
        IS REQUIRED — a blank or whitespace-only one is refused with a field error,
        and it is bounded at 500 characters — because a queue that swallowed requests
        silently would generate the support thread it was built to prevent (ADR 0026).
        The reason is shown to the Organization on its own payouts page, beside the
        ask it answers. Nothing moves: a decline records no Payout and touches no
        balance. A decline is a "not this" rather than a lockout — it ends this request,
        and the Organization may submit a new one immediately, since a resolved request
        no longer occupies its single outstanding slot. ONLY A `pending` REQUEST MAY
        BE DECLINED: once an operator has submitted the transfer the request is `processing`,
        the platform cannot refuse an ask its own operator is acting on, and the answer
        to a transfer the bank sends back is `failed` rather than `declined` — so
        it is 409 PAYOUT_REQUEST_TRANSFER_ALREADY_SUBMITTED naming who submitted it.
        All end states are final, so declining a request that was already paid, declined
        or cancelled is 409 PAYOUT_REQUEST_ALREADY_RESOLVED naming the state and who
        reached it. An unknown or malformed id is 404 PAYOUT_REQUEST_NOT_FOUND. Platform
        Operator only.'
      parameters:
      - description: Payout Request ID
        in: path
        name: requestID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.declinePayoutRequestBody'
                description: Why the request is refused
                summary: body
        description: Why the request is refused
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOperatorPayoutRequest'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
      security:
      - BearerAuth: []
      summary: Decline a Payout Request, with a reason the Organization reads
      tags:
      - operator
  /api/v1/operator/payout-requests/{requestID}/failed:
    post:
      description: 'Marks the Payout Request `failed`, recording why, who said so
        (taken from the Staff Session, NEVER from the body) and when (the server''s
        clock). THE REASON IS REQUIRED — a blank or whitespace-only one is refused
        with a field error, and it is bounded at 500 characters — because it is the
        entire content of the news: "failed" tells an organizer nothing, while "the
        account number was rejected" also tells them what to fix, which is their Payout
        Profile. ONLY A `processing` REQUEST MAY FAIL: a transfer nobody submitted
        cannot have bounced, so a request that is merely `pending` is 409 PAYOUT_REQUEST_TRANSFER_NOT_SUBMITTED
        — an untouched ask an operator wants to refuse is DECLINED, which is a judgement
        with their name on it. NO PAYOUT IS RECORDED AND NONE IS UNDONE: there is
        none, because marking a request processing wrote nothing to the ledger (ADR
        0014), so a rejected transfer leaves the books exactly as they were and no
        Payout ever has to be deleted or negated. `failed` IS TERMINAL AND IS NOT
        RETRIED — the bank details on a request are a frozen snapshot and a request
        cannot be edited, so the commonest failure is unfixable inside the request
        it happened to; the Organization corrects its Payout Profile and submits a
        FRESH request, which it may do immediately because a failed request no longer
        occupies its single outstanding slot. A `failed` request cannot be fulfilled,
        declined, cancelled, marked processing or failed again: all of those are 409
        PAYOUT_REQUEST_ALREADY_RESOLVED. `failed` is NOT `declined` and must never
        be counted or filtered as one — a decline is a judgement a person made, a
        failure is a bank sending money back. An unknown or malformed id is 404 PAYOUT_REQUEST_NOT_FOUND.
        Platform Operator only.'
      parameters:
      - description: Payout Request ID
        in: path
        name: requestID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.markFailedBody'
                description: Why the bank rejected the transfer
                summary: body
        description: Why the bank rejected the transfer
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOperatorPayoutRequest'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
      security:
      - BearerAuth: []
      summary: Mark a Payout Request as failed — the bank rejected the transfer
      tags:
      - operator
  /api/v1/operator/payout-requests/{requestID}/fulfil:
    post:
      description: 'Records a Payout against the requesting Organization AND marks
        the Payout Request `paid`, in ONE database transaction. The operator transfers
        the money by hand off-platform first, as they always have, and this records
        that it happened — there is no second step to forget and no `approved` state
        in between. The body is the same shape the direct record-payout endpoint takes:
        amount_cents (what ACTUALLY left the bank, strictly positive), paid_at (the
        calendar day, YYYY-MM-DD) and an optional note. The amount is PRE-FILLED from
        the request on the dashboard form and may be overwritten — a deliberate departure
        from the no-pre-fill rule of ADR 0019, because a payout amount is a figure
        the Organization already stated rather than an assertion only the operator
        can make. Transferring less than was asked needs no special handling: the
        Payout records what moved, the request keeps what was asked, and the divergence
        stays visible forever. The resulting Payout is INDISTINGUISHABLE from a directly
        recorded one — same shape, same recorded_by (taken from the Staff Session,
        never from the body), and it appears unchanged on the Organization''s own
        payouts page and in its Withdrawable Balance; only the request names it, through
        payout_id. NO balance is consulted in either direction: recording a settlement
        is unconditional (ADR 0015), and the Payable Balance cap bound the Organization
        when it asked and is never re-checked (ADR 0026). FULFILMENT IS A COMPARE-AND-SWAP:
        the request is updated only while it is still `pending` or `processing` —
        a transfer submitted days ago and now confirmed by the bank is fulfilled exactly
        as an instant one — and if it is neither, the WHOLE transaction rolls back
        so NO Payout row survives — 409 PAYOUT_REQUEST_ALREADY_RESOLVED, naming the
        current state and who resolved it first. That refusal tells an operator who
        also transferred to record the Payout directly, because the compare-and-swap
        prevents a double RECORD and not a double TRANSFER. An unknown or malformed
        id is 404 PAYOUT_REQUEST_NOT_FOUND. Platform Operator only.'
      parameters:
      - description: Payout Request ID
        in: path
        name: requestID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.fulfilPayoutRequestBody'
                description: The Payout that answers the request
                summary: body
        description: The Payout that answers the request
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOperatorPayoutFulfilment'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
      security:
      - BearerAuth: []
      summary: Fulfil a Payout Request by recording the Payout that answers it
      tags:
      - operator
  /api/v1/operator/payout-requests/{requestID}/processing:
    post:
      description: 'Marks the Payout Request `processing`, stamping who submitted
        the transfer (taken from the Staff Session, NEVER from the body) and when
        (the server''s clock, never a value a caller supplies), plus an OPTIONAL transfer_reference
        of up to 200 characters — whatever the provider handed back, or nothing at
        all when it handed back nothing synchronously. NO PAYOUT IS RECORDED, and
        that is the whole point of the state: a Payout is money that MOVED (ADR 0014),
        a PayPhone transfer can take up to 48 hours to reach the account and can come
        back rejected, and a ledger that recorded it on submission would have to delete
        or negate rows when it bounces. The request STAYS OUTSTANDING — it keeps the
        Organization''s single request slot, so they cannot ask again for money already
        on its way to them, it stays in the operator queue and in pending_count, and
        neither party may take it back: cancelling and declining are refused while
        it is processing. From here it goes `paid` when the money lands (fulfil it
        exactly as a pending request, recording the Payout that answers it) or `failed`
        when the bank returns it. An instant transfer needs none of this and still
        goes `pending → paid` in one step. Only a `pending` request may be marked
        processing: a request whose transfer another operator already submitted is
        409 PAYOUT_REQUEST_TRANSFER_ALREADY_SUBMITTED naming who submitted it, and
        one that has already ended is 409 PAYOUT_REQUEST_ALREADY_RESOLVED. An unknown
        or malformed id is 404 PAYOUT_REQUEST_NOT_FOUND. Platform Operator only.'
      parameters:
      - description: Payout Request ID
        in: path
        name: requestID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.markProcessingBody'
                description: The reference the bank handed back, if it handed one
                  back
                summary: body
        description: The reference the bank handed back, if it handed one back
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOperatorPayoutRequest'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
      security:
      - BearerAuth: []
      summary: Mark a Payout Request as processing — the transfer is submitted, the
        bank has not confirmed it
      tags:
      - operator
  /api/v1/operator/payout-requests/count:
    get:
      description: 'Returns pending_count: how many Payout Requests are OUTSTANDING
        across every Organization on the platform — `pending` and `processing` alike,
        because the badge counts the work outstanding rather than the work untouched,
        and a number that dropped when an operator submitted a transfer would tell
        the queue it was emptier than it is. It is the badge the Operator Dashboard''s
        navigation wears, because a queue''s whole value is being noticed by somebody
        who had not already decided to look (ADR 0026). It counts exactly what the
        queue lists, so the two can never disagree. Zero is an ordinary answer. Read-only.
        Platform Operator only.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOperatorPendingPayoutRequestCount'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Count the outstanding Payout Requests
      tags:
      - operator
  /api/v1/operator/sales/{confirmationRef}:
    get:
      description: 'Returns one Ticket Sale named by its Sale Confirmation reference
        (e.g. TP-3F9K2), across EVERY Organization on the platform — the operator
        is a Member of none, and the flow always starts from a support thread that
        carries a reference and nothing else. The payload identifies the sale before
        anybody acts on it: the Event and the Organization it belongs to, the buyer
        as the sale snapshotted them, the rolled-up Ticket Types and ticket count,
        the amount collected split into Platform Fee, Fee IVA and Net Proceeds (the
        snapshots frozen at sale time, so a later rate change moves none of them),
        the Sales Channel, the Payment Method, the status, and the Sale Reversal provenance
        on a reversed row. operator_reversal carries the money memo an Operator Reversal
        left — the acting operator, what they said the buyer got back, whether the
        platform kept its fee, and their note — and is null on every sale reversed
        any other way; it is operator-facing only and appears on no Organization surface.
        reversal_window_closes_at is when this sale''s Reversal Window shuts — the
        earlier of 20:00 Ecuador time on the day of purchase and the Event''s start
        — and is null on a sale that never had one (anything but an Online Sale, or
        an Event with no recorded start); reversal_window_passed is true once it has
        shut, and true as well when there was never a window. Matching ignores the
        reference''s case, since a quoted reference loses it. A reversed sale is found
        exactly as an active one is: it keeps its reference and is never deleted.
        Read-only. Platform Operator only.'
      parameters:
      - description: Sale Confirmation reference (case-insensitive)
        in: path
        name: confirmationRef
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOperatorSaleLookup'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Look up a Ticket Sale by its Sale Confirmation reference
      tags:
      - operator
  /api/v1/operator/sales/{confirmationRef}/reverse:
    post:
      description: 'Marks the active Online Sale named by a Sale Confirmation reference
        `reversed`, recording that the Platform Operator already refunded the buyer
        OFF-PLATFORM — by hand in the Payment Provider''s dashboard, or by bank transfer.
        It is a pure record: the Payment Provider is NEVER called from this endpoint,
        so recording a refund that already happened can never trigger a second one.
        The Payment stays `approved` (the checkout genuinely settled; the reversal
        is a later event on the Sale). On commit the sale carries the third reversal
        actor `operator` with the acting operator''s email (taken from the Staff Session,
        never from the body) and the moment, capacity returns to the Ticket Types,
        and the buyer receives the same Sale Voided email every reversal sends. The
        money memo depends on what the sale COLLECTED. On a paid sale refunded_amount_cents
        and platform_fee_kept are both required, with no pre-fill and no default:
        the amount is strictly positive and at most what the sale collected, and the
        one fee flag decides both the Platform Fee and its Fee IVA, which always travel
        together. On a FREE Online Sale both are refused — it collected nothing, so
        there was nothing to refund and no fee to keep, and the record says so with
        nulls rather than zeros. The two always travel together: giving one without
        the other is refused on any sale. note is optional and at most 500 characters
        on both. There is NO Reversal Window check on this path — a sale inside its
        window is marked exactly as one past it, which is the point of the operation.
        Refused for a sale that is not an Online Sale (an imported sale is undone
        through its Sale Import) and for one already reversed, including when the
        buyer''s own undo committed first. Irreversible: no un-reversal exists. Platform
        Operator only.'
      parameters:
      - description: Sale Confirmation reference (case-insensitive)
        in: path
        name: confirmationRef
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.reverseSaleBody'
                description: What the buyer got back, and whether the platform kept
                  its fee
                summary: body
        description: What the buyer got back, and whether the platform kept its fee
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOperatorSaleReversal'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Record an out-of-band refund and reverse a Ticket Sale
      tags:
      - operator
  /api/v1/operator/summary:
    get:
      description: 'Returns the Operator Dashboard headline: for each currency in
        use, the accumulated Platform Fee and Fee IVA (summed from the amounts every
        active Online Sale line snapshotted) and total_owed_cents — the sum of the
        POSITIVE Withdrawable Balances, so an Organization that owes the platform
        after a post-settlement reversal never reduces what the platform must keep
        on hand. One row per currency and no exchange rate anywhere; in practice one
        USD row (ADR 0015). Platform Operator only.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopePlatformSummary'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Get platform revenue and what the platform owes
      tags:
      - operator
  /api/v1/operator/ticket-questions/{questionID}/revoke:
    post:
      description: 'A Revocation (ADR 0056): retires the question and records who
        revoked it (taken from the Staff Session, never from the body), when, and
        why. `review_status` stays `approved` because the approval was real; `retired`
        becomes true and `revocation_reason` carries the reason. From that moment
        the question is asked of nobody — gone from the checkout, the public Event
        page, the Customer Area, the Holder List''s Outstanding Answers and the Answer
        Reminder — while every Answer already given stays on its Ticket, on the staff
        answer view and in the Sales Export. Every Org Admin of the Organization is
        mailed the reason in their own language. THE REASON IS REQUIRED — blank or
        whitespace-only is refused with a field error — and bounded at 500 characters.
        Only an approved, live question can be revoked: a draft, under-review or refused
        one is 409 TICKET_QUESTION_NOT_APPROVED, and one already retired is 409 TICKET_QUESTION_RETIRED.
        404 TICKET_QUESTION_NOT_FOUND for an unknown or malformed id. Platform Operator
        only.'
      parameters:
      - description: Ticket Question ID
        in: path
        name: questionID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.revokeTicketQuestionBody'
                description: Why the approval is taken back
                summary: body
        description: Why the approval is taken back
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOperatorRevokedTicketQuestion'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
      security:
      - BearerAuth: []
      summary: Revoke an approved Ticket Question, with a reason the Organization
        reads
      tags:
      - operator
  /api/v1/public/assignment-link:
    post:
      description: 'Accepts the Ticket Assignment the signed Assignment Link names:
        the Ticket moves to `accepted`, and a Customer is created or matched on the
        normalised email address the buyer gave and marked Verified — the click being
        Proof of Email Ownership (ADR 0035, ADR 0046). Requires no sign-in, no passcode
        and no password, and mints no session. **Accepting twice is idempotent**,
        so a second click lands on the same page and keeps the first acceptance''s
        instant. **It grants no Marketing Consent and no consent of any kind.** The
        response discloses only the Event name, the Ticket Type name, the Holder''s
        own current name for the form to prefill, and this Ticket''s Ticket Questions
        — never the buyer''s name or email, the price, the Tax ID, the Sale Confirmation
        reference, or the Sale''s other Tickets. **The name is prefilled only here,
        after the click**: no route reports it before, which would make this an oracle
        for whether an address is registered. Refused with 401 ASSIGNMENT_LINK_INVALID
        when the token was tampered with, truncated, signed by another deployment
        or for another purpose, names a Ticket that no longer exists, names one whose
        Ticket Sale has been reversed, or names an assignment the Ticket no longer
        carries because it was reassigned; those causes are deliberately indistinguishable,
        because telling them apart would disclose what the buyer did. Refused with
        401 ASSIGNMENT_LINK_EXPIRED once the Event has started, which is told apart
        only because an Event''s start is already published. Answers 404 while TICKET_ASSIGNMENT_ENABLED
        is off. The questions list is empty while the separate Ticket Question flag
        is off.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.assignmentLinkBody'
                description: The signed assignment link token
                summary: body
        description: The signed assignment link token
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeAssignmentLink'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      summary: Accept a ticket assignment
      tags:
      - public
  /api/v1/public/assignment-link/name:
    put:
      description: 'Writes the first and last name of the Holder who accepted the
        Ticket the signed Assignment Link names, as that Customer''s current asserted
        name — stored separately (ADR 0005), and overwriting whatever the record held,
        since the person editing is the person the record is about. **A Holder is
        never asked for a Tax ID**: it is a fact about the sale''s buyer, never about
        an attendee, and this body has nowhere to put one. It accepts the assignment
        first if it has not been accepted already, so the name and the click are one
        act. No sign-in, no session minted, and no consent granted. Refused with 400
        VALIDATION_FAILED carrying `details.fields` when either half of the name is
        blank or over 100 characters, and with the same 401s the accept route gives.
        Answers 404 while TICKET_ASSIGNMENT_ENABLED is off.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.assignmentLinkNameBody'
                description: The signed token and the holder's name
                summary: body
        description: The signed token and the holder's name
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeAssignmentLink'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      summary: Give the holder's name through an assignment link
      tags:
      - public
  /api/v1/public/assignment-link/questions/{questionId}:
    put:
      description: Writes the Answer to one Ticket Question on the Ticket a signed
        Assignment Link names, given by the Holder themselves. It accepts the assignment
        first if it has not been accepted already. Once a Ticket is accepted its Answer
        Link stops opening, so an answer given here cannot be overwritten by somebody
        still holding a forwarded link — which is what accepting buys. The buyer and
        Event Staff keep their own routes to correct an Answer (ADR 0044). Refused
        with 400 INVALID_ANSWER when the value does not fit the question's kind, and
        with the same 401s the accept route gives. Answers 404 while TICKET_ASSIGNMENT_ENABLED
        is off, and 404 while the separate Ticket Question flag is off.
      parameters:
      - description: Ticket question ID
        in: path
        name: questionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.assignmentLinkAnswerBody'
                description: The signed token, and the answer in the shape its question's
                  kind takes
                summary: body
        description: The signed token, and the answer in the shape its question's
          kind takes
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeAssignmentLink'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      summary: Answer a ticket question through an assignment link
      tags:
      - public
  /api/v1/public/checkout/{clientTransactionId}/confirm:
    post:
      description: 'Settles the Payment named by our client transaction id, relaying
        the provider''s return-redirect params. Idempotent: an already-settled Payment
        returns its recorded outcome (approved with the Sale Confirmation reference,
        or failed) without asking the provider or writing anything, so a refreshed
        return page never double-commits. On first approval the Ticket Sale is committed
        in the same transaction that marks the Payment approved, and the Sale Confirmation
        email is sent.'
      parameters:
      - description: Client transaction id from begin-checkout
        in: path
        name: clientTransactionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.confirmCheckoutBody'
                description: Provider return-redirect params
                summary: body
        description: Provider return-redirect params
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeConfirmCheckout'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      summary: Confirm an online checkout
      tags:
      - public
  /api/v1/public/checkout/{clientTransactionId}/reversal:
    get:
      description: 'Reports whether the Ticket Sale produced by one online checkout
        can be undone right now (`reversible`), until when (`reversible_until`, RFC3339
        UTC), and which sale it is (`ticket_sale_id`). The deadline is the offer''s,
        not a publication of the Reversal Window: while an undo is on offer it is
        the earlier of 20:00 Ecuador time on the day of purchase or the Event''s start
        (ADR 0018), and it is null whenever no undo is on offer even if that Window
        is still open. Keyed by our own client transaction id, so a guest who has
        just checked out and holds no Customer Session can still be told the deadline;
        the response carries nothing about the buyer, and `ticket_sale_id` is an address
        for the Customer Area rather than a credential for it. The same rule the Customer
        Area applies is applied here, so both surfaces report the same instant for
        the same sale: an active Online Sale, inside its window, whose Payment this
        deployment could actually undo. Anything else — a checkout that does not exist,
        a Payment not approved, a sale already reversed, a closed window, a Payment
        Provider that cannot reverse — reports `reversible: false` with a null deadline
        and a null sale id. Read-only: no reversal can be performed here, which requires
        a Customer Session.'
      parameters:
      - description: Our client transaction id for the checkout
        in: path
        name: clientTransactionId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCheckoutReversal'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      summary: Reversal Window for a checkout
      tags:
      - customer
  /api/v1/public/events:
    get:
      description: Lists discoverable, published, not-yet-ended events across all
        organizations, soonest first.
      parameters:
      - description: Search over event and organization name
        in: query
        name: q
        schema:
          type: string
      - description: Only events starting on or after this RFC3339 time
        in: query
        name: from
        schema:
          type: string
      - description: Only events starting on or before this RFC3339 time
        in: query
        name: to
        schema:
          type: string
      - description: Comma-separated tag names; events carrying any of them match
        in: query
        name: tags
        schema:
          type: string
      - description: Page size (default 20, max 50)
        in: query
        name: limit
        schema:
          type: integer
      - description: Pagination cursor from a previous response
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopePublicEventPage'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
      summary: List public events
      tags:
      - public
  /api/v1/public/organizations/{slug}/events:
    get:
      description: Returns an organization's discoverable events split into upcoming
        and past.
      parameters:
      - description: Organization slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopePublicOrganizationEvents'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      summary: Get public organization events
      tags:
      - public
  /api/v1/public/organizations/{slug}/events/{eventSlug}:
    get:
      description: 'Returns a published event with its ticket types for the Storefront
        event page. A Customer Session presented in Authorization is optional and
        changes nothing but one field: each ticket type then carries already_held,
        how many of it that Customer already holds — their active Ticket Sales plus
        their live Capacity Holds, the same count begin-checkout refuses on, so the
        picker can bound itself at max(0, max_per_customer - already_held) and a ticket
        type whose allowance is spent can say so instead of claiming to be sold out
        (ADR 0025). An absent, expired or invalid token reads the event as an anonymous
        visitor rather than failing, and already_held is then null — null means "we
        do not know who is asking", which is not the same statement as 0. already_held
        may exceed max_per_customer, because lowering a Purchase Limit is never retroactive.
        No unauthenticated lookup of anybody''s holdings exists: the count comes from
        the session and from nothing in the URL.'
      parameters:
      - description: Organization slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      - description: Event slug
        in: path
        name: eventSlug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopePublicEventDetail'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      summary: Get public event
      tags:
      - public
  /api/v1/public/organizations/{slug}/events/{eventSlug}/affiliate-links/{code}/click:
    post:
      description: 'Counts one visit to an Event page reached through an Affiliate
        Link''s code (?ref=CODE). Public and unauthenticated: the Storefront calls
        it fire-and-forget while rendering the page. Raw counting — repeat visits
        count again, with no dedup and no visitor identification. A code that matches
        nothing live (unknown, mistyped, belonging to another Event, or deactivated)
        is accepted and counts nothing, so a dead ref in a URL never becomes an error
        a buyer can see.'
      parameters:
      - description: Organization slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      - description: Event slug
        in: path
        name: eventSlug
        required: true
        schema:
          type: string
      - description: Affiliate link code
        in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Accepted
      summary: Record affiliate link click
      tags:
      - public
  /api/v1/public/organizations/{slug}/events/{eventSlug}/registration-link/click:
    post:
      description: 'Counts one hand-off from an Event page to its Registration Link.
        Public and unauthenticated: the caller is the Storefront redirect route a
        Customer is passing through on their way to the registration site, not a browser
        talking to this API directly. Raw counting — a Customer who returns counts
        again, with no dedup and no visitor identification — and it counts CLICKS,
        never registrations and never people: the platform loses sight of the Customer
        at the link and never learns whether they signed up. An address that resolves
        to nothing (unknown Organization, unknown Event, or an Event that sells Ticket
        Types here) is accepted and counts nothing, so a tracking miss can never become
        an error that stops somebody registering.'
      parameters:
      - description: Organization slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      - description: Event slug
        in: path
        name: eventSlug
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Accepted
      summary: Record registration link click
      tags:
      - public
  /api/v1/public/privacy-policy/{locale}:
    get:
      description: 'Serves the Policy Version currently in effect, rendered in the
        requested Locale: the version label, its effective date, the SHA-256 fingerprint
        of the edition, the full Privacy Policy (`body_markdown`), the Short Notice
        shown inline at consent capture moments (`short_notice`), and the three consent
        checkbox labels (`consent_labels`) — the required Policy Acceptance, the optional
        Marketing Consent which names the weekly Follow Digest, and the optional Networking
        Consent which names both audiences. All text is markdown, and all of it is
        what the fingerprint covers: the hash on the Policy Version is computed over
        exactly these strings in every published Locale, so a client can prove that
        what it rendered is what the platform recorded as accepted. Public and unauthenticated.
        The Locale is a path parameter and is answered strictly — a language the policy
        is not published in is a 404, never a silent fallback to English.'
      parameters:
      - description: Locale the policy is read in
        in: path
        name: locale
        required: true
        schema:
          enum:
          - en
          - es
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopePrivacyPolicy'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      summary: Current Privacy Policy
      tags:
      - public

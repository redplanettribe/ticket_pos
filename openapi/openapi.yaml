              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.heldAnswerBody'
                description: The answer, in the shape its question's kind takes
                summary: body
        description: The answer, in the shape its question's kind takes
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeHeldTicket'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Answer a ticket question on a ticket you hold
      tags:
      - customer
  /api/v1/customer/organizations/{slug}/events/{eventSlug}/checkout:
    post:
      description: 'The session-gated begin-checkout (ADR 0054). It does the same
        work as the public begin-checkout — validates ticket types, quantities, remaining
        capacity and each Ticket Type''s Purchase Limit, snapshots current unit prices
        into a Payment, and returns our client transaction id with how the checkout
        was left — and differs from it in exactly one way: THE BUYER''S EMAIL IS READ
        FROM THE CUSTOMER SESSION AND IS NOT A REQUEST FIELD. There is no `customer_email`
        on this body and nothing here reads one, so a Ticket Sale begun on this route
        can only ever be addressed to an address the platform has proof of ownership
        for. A request with no Customer Session is refused 401. A request carrying
        a CONFIRMATION LINK session is refused 403 CUSTOMER_SESSION_SCOPE_INSUFFICIENT:
        that credential is minted from a token which travelled in an email and may
        have been forwarded, so it is not Proof of Email Ownership and cannot buy.
        A checkout with money to collect comes back status "pending" with the Payment
        Provider''s redirect_url; a checkout whose cart totals zero — Free Ticket
        Types only — is settled here and now, comes back status "approved" with confirmation_ref
        and no redirect_url, and is gated by the session identically, because a free
        Ticket is still a Ticket that needs a reachable inbox (ADR 0017). Because
        the buyer is proven, the details they give here are their own assertion about
        themselves: first and last name, the Tax ID (required, ADR 0016) and the optional
        phone are written back onto the Customer as well as snapshotted onto the sale.
        Consent given here is recorded as ANSWERED and never as a Pending Confirmation,
        and which boxes the buyer was owed is recomputed server-side from the Customer
        on the session and never taken from this body — a Customer who has already
        accepted the current Policy Version and answered both optional boxes sends
        no consent fields at all, is owed nothing, writes no Consent Record, and is
        not asked again; one who still owes Policy Acceptance must send it present
        and true or the checkout is refused 400 POLICY_ACCEPTANCE_REQUIRED with no
        Payment created. An answer for a box the buyer was not owed is dropped rather
        than applied. Purchase Limits, Affiliate Link attribution, `locale`, and the
        skippable `answers` section all behave exactly as they do on the public route,
        including that nothing about an answer can ever refuse or delay a checkout
        (ADR 0044). The technical proof stored with a consent record (IP, user agent,
        origin URL) is taken from the request and never from this body, and the Policy
        Version accepted is resolved server-side. The response REPORTS THE ADDRESS
        THE SALE WAS ADDRESSED TO in `addressed_to` (#387): the address read off the
        session, echoed back so the caller learns it from this API rather than inferring
        it from a browser. That is what lets the Storefront''s return leg still recognise
        a buyer whose Customer Session did not survive the trip to the Payment Provider
        — a cleared cookie jar, a provider webview, a revoked session, a different
        browser — and it grants nothing, because signing in still costs a passcode
        or a Google round trip. Confirming this checkout uses the same public confirm
        route, which stays public and idempotent: it is the Payment Provider''s return
        leg and must work for a browser that has lost everything, which is the same
        fact `addressed_to` exists to survive.'
      parameters:
      - description: Organization slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      - description: Event slug
        in: path
        name: eventSlug
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.beginCustomerCheckoutBody'
                description: Checkout lines, the buyer's name, Tax ID and optional
                  phone — no email
                summary: body
        description: Checkout lines, the buyer's name, Tax ID and optional phone —
          no email
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeBeginCheckout'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
      security:
      - BearerAuth: []
      summary: Begin an online checkout as the signed-in Customer
      tags:
      - customer
  /api/v1/customer/privacy:
    get:
      description: 'Reports what the signed-in Customer has authorized: the Policy
        Version they accepted and when, read-only, and the current state of each optional
        consent. THIS READ WRITES NOTHING — rendering a settings page must leave the
        platform exactly as it was, because a page that recorded a refusal when somebody
        merely looked at it would turn "never asked" into "denied" for everyone who
        opened it and did nothing. Each optional consent is one of four values, and
        they mean four different things: `granted`, `denied`, `pending_confirmation`
        (somebody who had not proven this address ticked the box, so it stands unresolved
        and is not the owner''s answer) and `unanswered` (never asked, which is not
        a refusal). `unanswered` exists on the wire only; the platform stores NULL,
        because the absence of an answer is not a fourth kind of answer. The Policy
        Version named is the edition THIS CUSTOMER ACCEPTED and not necessarily the
        one in effect, so a Customer who accepted a superseded edition is told what
        they actually agreed to; both policy fields are null where no acceptance was
        ever recorded. Policy Acceptance carries no control anywhere: it is not withdrawable,
        being absent from counsel''s withdrawal form and resting on a basis other
        than consent. Requires a full Customer Session; a Confirmation Link session
        is refused with CUSTOMER_SESSION_SCOPE_INSUFFICIENT, because a forwarded receipt
        is not authority to read somebody''s standing privacy settings.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerPrivacy'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Read the Customer's privacy settings
      tags:
      - customer
  /api/v1/customer/privacy/consents/{purpose}:
    put:
      description: Moves ONE optional consent — `marketing` or `networking`, named
        in the path — to the state the body asks for, and answers with both as they
        now stand. Moving it off is a CONSENT WITHDRAWAL and moving it on is an affirmative
        grant behind a session established by Proof of Email Ownership; both directions
        are offered deliberately, because every surface that can grant an optional
        consent shows the box only while the state is unanswered, so a one-way page
        would leave a Customer who withdrew by mistake with no route back at all.
        Exactly one Consent Record is written per request, under the `account_settings`
        channel, carrying the state each optional consent was in immediately before
        and the technical proof of the act. Only the named consent is answered; the
        other and the Policy Acceptance box are recorded as not shown, so nothing
        standing is churned. Withdrawing Marketing Consent switches the weekly Follow
        Digest off with it, in the same transaction and the same statement — they
        are one switch and cannot drift. A withdrawal that actually took something
        away, out of `granted` or `pending_confirmation`, is confirmed to the Customer
        by email in their Mail Locale; a grant sends nothing, and neither does answering
        No to a consent that was already denied, because nobody is told about a change
        that did not happen. A Customer whose consent sits in `pending_confirmation`
        settles it either way here by answering for themselves. Takes a state rather
        than a flip, so a retried or double-tapped request means the same thing once.
        Requires a full Customer Session; a Confirmation Link session is refused with
        CUSTOMER_SESSION_SCOPE_INSUFFICIENT. A purpose this API does not recognise
        is VALIDATION_FAILED — Policy Acceptance is deliberately not one of them,
        because it is not withdrawable.
      parameters:
      - description: Which optional consent to move
        in: path
        name: purpose
        required: true
        schema:
          enum:
          - marketing
          - networking
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.optionalConsentBody'
                description: The state the Customer is asking for
                summary: body
        description: The state the Customer is asking for
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerOptionalConsents'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Grant or withdraw one optional consent
      tags:
      - customer
  /api/v1/customer/privacy/withdraw-all:
    post:
      description: 'Takes back EVERY optional consent in one act, writing exactly
        ONE Consent Record with both Marketing Consent and Networking Consent answered
        No and carrying the state each was in immediately before. It is a route of
        its own rather than two calls to the per-purpose control precisely so that
        the evidence says "this person asked for everything" rather than "this person
        happened to move two controls" — a distinction the log cannot recover afterwards
        from two rows and a shared timestamp. The request takes NO BODY: this endpoint
        can only ever withdraw, and nothing in it can express a grant. Policy Acceptance
        is untouched, because it is not withdrawable — it rests on a basis other than
        consent, and clearing it would re-gate the Customer rather than free them.
        Withdrawing Marketing Consent switches the weekly Follow Digest off in the
        same transaction and the same statement. A Pending Confirmation left standing
        by somebody else''s tick is settled as No by the same act. THIS IS NOT DELETION
        AND PROCESSING DOES NOT STOP: the account keeps working, Tickets are unaffected,
        tickets can still be bought, Sale Confirmations, passcodes and reversal notices
        still arrive because they rest on contract rather than consent, and data is
        retained for the Tickets held and for legal and security obligations. Anything
        withdrawn can be granted again from the same page. The response reports both
        consents as they now stand AND what this act actually took away, which are
        different facts: `denied` reads the same whether a consent was just given
        up or was already refused. A confirmation email is sent, in the Customer''s
        Mail Locale, naming only what actually moved — and nothing at all is sent
        when both consents were already denied, because nobody is told about a change
        that did not happen. Requires a full Customer Session; a Confirmation Link
        session is refused with CUSTOMER_SESSION_SCOPE_INSUFFICIENT.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerWithdrawAll'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Withdraw every optional consent
      tags:
      - customer
  /api/v1/customer/profile:
    patch:
      description: 'Edits the signed-in Customer''s name, Tax ID, and phone number
        — the "My info" section of the Customer Area. The name must be non-blank on
        both halves; the Tax ID is validated by the same rules as checkout, and sending
        both halves null clears it. The phone is validated by the same rule as checkout
        and stored in canonical E.164 form; sending it null or blank clears it, and
        omitting the field entirely leaves the stored number untouched. The email
        is the Customer''s identity and is not editable here. Requires a full Customer
        Session: a Confirmation Link session is refused with CUSTOMER_SESSION_SCOPE_INSUFFICIENT.
        The edit moves the Customer''s current assertion only — every Ticket Sale
        keeps the name and Tax ID it was transacted under.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.updateProfileBody'
                description: Name, Tax ID, and phone
                summary: body
        description: Name, Tax ID, and phone
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerProfile'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Update the Customer's profile
      tags:
      - customer
  /api/v1/customer/profile/avatar:
    delete:
      description: Removes the signed-in Customer's Avatar, reverting them to the
        initials fallback. Always allowed, whether the Avatar was uploaded or seeded
        from Google Sign-In. Requires a full Customer Session.
      responses:
        "200":

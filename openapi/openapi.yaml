  /api/v1/customer/ticket-sales:
    get:
      description: 'Returns the signed-in Customer''s Ticket Sales, upcoming and past,
        across all Organizations. Always scoped by the Customer Session, never by
        any identifier in the request. Each sale reports whether the Customer could
        undo it right now (`reversible`) and, when they could, until when (`reversible_until`,
        RFC3339 UTC). That deadline is the offer''s rather than a publication of the
        Reversal Window: while an undo is on offer it is the earlier of 20:00 Ecuador
        time on the day of purchase or the Event''s start (ADR 0018), and it is null
        whenever no undo is on offer even if that Window is still open. Only an active
        Online Sale can be reversible, and its Payment must be one this deployment
        can actually undo: a free claim always is, since nothing was collected, and
        a paid one is when the Payment Provider that collected it supports reversal
        (ADR 0012). A sale settled by some other provider therefore reports false
        inside its window rather than offering an undo that would fail. `reversible_until`
        is null whenever `reversible` is false. This endpoint reports the window and
        nothing more: there is no reversal action here.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerArea'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: List the Customer's Ticket Sales
      tags:
      - customer
  /api/v1/customer/ticket-sales/{ticketSaleId}/reverse:
    post:
      description: 'Reverses one of the signed-in Customer''s own Ticket Sales within
        its Reversal Window (ADR 0018). The Ticket Sale becomes reversed, every line''s
        quantity returns to its Ticket Type''s capacity, and the void notice is emailed
        to the Customer once the reversal has committed. The sale is not deleted:
        it keeps its Sale Confirmation reference and stays visible in the Customer
        Area with a reversed status. Authorization is the Customer Session and nothing
        else — a Customer may only reverse a Ticket Sale they own, and a Confirmation
        Link session is not a credential for this. The Reversal Window is enforced
        here on the server whatever the client believed. The Payment Provider is asked
        to reverse the payment BEFORE anything local is written, and only its agreement
        commits the reversal (ADR 0018); a free claim has no provider to ask. Refused,
        with nothing changed, when the sale is already reversed (SALE_ALREADY_REVERSED),
        is not an Online Sale or was settled by a Payment Provider this deployment
        cannot ask (SALE_NOT_REVERSIBLE), or its window has closed (REVERSAL_WINDOW_CLOSED).
        Refused with 502 SALE_REVERSAL_FAILED, again with nothing changed, when the
        provider was asked and would not reverse it: the response carries the Sale
        Confirmation reference and makes no claim about the cause, because the provider
        publishes no code meaning the deadline passed, and the provider''s own error
        code goes to the log only. Pressing twice reverses once, whether the presses
        are sequential or simultaneous: attempts on one Ticket Sale are serialised
        for the whole attempt including the call to the Payment Provider, so the second
        is refused as already reversed (SALE_ALREADY_REVERSED), the provider is asked
        exactly once, and capacity is never restored twice.'
      parameters:
      - description: Ticket Sale id
        in: path
        name: ticketSaleId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeSaleReversal'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Gateway
      security:
      - BearerAuth: []
      summary: Undo a Ticket Sale
      tags:
      - customer
  /api/v1/operator/organizations:
    get:
      description: Returns a page of every Organization on the platform — name, slug,
        currency, Event count across all statuses, and withdrawable_balance_cents,
        which is SIGNED (negative when the Organization owes the platform after a
        sale was reversed post-settlement). Sorted by name ascending with an id tiebreaker
        so equal names keep a stable order across pages. Response is the ADR-0006
        nested envelope { data, pagination }; page_size defaults to 50 (max 100) and
        page floors at 1. Platform Operator only.
      parameters:
      - description: Page number (1-based; floors at 1)
        in: query

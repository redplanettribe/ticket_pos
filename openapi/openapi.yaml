          type: string
      type: object
    service.PayoutRequestDetail:
      properties:
        organization:
          $ref: '#/components/schemas/service.Organization'
        payable_balance_cents:
          type: integer
        request:
          $ref: '#/components/schemas/service.PayoutRequestWhole'
        withdrawable_balance_cents:
          description: The LIVE figures, read now, both signed and never clamped.
          type: integer
      type: object
    service.PayoutRequestProfile:
      description: |-
        PayoutProfile is the frozen copy of where the Organization said to pay. No
        later edit of the profile rewrites it (ADR 0026).
      properties:
        account_holder_name:
          type: string
        account_number:
          type: string
        account_type:
          type: string
        bank_name:
          type: string
        tax_id_number:
          type: string
        tax_id_type:
          type: string
      type: object
    service.PayoutRequestQueue:
      properties:
        data:
          items:
            $ref: '#/components/schemas/service.PayoutRequestQueueItem'
          type: array
          uniqueItems: false
        pagination:
          $ref: '#/components/schemas/service.PageInfo'
      type: object
    service.PayoutRequestQueueItem:
      properties:
        organization:
          $ref: '#/components/schemas/service.Organization'
        request:
          $ref: '#/components/schemas/service.PayoutRequestSummary'
      type: object
    service.PayoutRequestSummary:
      properties:
        amount_cents:
          type: integer
        id:
          type: string
        note:
          type: string
        payable_balance_cents:
          description: |-
            PayableBalanceCents is what the Organization could have asked for at the
            moment it asked. A snapshot, never refreshed: the live figure is on the
            detail view, and the gap between the two is the judgement the cap
            deliberately leaves to the operator (ADR 0026).
          type: integer
        payout_id:
          type: string
        payout_profile:
          $ref: '#/components/schemas/service.OperatorPayoutRequestProfile'
        requested_at:
          type: string
        requested_by:
          description: RequestedBy is the asker's email, so the record outlives their
            Membership.
          type: string
        resolution_reason:
          description: |-
            The answer, all null while the request is outstanding. They are carried here
            because this shape also renders an Organization's request HISTORY, where
            most rows have been answered (#177 fills them in).
          type: string
        resolved_at:
          type: string
        resolved_by:
          type: string
        status:
          type: string
        transfer_reference:
          type: string
        transfer_stale:
          description: |-
            TransferStale is the 72-hour flag, computed at read time from the injected
            clock and stored nowhere — the queue's one piece of arithmetic, and the
            backstop for a transfer that quietly died (ADR 0026 amendment).
          type: boolean
        transfer_submitted_at:
          type: string
        transfer_submitted_by:
          description: |-
            The transfer, as the queue reads it (#186).

            These are not bank details and this is not a widening of what a list may
            carry: who submitted a transfer is an OPERATOR's email, the instant is the
            platform's own clock, and the reference is the string PayPhone handed back
            to identify a transfer — none of them names the account it went to. The
            masking rule is unchanged and unchangeable from here; it lives on
            PayoutProfile below and is applied by sales.MaskAccountNumber.
          type: string
      type: object
    service.PayoutRequestWhole:
      properties:
        amount_cents:
          type: integer
        id:
          type: string
        note:
          type: string
        payable_balance_cents:
          description: |-
            PayableBalanceCents is what the Organization could have asked for at the
            moment it asked. It is a snapshot and never refreshed: the live figure
            moves, and the difference between the two is exactly what an operator needs
            in order to exercise the judgement the cap deliberately leaves to them.
          type: integer
        payout_id:
          type: string
        payout_profile:
          $ref: '#/components/schemas/service.PayoutRequestProfile'
        requested_at:
          type: string
        requested_by:
          description: RequestedBy is the asker's email, so the record outlives their
            Membership.
          type: string
        resolution_reason:
          description: |-
            The answer, all null while the request is pending or processing.
            ResolutionReason says why the request ended the way it did — a decline the
            platform made, or a failure the bank did — and PayoutID only on a payment
            (#177, #185).
          type: string
        resolved_at:
          type: string
        resolved_by:
          type: string
        status:
          type: string
        transfer_reference:
          description: |-
            TransferReference is the string the bank handed back to identify the
            transfer — the handle for chasing PayPhone about a specific one.
          type: string
        transfer_stale:
          description: |-
            TransferStale is the 72-hour flag: true when this request is `processing`
            and the transfer was submitted more than sales.PayoutTransferStaleAfter
            before the service's injected clock.

            COMPUTED AT READ TIME AND STORED NOWHERE. It is false for every other
            status by construction, so a paid request that took four days does not read
            as a problem after the fact — the flag is about a transfer nobody has
            confirmed, not about one that was slow.
          type: boolean
        transfer_submitted_at:
          description: |-
            TransferSubmittedAt is when an operator submitted the transfer, and null on
            a request that never went through `processing` — including one that went
            `pending → paid` directly, which is an instant transfer and legal.

            IT IS THE DATE THAT MAKES "up to 48 hours" CHECKABLE. Without it the
            organizer's sentence is boilerplate they cannot act on: they would know a
            transfer was sent and have no way to tell whether the wait has already
            outrun what they were promised. That is the whole reason this field is on
            the organizer's surface at all (#187).

            Its two companions on the row are deliberately NOT here, and the omission
            is of a piece with OrganizationID above rather than any kind of masking —
            nothing is masked on an Organization's own surface. TransferSubmittedBy
            answers "which colleague do I ask about this transfer", which is an
            operator's question about an internal handoff (ADR 0026 amendment); the
            organizer's question is whether their money is coming, and an operator's
            email is not the answer to it. TransferReference is the handle for chasing
            PayPhone about a specific transfer, and handing an organizer a reference
            their own bank cannot look up invites them to quote it at a teller who has
            never heard of it. Either can be added the day somebody wants it; neither
            is wanted yet.
          type: string
        transfer_submitted_by:
          description: |-
            TransferSubmittedBy is a different actor from ResolvedBy and is exposed
            beside it rather than folded into it: the operator who submits and the
            operator who confirms may be different people days apart, and an operator
            picking up a three-day-old request needs to know which colleague to ask.
          type: string
      type: object
    service.PayoutsSummary:
      properties:
        currency:
          type: string
        payable_balance_cents:
          type: integer
        payouts:
          items:
            $ref: '#/components/schemas/internal_sales_service.Payout'
          type: array
          uniqueItems: false
        withdrawable_balance_cents:
          type: integer
      type: object
    service.PendingPayoutRequestCount:
      properties:
        pending_count:
          type: integer
      type: object
    service.PlatformSummary:
      properties:
        totals:
          items:
            $ref: '#/components/schemas/service.PlatformTotals'
          type: array
          uniqueItems: false
      type: object
    service.PlatformTotals:
      properties:
        currency:
          type: string
        fee_iva_cents:
          type: integer
        kept_fee_cents:
          description: |-
            KeptFeeCents and KeptFeeIVACents are the part of the two figures above
            that stands on reversed sales, because an Operator Reversal stated the
            platform kept its commission on the refunded sale (#127). They are already
            included in PlatformFeeCents and FeeIVACents — never add them again — and
            travel together like every fee figure here. Zero means no Operator
            Reversal has ever kept a fee, and the dashboard then says nothing.
          type: integer
        kept_fee_iva_cents:
          type: integer
        platform_fee_cents:
          type: integer
        total_owed_cents:
          description: |-
            TotalOwedCents sums only the positive Withdrawable Balances: what the
            platform owes. An Organization in the red after a post-settlement reversal
            owes the platform instead, and netting that off would understate the cash
            that must stay on hand.
          type: integer
      type: object
    service.PolicyView:
      properties:
        body_markdown:
          description: BodyMarkdown is the full Privacy Policy, markdown.
          type: string
        consent_labels:
          $ref: '#/components/schemas/policy.ConsentLabels'
        content_hash:
          description: |-
            ContentHash is the fingerprint of the artifact set below, published so that
            the page can show it and a reader can hold the platform to it.
          type: string
        effective_date:
          description: |-
            EffectiveDate is the day this edition took effect, YYYY-MM-DD, as the
            document itself states it.
          type: string
        locale:
          $ref: '#/components/schemas/platform.Locale'
        short_notice:
          description: |-
            ShortNotice is the condensed notice shown inline at a capture moment,
            markdown.
          type: string
        version:
          description: Version is the label a human names this edition by ("0-placeholder").
          type: string
      type: object
    service.PrivacyView:
      properties:
        consents:
          $ref: '#/components/schemas/service.OptionalConsentsView'
        policy_accepted_at:
          description: |-
            PolicyAcceptedAt is when that acceptance was recorded, RFC 3339, null
            alongside a null version.
          type: string
        policy_version:
          description: |-
            PolicyVersion is the label of the edition THIS CUSTOMER ACCEPTED, which is
            not necessarily the one in effect: a Customer who accepted a superseded
            edition is told what they actually agreed to, and a page naming the current
            one would claim they had seen a text nobody ever showed them.

            Null where no acceptance is recorded, which a session minted before consent
            capture existed can still reach.
          type: string
      type: object
    service.PromotionView:
      description: |-
        Promotion is the Ticket Type's one Promotion slot, or null when it is
        empty. It travels with the Ticket Type so the editor can render the
        Promotion's state without a second request; PriceCents above stays the
        List Price whether or not a Promotion is live (ADR 0021).
      properties:
        ends_at:
          type: string
        promotional_price_cents:
          type: integer
        starts_at:
          type: string
      type: object
    service.PublicEventCard:
      properties:
        cover_image_url:
          type: string
        currency:
          type: string
        ends_at:
          type: string
        name:
          type: string
        organization:
          $ref: '#/components/schemas/service.PublicOrganizationSummary'
        price_from_cents:
          type: integer
        registration_mode:
          description: |-
            RegistrationMode is how this Event takes sign-ups: 'tickets' (it sells
            Ticket Types here) or 'external' (it hands its audience to a Registration
            Link elsewhere). Never both (ADR 0028).

            A listing card needs it because a null price_from_cents alone cannot be
            read: on a ticketed Event it is a data anomaly, and on an external one it
            is the normal, permanent state — the platform does not know what the other
            site charges and never will. The mode is what lets the card say so in
            words instead of leaving the price slot blank and looking broken.

            The Registration Link itself is deliberately not here. A card is an
            invitation to the Event page, and the destination is named there, next to
            the button that goes to it; a listing that linked straight out would hand
            a Customer to a stranger from a surface that never told them where.
          type: string
        slug:
          type: string
        sold_out:
          type: boolean
        starts_at:
          type: string
        tags:
          items:
            $ref: '#/components/schemas/service.TagView'
          type: array
          uniqueItems: false
        timezone:
          type: string
        venue_name:
          type: string
      type: object
    service.PublicEventDetail:
      properties:
        buyer_holds_first_ticket:
          description: |-
            BuyerHoldsFirstTicket is whether an Online Sale of this Event hands the
            buyer its first Ticket as their own Self-held Ticket (ADR 0048) — which
            is the platform's Ticket Assignment flag and not a property of the
            Event, riding here for the reason ticket_questions does: the checkout
            dialog draws a "Your ticket" section from this payload, and it may only
            call a Ticket the buyer's own when the sale will actually make it so.
          type: boolean
        cover_image_url:
          type: string
        cover_video_url:
          description: |-
            CoverVideoURL is the Event's optional Cover Video, played in the hero over
            the Cover Image poster. Only the key's derived URL is public; listings and
            link previews stay on the Cover Image (ADR 0020).
          type: string
        currency:
          type: string
        description:
          type: string
        discoverable:
          description: |-
            Discoverable mirrors the Event's Discoverable flag so the Storefront can
            mark a non-Discoverable Event noindex. ADR 0002 draws the line between
            reachable and advertised: a published Event is always reachable by direct
            link, and Discoverable only decides whether the platform's own surfaces
            advertise it. Exposing the flag extends that same distinction to crawlers —
            it says nothing about who may load the page, only about who should index
            it, so reachability is unchanged.
          type: boolean
        ends_at:
          type: string
        has_ended:
          type: boolean
        name:
          type: string
        organization:
          $ref: '#/components/schemas/service.PublicOrganizationSummary'
        price_includes_fee:
          description: |-
            PriceIncludesFee reports that the quoted prices carry the platform's
            service fee — true under 'pass_on' Fee Handling. It is the whole basis of
            the Storefront's single muted "includes service fee" note: under 'absorb'
            the buyer pays exactly what the Organization set and no fee is mentioned
            anywhere. No amount is exposed; the platform's cut is never a number a
            Customer sees (ADR 0014).
          type: boolean
        registration_mode:
          description: |-
            RegistrationMode is how this Event takes sign-ups: 'tickets' (it sells
            Ticket Types here) or 'external' (it hands its audience to the Registration
            Link). Never both (ADR 0028). It is what tells the Storefront whether to
            render a ticket selector at all, so it is stated on every Event rather than
            inferred from an empty ticket_types — an Event whose Ticket Types are all
            sold out is not the same page as one that sells nothing here.
          type: string
        registration_url:
          description: |-
            RegistrationURL is the Registration Link, present only on an external
            Event. The Storefront needs the URL itself and not merely the fact of it:
            the Register panel names the destination's hostname beneath the call to
            action, because a Customer being handed to a stranger should learn which
            one before they click rather than after.

            It is null for a ticketed Event even if a link is stored — a link a
            ticketed Event does not use is nothing a Customer should be offered — and
            null for an external Event still missing one, which a published Event
            cannot be (the publish gate requires it, #208).
          type: string
        slug:
          type: string
        starts_at:
          type: string
        tags:
          items:
            $ref: '#/components/schemas/service.TagView'
          type: array
          uniqueItems: false
        ticket_types:
          items:
            $ref: '#/components/schemas/service.PublicTicketType'
          type: array
          uniqueItems: false
        timezone:
          type: string
        venue_address:
          type: string
        venue_name:
          type: string
      type: object
    service.PublicEventPage:
      properties:
        events:
          items:
            $ref: '#/components/schemas/service.PublicEventCard'
          type: array
          uniqueItems: false
        next_cursor:
          type: string
      type: object
    service.PublicOrganizationEvents:
      properties:
        organization:
          $ref: '#/components/schemas/service.PublicOrganizationSummary'
        past:
          items:
            $ref: '#/components/schemas/service.PublicEventCard'
          type: array
          uniqueItems: false
        upcoming:
          items:
            $ref: '#/components/schemas/service.PublicEventCard'
          type: array
          uniqueItems: false
      type: object
    service.PublicOrganizationSummary:
      properties:
        logo_url:
          type: string
        name:
          type: string
        slug:
          type: string
        support_whatsapp:
          description: |-
            SupportWhatsApp is the Organization's Support WhatsApp number in canonical
            E.164 form — a link a Customer taps to message them for support.

            DELIBERATELY PUBLIC. An Org Admin entered it in a form that states it is
            published on every one of their Event pages and that Customers will message
            it; it is safe to display and was not exposed by accident. Omitted entirely
            when the Organization has none, so a client branches on the key's presence
            rather than on an empty string.

            Served on the Event detail only. It is absent from the Event listings by
            design, so do not read it from a card — see ADR 0029.
          type: string
      type: object
    service.PublicPromotion:
      properties:
        ends_at:
          type: string
        list_price_cents:
          type: integer
        promotional_price_cents:
          type: integer
      type: object
    service.PublicTicketQuestion:
      properties:
        id:
          type: string
        kind:
          description: |-
            Kind is which of the seven field shapes to draw: short_text, long_text,
            single_choice, multi_choice, number, date, checkbox.
          type: string
        label:
          description: |-
            Label is the question AS COINED — the Organization's own words, read
            identically on an `en` and an `es` page exactly as a Custom Tag is
            (ADR 0027). Only the page chrome around it follows the Locale.
          type: string
        options:
          description: |-
            Options is empty for the five kinds that are not answered by choosing, and
            carries only LIVE Options for the two that are.
          items:
            $ref: '#/components/schemas/service.PublicTicketQuestionOption'
          type: array
          uniqueItems: false
        required:
          description: |-
            Required MARKS A FIELD AND GATES NOTHING. Its only effect anywhere on this
            platform is producing an Outstanding Answer the Organization can chase, and
            a Storefront that turned it into a disabled pay button would be reversing
            ADR 0044 — the buyer is not assumed to know the answers, which is the
            premise the whole feature rests on.
          type: boolean
      type: object
    service.PublicTicketQuestionOption:
      properties:
        id:
          type: string
        label:
          type: string
      type: object
    service.PublicTicketType:
      properties:
        already_held:
          description: |-
            AlreadyHeld is how many of this Ticket Type the Customer who asked for this
            page already holds — their active Ticket Sales plus their live Capacity
            Holds, the same count begin-checkout refuses on, and the same word its
            PURCHASE_LIMIT_EXCEEDED details use, so a client learns one name for one
            idea (ADR 0025, #168).

            It is NULL for an anonymous read, and that is not the same statement as 0.
            Zero says "you hold none of these"; null says "we do not know who you are",
            and the Storefront must not turn the second into the first — an anonymous
            visitor learns of their allowance at submit, which is the first moment they
            have told us who they are. Nobody ever reads anybody else's figure: it is
            derived from the Customer Session the request carried and from nothing in
            the URL, so there is no address a caller can ask about but their own.

            It is reported for every Ticket Type a signed-in Customer reads, including
            unrestricted ones, so that null keeps meaning "anonymous" and never doubles
            as "unrestricted" — max_per_customer already says that, and one field
            answering two questions is how a picker ends up bounding the wrong thing.
            It may legitimately exceed max_per_customer: lowering a Purchase Limit is
            not retroactive, so remaining allowance is max(0, limit - already_held) and
            is never asserted non-negative.
          type: integer
        currency:
          type: string
        description:
          type: string
        id:
          type: string
        max_per_customer:
          description: |-
            MaxPerCustomer is the Purchase Limit, or null when this Ticket Type is
            unrestricted. The Storefront bounds its quantity picker by it so a buyer is
            never invited to choose a quantity that will be refused (ADR 0025).

            Unlike PriceCents it is a raw count, untouched by Fee Handling or Promotion
            arithmetic — it counts tickets, not money. It states the Ticket Type's rule
            and nothing about any Customer's holdings: an anonymous reader learns the
            limit, never who has already used theirs up.
          type: integer
        name:
          type: string
        price_cents:
          type: integer
        promotion:
          $ref: '#/components/schemas/service.PublicPromotion'
        remaining:
          type: integer
        sold_out:
          type: boolean
        ticket_questions:
          description: |-
            TicketQuestions are what this Ticket Type asks the person who will hold one
            of its tickets, in the order they are asked (#311).

            PRESENT ONLY WHERE THE FEATURE FLAG IS OPEN, and empty on every Ticket Type
            that asks nothing — which, on the shipped deployment, is all of them
            (ADR 0045). The Storefront draws its answer section from this and from
            nothing else, so a closed flag is a checkout with no answer section at all
            rather than one hidden by a second flag on the frontend that could disagree.

            IT IS A NARROWER VIEW THAN THE STAFF ONE, deliberately. No `retired` — a
            retired question or Option is simply absent, because this is a new list and
            nobody is being asked one. No timestamps, no `timing` — the timing decided
            whether the question is here at all, and restating it would invite a client
            to filter on it a second time. What a public payload does not say cannot be
            read wrong.
          items:
            $ref: '#/components/schemas/service.PublicTicketQuestion'
          type: array
          uniqueItems: false
      type: object
    service.ReversalDrainResult:
      properties:
        failed:
          description: |-
            Failed is requests whose pursuit errored — the database, or a local write
            after the provider agreed. Each one logged its own line.
          type: integer
        gave_up:
          description: |-
            GaveUp counts the requests THIS RUN turned into Unresolved Reversals. It is
            the number worth alerting on, and it is not the size of the queue below.
          type: integer
        in_flight_total:
          description: |-
            InFlightTotal is how many Reversal Requests are still open once this run
            finished, and OldestInFlightRequestedAt is when the buyer at the front of
            that queue pressed (RFC3339 in UTC, absent when there is nobody).

            They are the answer to "is this getting better or worse", and the reason
            they are here rather than left to the Unresolved queue below is that the
            queue below is EMPTY for the first 24 hours of any outage — the give-up
            bound has not been reached — which is precisely the day an operator is
            looking. The count says how big the backlog is and the timestamp says how
            long it has been building, so two curls a minute apart answer the question
            without a database session.
          type: integer
        oldest_in_flight_requested_at:
          type: string
        pursued:
          description: |-
            Pursued is how many Reversal Requests this run claimed. Zero is the
            ordinary answer: nothing was stuck.
          type: integer
        refused:
          type: integer
        reversed:
          description: |-
            Reversed, Refused, StillInFlight and GaveUp are where those requests ended.
            They sum to Pursued alongside Skipped and Failed.
          type: integer
        skipped:
          description: |-
            Skipped is requests another actor held or had already settled — a buyer's
            own press, a Customer Area drain, another instance. Not a failure: the claim
            is handed straight back and the next tick takes it up.
          type: integer
        still_in_flight:
          type: integer
        unresolved:
          description: |-
            Unresolved is the standing Unresolved Reversal queue, oldest ask first,
            capped at unresolvedQueuePageSize. It carries what the backlog above cannot
            — the client transaction id and last error per row — because these are the
            ones nobody is pursuing any more, and the next move on each is a human
            typing something into the provider's dashboard.
          items:
            $ref: '#/components/schemas/service.UnresolvedReversal'
          type: array
          uniqueItems: false
        unresolved_total:
          description: |-
            UnresolvedTotal is how long that queue really is, so a truncated page is
            never read as the whole backlog.
          type: integer
      type: object
    service.ReversalOffer:
      properties:
        reversible:
          type: boolean
        reversible_until:
          description: |-
            ReversibleUntil is the instant this offer runs out, RFC3339 in UTC. Named
            for Reversible rather than for the Reversal Window: it is the deadline on
            the offer, and an offer can be absent while the Window is still open (a
            Payment Provider that cannot reverse), in which case it is null.
          type: string
        ticket_sale_id:
          description: |-
            TicketSaleID names the sale this offer is about, so a guest surface can
            send somebody to their own purchase in the Customer Area rather than to the
            whole list (#121).

            It is an identifier and not a credential: reaching that sale still requires
            a Customer Session, which this endpoint cannot mint and does not check. It
            is null exactly when the offer is, because a destination for an undo that
            is not on offer is a link to nothing.
          type: string
      type: object
    service.RevokedTicketQuestion:
      properties:
        approved_by:
          description: |-
            ApprovedBy names who approved it — a Platform Operator, or the
            grandfathering migration — and is absent until somebody has.
          type: string
        created_at:
          type: string
        id:
          type: string
        kind:
          type: string
        label:
          type: string
        options:
          description: Options is empty for the five kinds that are not answered by
            choosing.
          items:
            $ref: '#/components/schemas/service.TicketQuestionOptionView'
          type: array
          uniqueItems: false
        refusal_reason:
          description: RefusalReason is the Operator's reason on a refused question.
          type: string
        required:
          description: |-
            Required produces an Outstanding Answer and nothing else. It is not a
            constraint, and no surface may treat it as one.
          type: boolean
        retired:
          description: |-
            Retired is true for a question kept only so that what has already been
            answered still reads. Retired questions are returned so the authoring
            surface can show them rather than appearing to have lost them.
          type: boolean
        review_status:
          description: |-
            ReviewStatus is where the question stands with the Platform Operator
            (ADR 0056): `draft`, `under_review`, `approved` or `refused`. Only an
            approved question is asked of anybody. Read-only on this surface: the
            verdicts are the Operator's and the submission is a Question Review's.
          type: string
        revocation_reason:
          description: |-
            RevocationReason is the Operator's reason on a Revocation, which is why
            a question that reads retired here stopped being asked.
          type: string
        sort_order:
          type: integer
        timing:
          description: |-
            Timing is 'at_checkout' on every row written so far; the field is here so
            the Organization's choice can be honoured later without migrating Answers.
          type: string
        updated_at:
          type: string
      type: object
    service.Sale:
      properties:
        amount_cents:
          type: integer
        channel:
          description: 'Channel is the Sales Channel: ''online'', ''in_person'' or
            ''import''.'
          type: string
        confirmation_ref:
          type: string
        currency:
          type: string
        customer:
          $ref: '#/components/schemas/service.OperatorSaleCustomer'
        event:
          $ref: '#/components/schemas/service.OperatorSaleEvent'
        fee_iva_cents:
          type: integer
        id:
          type: string
        net_proceeds_cents:
          type: integer
        operator_reversal:
          $ref: '#/components/schemas/service.OperatorReversalMemo'
        payment_method:
          description: |-
            PaymentMethod is who settled the money: the Payment Provider on a paid
            Online Sale, 'free' where the platform settled a zero total itself
            (ADR 0017), cash or transfer on a Direct Sale, null where the channel
            carries none.
          type: string
        platform_fee_cents:
          type: integer
        recorded_at:
          type: string
        reversal_window_closes_at:
          description: |-
            ReversalWindowClosesAt is when the Reversal Window shuts for this sale:
            the earlier of 20:00 Ecuador time on the day of purchase and the Event's
            start. Null on a sale that never had a window at all — anything but an
            Online Sale, or an Event with no recorded start.
          type: string
        reversal_window_passed:
          description: |-
            ReversalWindowPassed is the question the operator came to ask: is the
            buyer's own undo out of reach? True once the window has shut, and true as
            well on a sale that never had one, because either way no in-window path
            remains. It says nothing about whether the sale may be reversed — the
            window is deliberately irrelevant to an Operator Reversal (#123).
          type: boolean
        reversed_at:
          description: |-
            ReversedAt/ReversedBy are the Sale Reversal's provenance, both null on an
            active sale and both null on a sale reversed before either was recorded —
            history is shown as it is, never backfilled (ADR 0018).
          type: string
        reversed_by:
          type: string
        sold_at:
          type: string
        source:
          type: string
        status:
          description: |-
            Status is 'active' or 'reversed'. A reversed sale is never deleted and
            keeps its reference, so it is found here exactly as an active one is.
          type: string
        ticket_count:
          type: integer
        ticket_types:
          items:
            $ref: '#/components/schemas/service.SaleLine'
          type: array
          uniqueItems: false
      type: object
    service.SaleLine:
      properties:
        quantity:
          type: integer
        ticket_type_id:
          description: |-
            TicketTypeID is here for the Sale Correction form (#351), which is
            pre-filled from the row and must name the Ticket Type by id, as the
            import template's hidden column does.
          type: string
        ticket_type_name:
          type: string
      type: object
    service.SaleLookup:
      properties:
        organization:
          $ref: '#/components/schemas/service.Organization'
        sale:
          $ref: '#/components/schemas/service.Sale'
      type: object
    service.SaleReversal:
      properties:
        confirmation_ref:
          type: string
        operator_reversal:
          $ref: '#/components/schemas/service.OperatorReversalMemo'
        reversed_at:
          type: string
        reversed_by:
          description: ReversedBy is always sales.ReversalActorOperator here.
          type: string
        status:
          description: |-
            Status is always "reversed"; a marking that did not happen is an error,
            never a result carrying some other word.
          type: string
        ticket_sale_id:
          type: string
      type: object
    service.SaleReversalResult:
      properties:
        confirmation_ref:
          type: string
        requested_at:
          description: |-
            RequestedAt is when the Customer pressed Undo, RFC3339 in UTC. Present only
            on "pending", and it is the instant of the ORIGINAL ask: a buyer who
            presses again while the platform is still finding out is told when their
            one request was made, not when they pressed the second time.
          type: string
        reversed_at:
          description: |-
            ReversedAt is when the reversal committed, RFC3339 in UTC. Present only on
            "reversed".
          type: string
        status:
          description: |-
            Status is "reversed" when the purchase is undone, and "pending" while a
            Reversal Request is still in flight (ADR 0024).

            "pending" is NOT a softer failure. It says the platform is still finding
            out what the Payment Provider did, so the Ticket Sale is still active and
            the buyer's tickets are still valid — a reversal that was definitely
            refused is an error, never a result carrying a word.
          type: string
        ticket_sale_id:
          type: string
      type: object
    service.SalesSummary:
      properties:
        currency:
          type: string
        net_proceeds_cents:
          type: integer
        sales_count:
          type: integer
        tickets_sold:
          description: |-
            TicketsSold is the quantities of the Event's active Ticket Sale Lines
            summed — what an organizer reads to know how many people are coming,
            which no count of checkouts can answer.
          type: integer
      type: object
    service.SalesTrends:
      properties:
        currency:
          description: Currency is the Organization's currency, which Takings is denominated
            in.
          type: string
        days:
          description: |-
            Days is every calendar day from the first sale to the end of the span,
            contiguous and zero-filled: a silent day is present carrying no lines, so
            a quiet fortnight reads as a quiet fortnight rather than as two adjacent
            bars. Empty on an Event that has sold nothing.
          items:
            $ref: '#/components/schemas/service.TrendsDay'
          type: array
          uniqueItems: false
        reversed_count:
          description: |-
            ReversedCount is how many of the Event's Ticket Sales are reversed, across
            the whole Event. Reversed sales are excluded from every figure above, so
            this is what tells an organizer a bar shrank rather than letting it shrink
            silently (ADR 0018).
          type: integer
        ticket_types:
          description: |-
            TicketTypes is the Event's WHOLE catalog in display order, including types
            that have sold nothing, so a legend built from it is stable and its chip
            set does not change shape as sales arrive.
          items:
            $ref: '#/components/schemas/service.TrendsTicketType'
          type: array
          uniqueItems: false
        timezone:
          description: |-
            Timezone is the zone the days are counted in — the Event's own, or UTC
            where it carries none — stated so the reader knows whose day a day is.
          type: string
      type: object
    service.SessionView:
      properties:
        active_member:
          $ref: '#/components/schemas/service.ActiveMemberView'
        email:
          type: string
        is_platform_operator:
          description: |-
            IsPlatformOperator says whether this session's email is on the platform
            operator allowlist, so the staff app knows whether to render the Operator
            Dashboard navigation. It is a hint for the UI, never the gate: the
            operator middleware re-checks the allowlist on every request (ADR 0015).
            It is orthogonal to Memberships — an operator may have none.
          type: boolean
        locale:
          description: |-
            Locale is the Staff Locale of the person this session belongs to, or null
            when they have stated none. It sits beside Email and IsPlatformOperator
            because it is a fact about the PERSON, not about the Organization they are
            currently looking at — which is also why it is reported here and not on
            ActiveMember: a Platform Operator who is a Member of nothing has no Active
            Member to hang it on, and still has a language.
          type: string
        memberships:
          items:
            $ref: '#/components/schemas/service.MembershipView'
          type: array
          uniqueItems: false
      type: object
    service.StaffLocaleView:
      properties:
        locale:
          type: string
      type: object
    service.StaffMeView:
      properties:
        locale:
          description: |-
            Locale is the person's Staff Locale, or null when they have stated none.
            Null is not "English": it says nobody has chosen, which is what lets the
            next sign-in record a detected language instead of finding one already
            there. A reader with null renders in English all the same.
          type: string
        member_id:
          type: string
        organization_id:
          type: string
        organization_logo_url:
          type: string
        organization_name:
          type: string
        organization_slug:
          type: string
        role:
          type: string
      type: object
    service.SuggestedOrganizationView:
      properties:
        organization:
          $ref: '#/components/schemas/service.FollowedOrganizationView'
        reason:
          $ref: '#/components/schemas/service.SuggestionReason'
      type: object
    service.SuggestedTagView:
      properties:
        reason:
          $ref: '#/components/schemas/service.SuggestionReason'
        tag:
          $ref: '#/components/schemas/service.FollowedTagView'
      type: object
    service.SuggestionReason:
      properties:
        tag:
          $ref: '#/components/schemas/service.FollowedTagView'
      type: object
    service.TagView:
      properties:
        canonical_key:
          type: string
        curated:
          type: boolean
        name:
          type: string
      type: object
    service.TicketAnswersView:
      properties:
        answerable:
          description: |-
            Answerable is whether this Ticket's Answers may still be written. False
            once the Event has started and false on a reversed Ticket Sale — and never
            a reason to hide anything: everything below stays readable either way.
          type: boolean
        answerable_refusal:
          description: |-
            AnswerableRefusal names WHY not, or is empty while it is answerable. The
            staff app draws the reason beside the frozen fields rather than leaving
            somebody to wonder why the form will not take.
          type: string
        confirmation_ref:
          description: |-
            ConfirmationRef is the buyer's own reference for the Ticket Sale, which is
            how staff on the phone find the sale a caller is asking about.
          type: string
        ordinal:
          description: |-
            Ordinal is which of its Ticket Sale Line's units this Ticket is,
            1..quantity. Internal and not a seat number — but it is the only thing
            telling two Tickets of one line apart, which is what lets staff say "the
            second of Ana's four".
          type: integer
        questions:
          description: |-
            Questions carries the Ticket Type's questions in the order they are asked,
            retired ones last, each with this Ticket's Answer or null.
          items:
            $ref: '#/components/schemas/service.TicketQuestionAnswerView'
          type: array
          uniqueItems: false
        ticket_id:
          type: string
        ticket_sale_id:
          type: string
        ticket_type_id:
          type: string
        ticket_type_name:
          type: string
      type: object
    service.TicketQuestion:
      properties:
        approved_by:
          description: |-
            ApprovedBy names who approved it — a Platform Operator, or the
            grandfathering migration — and is absent until somebody has.
          type: string
        created_at:
          type: string
        id:
          type: string
        kind:
          type: string
        label:
          type: string
        options:
          description: Options is empty for the five kinds that are not answered by
            choosing.
          items:
            $ref: '#/components/schemas/service.TicketQuestionOptionView'
          type: array
          uniqueItems: false
        refusal_reason:
          description: RefusalReason is the Operator's reason on a refused question.
          type: string
        required:
          description: |-
            Required produces an Outstanding Answer and nothing else. It is not a
            constraint, and no surface may treat it as one.
          type: boolean
        retired:
          description: |-
            Retired is true for a question kept only so that what has already been
            answered still reads. Retired questions are returned so the authoring
            surface can show them rather than appearing to have lost them.
          type: boolean
        review_status:
          description: |-
            ReviewStatus is where the question stands with the Platform Operator
            (ADR 0056): `draft`, `under_review`, `approved` or `refused`. Only an
            approved question is asked of anybody. Read-only on this surface: the
            verdicts are the Operator's and the submission is a Question Review's.
          type: string
        revocation_reason:
          description: |-
            RevocationReason is the Operator's reason on a Revocation, which is why
            a question that reads retired here stopped being asked.
          type: string
        sort_order:
          type: integer
        ticket_type_id:
          type: string
        ticket_type_name:
          type: string
        timing:
          description: |-
            Timing is 'at_checkout' on every row written so far; the field is here so
            the Organization's choice can be honoured later without migrating Answers.
          type: string
        updated_at:
          type: string
      type: object
    service.TicketQuestionAnswerView:
      properties:
        answer:
          $ref: '#/components/schemas/service.AnswerView'
        question:
          $ref: '#/components/schemas/service.TicketQuestionView'
      type: object
    service.TicketQuestionOptionView:
      properties:
        approved_by:
          type: string
        id:
          description: |-
            ID is the Option's stable identity. A rename changes Label and never this,
            which is what keeps the Answers given under the old wording attached.
          type: string
        label:
          type: string
        refusal_reason:
          type: string
        retired:
          description: |-
            Retired means gone from new lists, kept on the Tickets that chose it, and
            still entitled to its column in the Sales Export.
          type: boolean
        review_status:
          description: |-
            The Option's own review state, on the question's terms (ADR 0056): an
            Option added to an approved question is a draft until reviewed.
          type: string
        revocation_reason:
          type: string
        sort_order:
          type: integer
      type: object
    service.TicketQuestionView:
      properties:
        approved_by:
          description: |-
            ApprovedBy names who approved it — a Platform Operator, or the
            grandfathering migration — and is absent until somebody has.
          type: string
        created_at:
          type: string
        id:
          type: string
        kind:
          type: string
        label:
          type: string
        options:
          description: Options is empty for the five kinds that are not answered by
            choosing.
          items:
            $ref: '#/components/schemas/service.TicketQuestionOptionView'
          type: array
          uniqueItems: false
        refusal_reason:
          description: RefusalReason is the Operator's reason on a refused question.
          type: string
        required:
          description: |-
            Required produces an Outstanding Answer and nothing else. It is not a
            constraint, and no surface may treat it as one.
          type: boolean
        retired:
          description: |-
            Retired is true for a question kept only so that what has already been
            answered still reads. Retired questions are returned so the authoring
            surface can show them rather than appearing to have lost them.
          type: boolean
        review_status:
          description: |-
            ReviewStatus is where the question stands with the Platform Operator
            (ADR 0056): `draft`, `under_review`, `approved` or `refused`. Only an
            approved question is asked of anybody. Read-only on this surface: the
            verdicts are the Operator's and the submission is a Question Review's.
          type: string
        revocation_reason:
          description: |-
            RevocationReason is the Operator's reason on a Revocation, which is why
            a question that reads retired here stopped being asked.
          type: string
        sort_order:
          type: integer
        timing:
          description: |-
            Timing is 'at_checkout' on every row written so far; the field is here so
            the Organization's choice can be honoured later without migrating Answers.
          type: string
        updated_at:
          type: string
      type: object
    service.TicketSaleLineView:
      properties:
        quantity:
          type: integer
        ticket_type_name:
          type: string
        unit_price_cents:
          type: integer
      type: object
    service.TicketSaleView:
      properties:
        amount_cents:
          type: integer
        confirmation_ref:
          type: string
        currency:
          type: string
        event:
          $ref: '#/components/schemas/service.EventView'
        id:
          type: string
        lines:
          items:
            $ref: '#/components/schemas/service.TicketSaleLineView'
          type: array
          uniqueItems: false
        organization:
          $ref: '#/components/schemas/internal_customers_service.OrganizationView'
        reversal_pending:
          description: |-
            ReversalPending is true exactly while a reversal of this sale is in
            progress: the Customer asked to undo it and the platform has not finished
            (ADR 0024). See repository.TicketSaleRow.ReversalPending for what counts.

            It is not a status and must never be drawn as one. The sale's own Status is
            still "active" and its tickets are still valid, because no money is known to
            have moved — what this field says is that the platform is finding out, and
            the honest thing to show is "we're processing your refund" beside tickets
            that still work.

            It sits beside Reversible rather than folding into it, because the two
            answer different questions: whether this sale MAY be undone, and whether it
            already HAS been asked about. Reversible stays the eligibility rule alone,
            shared verbatim with the guest surfaces and the endpoint, so that it keeps
            meaning one thing. A surface withdraws its Undo action on either — pressing
            while a request is in flight makes nothing new happen — and that composing
            is the surface's job, not this rule's.
          type: boolean
        reversal_status:
          description: |-
            ReversalStatus is where this sale's most recent Reversal Request stands —
            "in_flight", "succeeded", "refused" or "needs_attention" — and null when the
            buyer has never asked (ADR 0024).

            It exists because ReversalPending alone cannot tell a surface why a pending
            refund stopped being pending. An Unresolved Reversal leaves the sale active
            and ReversalPending false, exactly as a refusal does, and the two owe the
            buyer opposite things: a refusal is theirs to be told, while an Unresolved
            Reversal must be met with silence, because nobody knows whether the money
            went back. Only "refused" may be presented as a refusal.
          type: string
        reversible:
          description: |-
            Reversible reports whether the Customer could undo this Ticket Sale right
            now (ADR 0018) — and it is the exact question the reversal endpoint asks
            itself, so a true here is an offer the API will honour if taken promptly.

            It is an answer about this instant and nothing more. It is not a promise:
            the window is offered, not guaranteed, and a true read a minute ago may be
            a refusal a minute from now.

            Three things must all hold. The sale is an active Online Sale — an
            In-Person Sale or an imported one was never collected by the platform, so
            the platform has nothing to give back, and a sale already reversed cannot
            be reversed again. Its Reversal Window is open. And its Payment can in fact
            be undone: a free claim always can, since there is nothing to return, while
            a paid one can only when the Payment Provider that collected it supports
            reversal. That last clause is why a paid purchase inside its window can
            report false — the alternative is an Undo button that fails when pressed.
          type: boolean
        reversible_until:
          description: |-
            ReversibleUntil is the instant this offer runs out, RFC3339 in UTC, so the
            Customer can be told how long they have.

            It is named for Reversible, not for the Reversal Window, because it is the
            deadline on the offer above rather than a publication of the platform's
            rule. The two are the same instant today only because every Payment this
            deployment accepts happens to be reversible; a Payment Provider that could
            not give money back would leave a sale with an open Window and no offer at
            all, and this field would correctly be null rather than reporting a
            deadline nobody could act on.

            Null whenever Reversible is false, and deliberately so: a deadline on a sale
            nobody may reverse means nothing, and a client that cannot draw one cannot
            mislead somebody with it.
          type: string
        sold_at:
          type: string
        status:
          type: string
        tax_id_number:
          type: string
        tax_id_type:
          description: |-
            TaxIDType and TaxIDNumber are the Tax ID this sale was transacted under
            (ADR 0016), so a Customer can tell a personal purchase from one made under
            a company RUC. They are the sale's immutable snapshot, never the
            Customer's current stored assertion: editing a profile or buying again
            under a different Tax ID changes nothing here.

            Both are null together on sales recorded before the feature and on
            imported sales that never carried one; history is not backfilled, and the
            client draws "—" rather than a value nobody supplied.
          type: string
      type: object
    service.TicketTypeDetail:
      properties:
        capacity:
          type: integer
        created_at:
          type: string
        currency:
          type: string
        description:
          type: string
        event_id:
          type: string
        id:
          type: string
        max_per_customer:
          description: |-
            MaxPerCustomer is the Purchase Limit — the most of this Ticket Type one
            Customer may hold at once — or null when the Ticket Type is unrestricted,
            which is most of them. A count of tickets, not money: unlike PriceCents it
            is untouched by Promotion or fee arithmetic (ADR 0025).
          type: integer
        name:
          type: string
        price_cents:
          type: integer
        promotion:
          $ref: '#/components/schemas/service.PromotionView'
        sold_count:
          type: integer
        sort_order:
          type: integer
        updated_at:
          type: string
      type: object
    service.TrendsDay:
      properties:
        date:
          type: string
        lines:
          items:
            $ref: '#/components/schemas/service.TrendsLine'
          type: array
          uniqueItems: false
      type: object
    service.TrendsLine:
      properties:
        quantity:
          type: integer
        takings_cents:
          type: integer
        ticket_type_id:
          type: string
      type: object
    service.TrendsTicketType:
      properties:
        id:
          type: string
        name:
          type: string
        sort_order:
          type: integer
      type: object
    service.UnresolvedReversal:
      properties:
        attempt_count:
          type: integer
        client_transaction_id:
          type: string
        confirmation_ref:
          type: string
        last_error:
          type: string
        requested_at:
          description: |-
            RequestedAt is when the Customer pressed Undo, RFC3339 in UTC — the instant
            the queue is ordered by, and how long this person has been waiting.
          type: string
        sale_status:
          description: |-
            SaleStatus is where the Ticket Sale stands. `reversed` means somebody else
            settled the sale while this ask was in flight, so nothing local is owed.
            `active` means the sale still stands and the operator's move depends on
            LastError beside it: usually nobody knows whether the money left, and the
            dashboard has to say — but a reversal the provider agreed to and the
            platform could not record says so in as many words, and there the money is
            already gone and only the sale needs voiding (#162).
          type: string
        ticket_sale_id:
          type: string
      type: object
    service.WithdrawAllView:
      properties:
        consents:
          $ref: '#/components/schemas/service.OptionalConsentsView'
        withdrew:
          $ref: '#/components/schemas/service.ConsentWithdrewView'
      type: object
    storage.CoverUploadResult:
      properties:
        object_key:
          type: string
        public_url:
          type: string
        upload_url:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: Staff session token as Bearer <session_id>. The Staff BFF also
        accepts an httpOnly cookie.
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: |-
    Ticket POS backend API.
    JSON endpoints use the standard envelope with data, error, and request_id.
    /health is the only endpoint that returns a bare JSON object.
  title: Ticket POS API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/v1/auth/google/verify:
    post:
      description: 'Exchanges an authorization code obtained on the Staff app at Google''s
        token endpoint, using the staff OAuth client, and issues a Staff Session on
        the email address Google vouches for. The session and the auth-fork that follows
        are identical to a passcode''s. An optional `locale` is remembered as the
        person''s Staff Locale exactly as on the passcode route: only when they have
        none. Every failure returns one generic error, so the route reveals nothing
        about which addresses the platform knows.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_identity_handler.googleVerifyBody'
                description: Authorization code, PKCE verifier and redirect URI
                summary: body
        description: Authorization code, PKCE verifier and redirect URI
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeVerifyGoogle'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      summary: Verify a Google Sign-In
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Destroys the authenticated session.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeLogout'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/v1/auth/otp/request:
    post:
      description: Sends a one-time passcode to the given email address.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_identity_handler.otpRequestBody'
                description: Email address
                summary: body
        description: Email address
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOTPRequest'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Too Many Requests
      summary: Request OTP
      tags:
      - auth
  /api/v1/auth/otp/verify:
    post:
      description: Verifies a one-time passcode and creates a server-side session.
        An optional `locale` names the language the login page was rendered in, as
        the caller detected it, and is remembered as the person's Staff Locale — but
        only if they have none. It never overwrites a stored one, because a detected
        language must not overrule a chosen one. A language the platform does not
        serve is ignored rather than refused, and never fails the sign-in.
      requestBody:
        content:

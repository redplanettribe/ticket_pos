        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Remove the Customer's Avatar
      tags:
      - customer
    put:
      description: Attaches a previously uploaded image as the signed-in Customer's
        Avatar. The image key must be one minted by the upload-URL endpoint for this

        requested_at:
          type: string
        requested_by:
          description: RequestedBy is the asker's email, so the record outlives their
            Membership.
          type: string
        resolution_reason:
          description: |-
            The answer, all null while the request is pending or processing.
            ResolutionReason says why the request ended the way it did — a decline the
            platform made, or a failure the bank did — and PayoutID only on a payment
            (#177, #185).
          type: string
        resolved_at:
          type: string
        resolved_by:
          type: string
        status:
          type: string
        transfer_reference:
          description: |-
            TransferReference is the string the bank handed back to identify the
            transfer — the handle for chasing PayPhone about a specific one.
          type: string
        transfer_stale:
          description: |-
            TransferStale is the 72-hour flag: true when this request is `processing`
            and the transfer was submitted more than sales.PayoutTransferStaleAfter
            before the service's injected clock.

            COMPUTED AT READ TIME AND STORED NOWHERE. It is false for every other
            status by construction, so a paid request that took four days does not read
            as a problem after the fact — the flag is about a transfer nobody has
            confirmed, not about one that was slow.
          type: boolean
        transfer_submitted_at:
          description: |-
            TransferSubmittedAt is when an operator submitted the transfer, and null on
            a request that never went through `processing` — including one that went
            `pending → paid` directly, which is an instant transfer and legal.

            IT IS THE DATE THAT MAKES "up to 48 hours" CHECKABLE. Without it the
            organizer's sentence is boilerplate they cannot act on: they would know a
            transfer was sent and have no way to tell whether the wait has already
            outrun what they were promised. That is the whole reason this field is on
            the organizer's surface at all (#187).

            Its two companions on the row are deliberately NOT here, and the omission
            is of a piece with OrganizationID above rather than any kind of masking —
            nothing is masked on an Organization's own surface. TransferSubmittedBy
            answers "which colleague do I ask about this transfer", which is an
            operator's question about an internal handoff (ADR 0026 amendment); the
            organizer's question is whether their money is coming, and an operator's
            email is not the answer to it. TransferReference is the handle for chasing
            PayPhone about a specific transfer, and handing an organizer a reference
            their own bank cannot look up invites them to quote it at a teller who has
            never heard of it. Either can be added the day somebody wants it; neither
            is wanted yet.
          type: string
        transfer_submitted_by:
          description: |-
            TransferSubmittedBy is a different actor from ResolvedBy and is exposed
            beside it rather than folded into it: the operator who submits and the
            operator who confirms may be different people days apart, and an operator
            picking up a three-day-old request needs to know which colleague to ask.
          type: string
      type: object
    service.PayoutsSummary:
      properties:
        currency:
          type: string
        payable_balance_cents:
          type: integer
        payouts:
          items:
            $ref: '#/components/schemas/internal_sales_service.Payout'
          type: array
          uniqueItems: false
        withdrawable_balance_cents:
          type: integer
      type: object
    service.PendingPayoutRequestCount:
      properties:
        pending_count:
          type: integer
      type: object
    service.PlatformSummary:
      properties:
        totals:
          items:
            $ref: '#/components/schemas/service.PlatformTotals'
          type: array
          uniqueItems: false
      type: object
    service.PlatformTotals:
      properties:
        currency:
          type: string
        fee_iva_cents:
          type: integer
        kept_fee_cents:
          description: |-
            KeptFeeCents and KeptFeeIVACents are the part of the two figures above
            that stands on reversed sales, because an Operator Reversal stated the
            platform kept its commission on the refunded sale (#127). They are already
            included in PlatformFeeCents and FeeIVACents — never add them again — and
            travel together like every fee figure here. Zero means no Operator
            Reversal has ever kept a fee, and the dashboard then says nothing.
          type: integer
        kept_fee_iva_cents:
          type: integer
        platform_fee_cents:
          type: integer
        total_owed_cents:
          description: |-
            TotalOwedCents sums only the positive Withdrawable Balances: what the
            platform owes. An Organization in the red after a post-settlement reversal
            owes the platform instead, and netting that off would understate the cash
            that must stay on hand.
          type: integer
      type: object
    service.PromotionView:
      description: |-
        Promotion is the Ticket Type's one Promotion slot, or null when it is
        empty. It travels with the Ticket Type so the editor can render the
        Promotion's state without a second request; PriceCents above stays the
        List Price whether or not a Promotion is live (ADR 0021).
      properties:
        ends_at:
          type: string
        promotional_price_cents:
          type: integer
        starts_at:
          type: string
      type: object
    service.PublicEventCard:
      properties:
        cover_image_url:
          type: string
        currency:
          type: string
        ends_at:
          type: string
        name:
          type: string
        organization:
          $ref: '#/components/schemas/service.PublicOrganizationSummary'
        price_from_cents:
          type: integer
        registration_mode:
          description: |-
            RegistrationMode is how this Event takes sign-ups: 'tickets' (it sells
            Ticket Types here) or 'external' (it hands its audience to a Registration
            Link elsewhere). Never both (ADR 0028).

            A listing card needs it because a null price_from_cents alone cannot be
            read: on a ticketed Event it is a data anomaly, and on an external one it
            is the normal, permanent state — the platform does not know what the other
            site charges and never will. The mode is what lets the card say so in
            words instead of leaving the price slot blank and looking broken.

            The Registration Link itself is deliberately not here. A card is an
            invitation to the Event page, and the destination is named there, next to
            the button that goes to it; a listing that linked straight out would hand
            a Customer to a stranger from a surface that never told them where.
          type: string
        slug:
          type: string
        sold_out:
          type: boolean
        starts_at:
          type: string
        tags:
          items:
            $ref: '#/components/schemas/service.TagView'
          type: array
          uniqueItems: false
        timezone:
          type: string
        venue_name:
          type: string
      type: object
    service.PublicEventDetail:
      properties:
        cover_image_url:
          type: string
        cover_video_url:
          description: |-
            CoverVideoURL is the Event's optional Cover Video, played in the hero over
            the Cover Image poster. Only the key's derived URL is public; listings and
            link previews stay on the Cover Image (ADR 0020).
          type: string
        currency:
          type: string
        description:
          type: string
        discoverable:
          description: |-
            Discoverable mirrors the Event's Discoverable flag so the Storefront can
            mark a non-Discoverable Event noindex. ADR 0002 draws the line between
            reachable and advertised: a published Event is always reachable by direct
            link, and Discoverable only decides whether the platform's own surfaces
            advertise it. Exposing the flag extends that same distinction to crawlers —
            it says nothing about who may load the page, only about who should index
            it, so reachability is unchanged.
          type: boolean
        ends_at:
          type: string
        has_ended:
          type: boolean
        name:
          type: string
        organization:
          $ref: '#/components/schemas/service.PublicOrganizationSummary'
        price_includes_fee:
          description: |-
            PriceIncludesFee reports that the quoted prices carry the platform's
            service fee — true under 'pass_on' Fee Handling. It is the whole basis of
            the Storefront's single muted "includes service fee" note: under 'absorb'
            the buyer pays exactly what the Organization set and no fee is mentioned
            anywhere. No amount is exposed; the platform's cut is never a number a
            Customer sees (ADR 0014).
          type: boolean
        registration_mode:
          description: |-
            RegistrationMode is how this Event takes sign-ups: 'tickets' (it sells
            Ticket Types here) or 'external' (it hands its audience to the Registration
            Link). Never both (ADR 0028). It is what tells the Storefront whether to
            render a ticket selector at all, so it is stated on every Event rather than
            inferred from an empty ticket_types — an Event whose Ticket Types are all
            sold out is not the same page as one that sells nothing here.
          type: string
        registration_url:
          description: |-
            RegistrationURL is the Registration Link, present only on an external
            Event. The Storefront needs the URL itself and not merely the fact of it:
            the Register panel names the destination's hostname beneath the call to
            action, because a Customer being handed to a stranger should learn which
            one before they click rather than after.

            It is null for a ticketed Event even if a link is stored — a link a
            ticketed Event does not use is nothing a Customer should be offered — and
            null for an external Event still missing one, which a published Event
            cannot be (the publish gate requires it, #208).
          type: string
        slug:
          type: string
        starts_at:
          type: string
        tags:
          items:
            $ref: '#/components/schemas/service.TagView'
          type: array
          uniqueItems: false
        ticket_types:
          items:
            $ref: '#/components/schemas/service.PublicTicketType'
          type: array
          uniqueItems: false
        timezone:
          type: string
        venue_address:
          type: string
        venue_name:
          type: string
      type: object
    service.PublicEventPage:
      properties:
        events:
          items:
            $ref: '#/components/schemas/service.PublicEventCard'
          type: array
          uniqueItems: false
        next_cursor:
          type: string
      type: object
    service.PublicOrganizationEvents:
      properties:
        organization:
          $ref: '#/components/schemas/service.PublicOrganizationSummary'
        past:
          items:
            $ref: '#/components/schemas/service.PublicEventCard'
          type: array
          uniqueItems: false
        upcoming:
          items:
            $ref: '#/components/schemas/service.PublicEventCard'
          type: array
          uniqueItems: false
      type: object
    service.PublicOrganizationSummary:
      properties:
        logo_url:
          type: string
        name:
          type: string
        slug:
          type: string
        support_whatsapp:
          description: |-
            SupportWhatsApp is the Organization's Support WhatsApp number in canonical
            E.164 form — a link a Customer taps to message them for support.

            DELIBERATELY PUBLIC. An Org Admin entered it in a form that states it is
            published on every one of their Event pages and that Customers will message
            it; it is safe to display and was not exposed by accident. Omitted entirely
            when the Organization has none, so a client branches on the key's presence
            rather than on an empty string.

            Served on the Event detail only. It is absent from the Event listings by
            design, so do not read it from a card — see ADR 0029.
          type: string
      type: object
    service.PublicPromotion:
      properties:
        ends_at:
          type: string
        list_price_cents:
          type: integer
        promotional_price_cents:
          type: integer
      type: object
    service.PublicTicketType:
      properties:
        already_held:
          description: |-
            AlreadyHeld is how many of this Ticket Type the Customer who asked for this
            page already holds — their active Ticket Sales plus their live Capacity
            Holds, the same count begin-checkout refuses on, and the same word its
            PURCHASE_LIMIT_EXCEEDED details use, so a client learns one name for one
            idea (ADR 0025, #168).

            It is NULL for an anonymous read, and that is not the same statement as 0.
            Zero says "you hold none of these"; null says "we do not know who you are",
            and the Storefront must not turn the second into the first — an anonymous
            visitor learns of their allowance at submit, which is the first moment they
            have told us who they are. Nobody ever reads anybody else's figure: it is
            derived from the Customer Session the request carried and from nothing in
            the URL, so there is no address a caller can ask about but their own.

            It is reported for every Ticket Type a signed-in Customer reads, including
            unrestricted ones, so that null keeps meaning "anonymous" and never doubles
            as "unrestricted" — max_per_customer already says that, and one field
            answering two questions is how a picker ends up bounding the wrong thing.
            It may legitimately exceed max_per_customer: lowering a Purchase Limit is
            not retroactive, so remaining allowance is max(0, limit - already_held) and
            is never asserted non-negative.
          type: integer
        currency:
          type: string
        description:
          type: string
        id:
          type: string
        max_per_customer:
          description: |-
            MaxPerCustomer is the Purchase Limit, or null when this Ticket Type is
            unrestricted. The Storefront bounds its quantity picker by it so a buyer is
            never invited to choose a quantity that will be refused (ADR 0025).

            Unlike PriceCents it is a raw count, untouched by Fee Handling or Promotion
            arithmetic — it counts tickets, not money. It states the Ticket Type's rule
            and nothing about any Customer's holdings: an anonymous reader learns the
            limit, never who has already used theirs up.
          type: integer
        name:
          type: string
        price_cents:
          type: integer
        promotion:
          $ref: '#/components/schemas/service.PublicPromotion'
        remaining:
          type: integer
        sold_out:
          type: boolean
      type: object
    service.ReversalDrainResult:
      properties:
        failed:
          description: |-
            Failed is requests whose pursuit errored — the database, or a local write
            after the provider agreed. Each one logged its own line.
          type: integer
        gave_up:
          description: |-
            GaveUp counts the requests THIS RUN turned into Unresolved Reversals. It is
            the number worth alerting on, and it is not the size of the queue below.
          type: integer
        in_flight_total:
          description: |-
            InFlightTotal is how many Reversal Requests are still open once this run
            finished, and OldestInFlightRequestedAt is when the buyer at the front of
            that queue pressed (RFC3339 in UTC, absent when there is nobody).

            They are the answer to "is this getting better or worse", and the reason
            they are here rather than left to the Unresolved queue below is that the
            queue below is EMPTY for the first 24 hours of any outage — the give-up
            bound has not been reached — which is precisely the day an operator is
            looking. The count says how big the backlog is and the timestamp says how
            long it has been building, so two curls a minute apart answer the question
            without a database session.
          type: integer
        oldest_in_flight_requested_at:
          type: string
        pursued:
          description: |-
            Pursued is how many Reversal Requests this run claimed. Zero is the
            ordinary answer: nothing was stuck.
          type: integer
        refused:
          type: integer
        reversed:
          description: |-
            Reversed, Refused, StillInFlight and GaveUp are where those requests ended.
            They sum to Pursued alongside Skipped and Failed.
          type: integer
        skipped:
          description: |-
            Skipped is requests another actor held or had already settled — a buyer's
            own press, a Customer Area drain, another instance. Not a failure: the claim
            is handed straight back and the next tick takes it up.
          type: integer
        still_in_flight:
          type: integer
        unresolved:
          description: |-
            Unresolved is the standing Unresolved Reversal queue, oldest ask first,
            capped at unresolvedQueuePageSize. It carries what the backlog above cannot
            — the client transaction id and last error per row — because these are the
            ones nobody is pursuing any more, and the next move on each is a human
            typing something into the provider's dashboard.
          items:
            $ref: '#/components/schemas/service.UnresolvedReversal'
          type: array
          uniqueItems: false
        unresolved_total:
          description: |-
            UnresolvedTotal is how long that queue really is, so a truncated page is
            never read as the whole backlog.
          type: integer
      type: object
    service.ReversalOffer:
      properties:
        reversible:
          type: boolean
        reversible_until:
          description: |-
            ReversibleUntil is the instant this offer runs out, RFC3339 in UTC. Named
            for Reversible rather than for the Reversal Window: it is the deadline on
            the offer, and an offer can be absent while the Window is still open (a
            Payment Provider that cannot reverse), in which case it is null.
          type: string
        ticket_sale_id:
          description: |-
            TicketSaleID names the sale this offer is about, so a guest surface can
            send somebody to their own purchase in the Customer Area rather than to the
            whole list (#121).

            It is an identifier and not a credential: reaching that sale still requires
            a Customer Session, which this endpoint cannot mint and does not check. It
            is null exactly when the offer is, because a destination for an undo that
            is not on offer is a link to nothing.
          type: string
      type: object
    service.Sale:
      properties:
        amount_cents:
          type: integer
        channel:
          description: 'Channel is the Sales Channel: ''online'', ''in_person'' or
            ''import''.'
          type: string
        confirmation_ref:
          type: string
        currency:
          type: string
        customer:
          $ref: '#/components/schemas/service.OperatorSaleCustomer'
        event:
          $ref: '#/components/schemas/service.OperatorSaleEvent'
        fee_iva_cents:
          type: integer
        id:
          type: string
        net_proceeds_cents:
          type: integer
        operator_reversal:
          $ref: '#/components/schemas/service.OperatorReversalMemo'
        payment_method:
          description: |-
            PaymentMethod is who settled the money: the Payment Provider on a paid
            Online Sale, 'free' where the platform settled a zero total itself
            (ADR 0017), cash or transfer on a Direct Sale, null where the channel
            carries none.
          type: string
        platform_fee_cents:
          type: integer
        recorded_at:
          type: string
        reversal_window_closes_at:
          description: |-
            ReversalWindowClosesAt is when the Reversal Window shuts for this sale:
            the earlier of 20:00 Ecuador time on the day of purchase and the Event's
            start. Null on a sale that never had a window at all — anything but an
            Online Sale, or an Event with no recorded start.
          type: string
        reversal_window_passed:
          description: |-
            ReversalWindowPassed is the question the operator came to ask: is the
            buyer's own undo out of reach? True once the window has shut, and true as
            well on a sale that never had one, because either way no in-window path
            remains. It says nothing about whether the sale may be reversed — the
            window is deliberately irrelevant to an Operator Reversal (#123).
          type: boolean
        reversed_at:
          description: |-
            ReversedAt/ReversedBy are the Sale Reversal's provenance, both null on an
            active sale and both null on a sale reversed before either was recorded —
            history is shown as it is, never backfilled (ADR 0018).
          type: string
        reversed_by:
          type: string
        sold_at:
          type: string
        source:
          type: string
        status:
          description: |-
            Status is 'active' or 'reversed'. A reversed sale is never deleted and
            keeps its reference, so it is found here exactly as an active one is.
          type: string
        ticket_count:
          type: integer
        ticket_types:
          items:
            $ref: '#/components/schemas/service.SaleLine'
          type: array
          uniqueItems: false
      type: object
    service.SaleLine:
      properties:
        quantity:
          type: integer
        ticket_type_name:
          type: string
      type: object
    service.SaleLookup:
      properties:
        organization:
          $ref: '#/components/schemas/service.Organization'
        sale:
          $ref: '#/components/schemas/service.Sale'
      type: object
    service.SaleReversal:
      properties:
        confirmation_ref:
          type: string
        operator_reversal:
          $ref: '#/components/schemas/service.OperatorReversalMemo'
        reversed_at:
          type: string
        reversed_by:
          description: ReversedBy is always sales.ReversalActorOperator here.
          type: string
        status:
          description: |-
            Status is always "reversed"; a marking that did not happen is an error,
            never a result carrying some other word.
          type: string
        ticket_sale_id:
          type: string
      type: object
    service.SaleReversalResult:
      properties:
        confirmation_ref:
          type: string
        requested_at:
          description: |-
            RequestedAt is when the Customer pressed Undo, RFC3339 in UTC. Present only
            on "pending", and it is the instant of the ORIGINAL ask: a buyer who
            presses again while the platform is still finding out is told when their
            one request was made, not when they pressed the second time.
          type: string
        reversed_at:
          description: |-
            ReversedAt is when the reversal committed, RFC3339 in UTC. Present only on
            "reversed".
          type: string
        status:
          description: |-
            Status is "reversed" when the purchase is undone, and "pending" while a
            Reversal Request is still in flight (ADR 0024).

            "pending" is NOT a softer failure. It says the platform is still finding
            out what the Payment Provider did, so the Ticket Sale is still active and
            the buyer's tickets are still valid — a reversal that was definitely
            refused is an error, never a result carrying a word.
          type: string
        ticket_sale_id:
          type: string
      type: object
    service.SalesSummary:
      properties:
        currency:
          type: string
        net_proceeds_cents:
          type: integer
        sales_count:
          type: integer
      type: object
    service.SessionView:
      properties:
        active_member:
          $ref: '#/components/schemas/service.ActiveMemberView'
        email:
          type: string
        is_platform_operator:
          description: |-
            IsPlatformOperator says whether this session's email is on the platform
            operator allowlist, so the staff app knows whether to render the Operator
            Dashboard navigation. It is a hint for the UI, never the gate: the
            operator middleware re-checks the allowlist on every request (ADR 0015).
            It is orthogonal to Memberships — an operator may have none.
          type: boolean
        memberships:
          items:
            $ref: '#/components/schemas/service.MembershipView'
          type: array
          uniqueItems: false
      type: object
    service.TagView:
      properties:
        canonical_key:
          type: string
        curated:
          type: boolean
        name:
          type: string
      type: object
    service.TicketSaleLineView:
      properties:
        quantity:
          type: integer
        ticket_type_name:
          type: string
        unit_price_cents:
          type: integer
      type: object
    service.TicketSaleView:
      properties:
        amount_cents:
          type: integer
        confirmation_ref:
          type: string
        currency:
          type: string
        event:
          $ref: '#/components/schemas/service.EventView'
        id:
          type: string
        lines:
          items:
            $ref: '#/components/schemas/service.TicketSaleLineView'
          type: array
          uniqueItems: false
        organization:
          $ref: '#/components/schemas/internal_customers_service.OrganizationView'
        reversal_pending:
          description: |-
            ReversalPending is true exactly while a reversal of this sale is in
            progress: the Customer asked to undo it and the platform has not finished
            (ADR 0024). See repository.TicketSaleRow.ReversalPending for what counts.

            It is not a status and must never be drawn as one. The sale's own Status is
            still "active" and its tickets are still valid, because no money is known to
            have moved — what this field says is that the platform is finding out, and
            the honest thing to show is "we're processing your refund" beside tickets
            that still work.

            It sits beside Reversible rather than folding into it, because the two
            answer different questions: whether this sale MAY be undone, and whether it
            already HAS been asked about. Reversible stays the eligibility rule alone,
            shared verbatim with the guest surfaces and the endpoint, so that it keeps
            meaning one thing. A surface withdraws its Undo action on either — pressing
            while a request is in flight makes nothing new happen — and that composing
            is the surface's job, not this rule's.
          type: boolean
        reversal_status:
          description: |-
            ReversalStatus is where this sale's most recent Reversal Request stands —
            "in_flight", "succeeded", "refused" or "needs_attention" — and null when the
            buyer has never asked (ADR 0024).

            It exists because ReversalPending alone cannot tell a surface why a pending
            refund stopped being pending. An Unresolved Reversal leaves the sale active
            and ReversalPending false, exactly as a refusal does, and the two owe the
            buyer opposite things: a refusal is theirs to be told, while an Unresolved
            Reversal must be met with silence, because nobody knows whether the money
            went back. Only "refused" may be presented as a refusal.
          type: string
        reversible:
          description: |-
            Reversible reports whether the Customer could undo this Ticket Sale right
            now (ADR 0018) — and it is the exact question the reversal endpoint asks
            itself, so a true here is an offer the API will honour if taken promptly.

            It is an answer about this instant and nothing more. It is not a promise:
            the window is offered, not guaranteed, and a true read a minute ago may be
            a refusal a minute from now.

            Three things must all hold. The sale is an active Online Sale — an
            In-Person Sale or an imported one was never collected by the platform, so
            the platform has nothing to give back, and a sale already reversed cannot
            be reversed again. Its Reversal Window is open. And its Payment can in fact
            be undone: a free claim always can, since there is nothing to return, while
            a paid one can only when the Payment Provider that collected it supports
            reversal. That last clause is why a paid purchase inside its window can
            report false — the alternative is an Undo button that fails when pressed.
          type: boolean
        reversible_until:
          description: |-
            ReversibleUntil is the instant this offer runs out, RFC3339 in UTC, so the
            Customer can be told how long they have.

            It is named for Reversible, not for the Reversal Window, because it is the
            deadline on the offer above rather than a publication of the platform's
            rule. The two are the same instant today only because every Payment this
            deployment accepts happens to be reversible; a Payment Provider that could
            not give money back would leave a sale with an open Window and no offer at
            all, and this field would correctly be null rather than reporting a
            deadline nobody could act on.

            Null whenever Reversible is false, and deliberately so: a deadline on a sale
            nobody may reverse means nothing, and a client that cannot draw one cannot
            mislead somebody with it.
          type: string
        sold_at:
          type: string
        status:
          type: string
        tax_id_number:
          type: string
        tax_id_type:
          description: |-
            TaxIDType and TaxIDNumber are the Tax ID this sale was transacted under
            (ADR 0016), so a Customer can tell a personal purchase from one made under
            a company RUC. They are the sale's immutable snapshot, never the
            Customer's current stored assertion: editing a profile or buying again
            under a different Tax ID changes nothing here.

            Both are null together on sales recorded before the feature and on
            imported sales that never carried one; history is not backfilled, and the
            client draws "—" rather than a value nobody supplied.
          type: string
      type: object
    service.TicketTypeDetail:
      properties:
        capacity:
          type: integer
        created_at:
          type: string
        currency:
          type: string
        description:
          type: string
        event_id:
          type: string
        id:
          type: string
        max_per_customer:
          description: |-
            MaxPerCustomer is the Purchase Limit — the most of this Ticket Type one
            Customer may hold at once — or null when the Ticket Type is unrestricted,
            which is most of them. A count of tickets, not money: unlike PriceCents it
            is untouched by Promotion or fee arithmetic (ADR 0025).
          type: integer
        name:
          type: string
        price_cents:
          type: integer
        promotion:
          $ref: '#/components/schemas/service.PromotionView'
        sold_count:
          type: integer
        sort_order:
          type: integer
        updated_at:
          type: string
      type: object
    service.UnresolvedReversal:
      properties:
        attempt_count:
          type: integer
        client_transaction_id:
          type: string
        confirmation_ref:
          type: string
        last_error:
          type: string
        requested_at:
          description: |-
            RequestedAt is when the Customer pressed Undo, RFC3339 in UTC — the instant
            the queue is ordered by, and how long this person has been waiting.
          type: string
        sale_status:
          description: |-
            SaleStatus is where the Ticket Sale stands. `reversed` means somebody else
            settled the sale while this ask was in flight, so nothing local is owed.
            `active` means the sale still stands and the operator's move depends on
            LastError beside it: usually nobody knows whether the money left, and the
            dashboard has to say — but a reversal the provider agreed to and the
            platform could not record says so in as many words, and there the money is
            already gone and only the sale needs voiding (#162).
          type: string
        ticket_sale_id:
          type: string
      type: object
    storage.CoverUploadResult:
      properties:
        object_key:
          type: string
        public_url:
          type: string
        upload_url:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: Staff session token as Bearer <session_id>. The Staff BFF also
        accepts an httpOnly cookie.
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: |-
    Ticket POS backend API.
    JSON endpoints use the standard envelope with data, error, and request_id.
    /health is the only endpoint that returns a bare JSON object.
  title: Ticket POS API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/v1/auth/google/verify:
    post:
      description: Exchanges an authorization code obtained on the Staff app at Google's
        token endpoint, using the staff OAuth client, and issues a Staff Session on
        the email address Google vouches for. The session and the auth-fork that follows
        are identical to a passcode's. Every failure returns one generic error, so
        the route reveals nothing about which addresses the platform knows.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_identity_handler.googleVerifyBody'
                description: Authorization code, PKCE verifier and redirect URI
                summary: body
        description: Authorization code, PKCE verifier and redirect URI
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeVerifyGoogle'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      summary: Verify a Google Sign-In
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Destroys the authenticated session.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeLogout'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/v1/auth/otp/request:
    post:
      description: Sends a one-time passcode to the given email address.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_identity_handler.otpRequestBody'
                description: Email address
                summary: body
        description: Email address
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOTPRequest'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Too Many Requests
      summary: Request OTP
      tags:
      - auth
  /api/v1/auth/otp/verify:
    post:
      description: Verifies a one-time passcode and creates a server-side session.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_identity_handler.otpVerifyBody'
                description: Email and passcode
                summary: body
        description: Email and passcode
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeVerifyOTP'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Too Many Requests
      summary: Verify OTP
      tags:
      - auth
  /api/v1/auth/session:
    get:
      description: Returns the authenticated session and membership summary.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeSession'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Get session
      tags:
      - auth
  /api/v1/customer/auth/confirmation-link:
    post:
      description: 'Exchanges the signed token from a Sale Confirmation for a short-lived
        Customer Session scoped to that one Ticket Sale. Does not mark the Customer
        verified. If a full Customer Session is presented in Authorization, it is
        returned unchanged rather than narrowed. A `follow` intent is refused outright
        with CUSTOMER_SESSION_SCOPE_INSUFFICIENT: this door mints a sale-scoped session,
        and subscribing an address to mail takes the same proof signing in does.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.confirmationLinkBody'
                description: Confirmation Link token
                summary: body
        description: Confirmation Link token
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerVerifyOTP'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      summary: Redeem a Confirmation Link
      tags:
      - customer
  /api/v1/customer/auth/google/verify:
    post:
      description: Exchanges an authorization code obtained on the Storefront at Google's
        token endpoint, and issues a Customer Session on the email address Google
        vouches for. Marks the Customer verified by the same rule a passcode does.
        An optional `locale` is remembered as the Customer's Digest Locale, exactly
        as on the passcode route. An optional `follow` carries a Follow intent and
        is honoured exactly as on the passcode route, because both doors are equal
        Proof of Email Ownership. Every failure returns one generic error, so the
        route reveals nothing about which addresses the platform knows.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_customers_handler.googleVerifyBody'
                description: Authorization code, PKCE verifier and redirect URI
                summary: body
        description: Authorization code, PKCE verifier and redirect URI
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerVerifyGoogle'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      summary: Verify a Google Sign-In
      tags:
      - customer
  /api/v1/customer/auth/logout:
    post:
      description: Destroys the Customer Session. The token is worthless immediately;
        a Staff Session is unaffected.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerLogout'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Customer sign-out
      tags:
      - customer
  /api/v1/customer/auth/otp/request:
    post:
      description: Sends a one-time passcode for Customer sign-in. The response is
        identical whether or not the email is known, so it does not reveal who the
        platform's Customers are.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_customers_handler.otpRequestBody'
                description: Email address
                summary: body
        description: Email address
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerOTPRequest'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Too Many Requests
      summary: Request Customer passcode
      tags:
      - customer
  /api/v1/customer/auth/otp/verify:
    post:
      description: 'Verifies a Customer one-time passcode, marks the Customer verified,
        and issues a Customer Session. An optional `locale` names the language of
        the Storefront the sign-in happened on and is remembered as the Customer''s
        Digest Locale; a language the platform does not serve is ignored rather than
        refused. An optional `follow` carries a Follow the visitor pressed before
        signing in, as `organization:<slug>`. It is applied against the Customer Session
        this call mints and against nothing else, so an email in this request can
        never become the address that gets subscribed; the Follow that was made comes
        back in `follow`, or null. A malformed intent — an unknown kind, or a subject
        that is not a well-formed slug — is refused with 400 before the passcode is
        checked, so it does not spend it. A subject that resolves to nothing does
        not fail the sign-in: the session is issued and `follow` is null.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_customers_handler.otpVerifyBody'
                description: Email and passcode
                summary: body
        description: Email and passcode
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerVerifyOTP'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Too Many Requests
      summary: Verify Customer passcode
      tags:
      - customer
  /api/v1/customer/auth/session:
    get:
      description: Returns which email the caller is signed in as, and extends the
        sliding session window.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerSession'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Get Customer Session
      tags:
      - customer
  /api/v1/customer/follows:
    get:
      description: 'Returns everything the signed-in Customer Follows, most recently
        followed first. One list rather than one per kind: each entry carries a `type`
        discriminator and the subject hangs off the field named by it, so a client
        switches on `type` and keeps working as further kinds of Follow are added.
        Always scoped by the Customer Session, never by any identifier in the request.
        Requires a full Customer Session: a Confirmation Link session is refused with
        CUSTOMER_SESSION_SCOPE_INSUFFICIENT.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerFollows'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: List the Customer's Follows
      tags:
      - customer
  /api/v1/customer/follows/organizations/{slug}:
    delete:
      description: 'Removes the signed-in Customer''s Follow of the Organization named
        by slug. Unfollowing something not followed is not an error — the caller asked
        for a state that already holds. A slug no Organization owns is ORGANIZATION_NOT_FOUND.
        Requires a full Customer Session: a Confirmation Link session is refused with
        CUSTOMER_SESSION_SCOPE_INSUFFICIENT. This is an Unfollow and not an Unsubscribe:
        it removes one Follow, where Unsubscribing would leave every Follow standing
        and silence the Follow Digest.'
      parameters:
      - description: Organization slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerLogout'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Unfollow an Organization
      tags:
      - customer
    post:
      description: 'Records that the signed-in Customer Follows the Organization named
        by slug, and returns the Follow. Idempotent: following something already followed
        returns the existing Follow with its original `followed_at` rather than a
        conflict, so a retried or double-tapped request is safe. Answers 200 on both
        the first call and every repeat. A slug no Organization owns is ORGANIZATION_NOT_FOUND.
        Requires a full Customer Session: a Confirmation Link session is refused with
        CUSTOMER_SESSION_SCOPE_INSUFFICIENT, because a forwarded Sale Confirmation
        is not authority to subscribe somebody''s inbox to mail.'
      parameters:
      - description: Organization slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerFollow'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Follow an Organization
      tags:
      - customer
  /api/v1/customer/profile:
    patch:
      description: 'Edits the signed-in Customer''s name, Tax ID, and phone number
        — the "My info" section of the Customer Area. The name must be non-blank on
        both halves; the Tax ID is validated by the same rules as checkout, and sending
        both halves null clears it. The phone is validated by the same rule as checkout
        and stored in canonical E.164 form; sending it null or blank clears it, and
        omitting the field entirely leaves the stored number untouched. The email
        is the Customer''s identity and is not editable here. Requires a full Customer
        Session: a Confirmation Link session is refused with CUSTOMER_SESSION_SCOPE_INSUFFICIENT.
        The edit moves the Customer''s current assertion only — every Ticket Sale
        keeps the name and Tax ID it was transacted under.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.updateProfileBody'
                description: Name, Tax ID, and phone
                summary: body
        description: Name, Tax ID, and phone
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerProfile'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Update the Customer's profile
      tags:
      - customer
  /api/v1/customer/profile/avatar:
    delete:
      description: Removes the signed-in Customer's Avatar, reverting them to the
        initials fallback. Always allowed, whether the Avatar was uploaded or seeded
        from Google Sign-In. Requires a full Customer Session.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerProfile'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Remove the Customer's Avatar
      tags:
      - customer
    put:
      description: Attaches a previously uploaded image as the signed-in Customer's
        Avatar. The image key must be one minted by the upload-URL endpoint for this
        Customer; any other key is refused. Requires a full Customer Session.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.updateAvatarBody'
                description: Uploaded image object key
                summary: body
        description: Uploaded image object key
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerProfile'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Set the Customer's Avatar
      tags:
      - customer
  /api/v1/customer/profile/avatar-upload-url:
    post:
      description: Returns a presigned PUT URL for uploading the signed-in Customer's
        Avatar image (JPEG, PNG, or WebP), keyed under that Customer alone. The upload
        itself goes straight to object storage; attaching the uploaded image is a
        separate PUT to /customer/profile/avatar with the object key. Requires a full
        Customer Session.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.avatarUploadURLBody'
                description: Image content type and optional file name
                summary: body
        description: Image content type and optional file name
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerAvatarUpload'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Create an Avatar upload URL
      tags:
      - customer
  /api/v1/customer/ticket-sales:
    get:
      description: 'Returns the signed-in Customer''s Ticket Sales, upcoming and past,
        across all Organizations. Always scoped by the Customer Session, never by
        any identifier in the request. Each sale reports whether the Customer could
        undo it right now (`reversible`) and, when they could, until when (`reversible_until`,
        RFC3339 UTC). That deadline is the offer''s rather than a publication of the
        Reversal Window: while an undo is on offer it is the earlier of 20:00 Ecuador
        time on the day of purchase or the Event''s start (ADR 0018), and it is null
        whenever no undo is on offer even if that Window is still open. Only an active
        Online Sale can be reversible, and its Payment must be one this deployment
        can actually undo: a free claim always is, since nothing was collected, and
        a paid one is when the Payment Provider that collected it supports reversal
        (ADR 0012). A sale settled by some other provider therefore reports false
        inside its window rather than offering an undo that would fail. `reversible_until`
        is null whenever `reversible` is false. This endpoint reports the window and
        nothing more: there is no reversal action here.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeCustomerArea'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: List the Customer's Ticket Sales
      tags:
      - customer
  /api/v1/customer/ticket-sales/{ticketSaleId}/reverse:
    post:
      description: 'Reverses one of the signed-in Customer''s own Ticket Sales within
        its Reversal Window (ADR 0018), or records the ask as a Reversal Request when
        the Payment Provider does not answer in time (ADR 0024). Authorization is
        the Customer Session and nothing else — a Customer may only reverse a Ticket
        Sale they own, and a Confirmation Link session is not a credential for this.
        The Reversal Window is enforced here on the server whatever the client believed,
        and it is evaluated once, when the Reversal Request is created; a request
        already made stays authorised however long the answer takes. **200 OK — undone.**
        The Ticket Sale becomes reversed with status `reversed` and `reversed_at`,
        every line''s quantity returns to its Ticket Type''s capacity, and the void
        notice is emailed to the Customer once the reversal has committed. The sale
        is not deleted: it keeps its Sale Confirmation reference and stays visible
        in the Customer Area with a reversed status. **202 Accepted — pending.** The
        Payment Provider gave no definite answer (a timeout, a 5xx, a body this integration
        cannot place), so the money may or may not have moved: the body carries status
        `pending` and `requested_at`, and a Reversal Request is in flight. Nothing
        about the money or the tickets has changed — the Ticket Sale stays active,
        its capacity stays held, and the tickets are still valid — and the platform
        asks the provider again, including whenever the Customer loads their Customer
        Area. A client must never render a 202 as a completed refund. Pressing Undo
        again while a request is in flight returns 202 with the original request''s
        `requested_at`: no second Reversal Request, and no second call to the Payment
        Provider. Refused, with nothing changed, when the sale is already reversed
        (SALE_ALREADY_REVERSED), is not an Online Sale or was settled by a Payment
        Provider this deployment cannot ask (SALE_NOT_REVERSIBLE), or its window has
        closed (REVERSAL_WINDOW_CLOSED), or the platform gave up on an earlier Reversal
        Request for it with the outcome still unknown (REVERSAL_UNRESOLVED) — that
        last one is never retried and never reaches the provider, because the money
        may already have gone back and asking again could return it twice; a Platform
        Operator settles it. Refused with 502 SALE_REVERSAL_FAILED, again with nothing
        changed, when the provider was asked and definitely declined: nothing happened,
        the response carries the Sale Confirmation reference and makes no claim about
        the cause, because the provider publishes no code meaning the deadline passed,
        and the provider''s own error code goes to the log only. Two simultaneous
        presses reverse once: attempts on one Ticket Sale are serialised for the whole
        attempt including the call to the Payment Provider, so the second is refused
        as already reversed (SALE_ALREADY_REVERSED), the provider is asked exactly
        once, and capacity is never restored twice. A free Online Sale has no provider
        to ask, creates no Reversal Request, and is always answered synchronously.'
      parameters:
      - description: Ticket Sale id
        in: path
        name: ticketSaleId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeSaleReversal'
          description: OK
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeSaleReversal'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Gateway
      security:
      - BearerAuth: []
      summary: Undo a Ticket Sale
      tags:
      - customer
  /api/v1/internal/reversals/drain:
    post:
      description: 'Runs the Reversal Reconciler: the platform asks the Payment Provider
        again what became of the Reversal Requests it never answered, on the backoff
        ADR 0024 sets (10s, 30s, 2m, 5m, 15m, then every 30m with jitter), and gives
        up 24 hours after the Customer asked by recording an Unresolved Reversal.
        Internal service-to-service only: Cloud Run IAM authenticates the caller by
        Google-signed OIDC ID token before the request reaches the API (ADR 0008),
        and no Customer Session or staff token reaches it. It also finishes a reversal
        the provider already agreed to whose local write failed, leaving the Ticket
        Sale active while the money had gone back: there the answer is already recorded,
        so the run completes the local commit only and the provider is not called
        at all — a second reversal of a payment already reversed could refund the
        buyer twice — and a commit that will not land within the same day becomes
        an Unresolved Reversal whose sale a Platform Operator voids by hand. Safe
        to call by hand at any time and a no-op on an empty queue. It only ever finds
        out what the provider did; it never re-evaluates eligibility, so a Reversal
        Request made inside the Reversal Window still resolves however long after
        the Window closed the answer arrives. Each run claims one Reversal Request
        at a time, works it, and stops at a time budget of its own that expires before
        any deadline outside it, so a backlog can never wedge it; whatever it did
        not reach stays exactly as due as it was found, for the next run. Every pursuit
        takes the per-sale advisory lock, so it can never overlap a Customer''s own
        press or the Customer Area drain — a contended Reversal Request is skipped
        and retried on the next run — and a Ticket Sale somebody else reversed out
        of band is never re-asked about, because that could refund the buyer twice.
        The response tallies what the run did, reports the standing in-flight backlog
        (how many Reversal Requests are still open and when the oldest was asked,
        so two curls a minute apart say whether an incident is getting better or worse),
        and carries the standing Unresolved Reversal queue with each row''s client
        transaction id and last error, so a Platform Operator can find the transaction
        on the provider''s own dashboard.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeReversalDrain'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Internal Server Error
      summary: Pursue stuck Reversal Requests
      tags:
      - internal
  /api/v1/operator/organizations:
    get:
      description: Returns a page of every Organization on the platform — name, slug,
        currency, Event count across all statuses, and withdrawable_balance_cents,
        which is SIGNED (negative when the Organization owes the platform after a
        sale was reversed post-settlement). Sorted by name ascending with an id tiebreaker
        so equal names keep a stable order across pages. Response is the ADR-0006
        nested envelope { data, pagination }; page_size defaults to 50 (max 100) and
        page floors at 1. Platform Operator only.
      parameters:

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeAffiliateLink'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request

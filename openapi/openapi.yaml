  /api/v1/staff/events/{id}/sales:
    get:
      description: 'Returns a page of the Event''s Ticket Sales for the Sales list:
        one row per Ticket Sale with the Customer, rolled-up Ticket Types, amount
        in the Event currency, sold_at, channel/source, status, confirmation_ref,
        the Tax ID snapshot the sale was transacted under (tax_id_type/tax_id_number,
        both null on sales recorded without one), the Sale Reversal provenance on
        a reversed row (reversed_at and reversed_by, which is `customer` when the
        buyer reversed their own Online Sale, `staff` when a Sale Import undo or a
        single-sale staff reversal did, and `operator` when the platform reversed
        it after refunding the buyer off-platform at the Organization''s request;
        both null on an active sale and on a sale reversed before either was recorded
        — the Operator Reversal''s money memo is operator-facing only and never appears
        here), the Sale Correction linkage (replaced_by_sale_id on a corrected sale
        and replaces_sale_id on its replacement, each with the linked sale''s Confirmation
        reference beside it as replaced_by_confirmation_ref / replaces_confirmation_ref,
        all null until a correction is recorded — ADR 0050), `origin` — how the sale
        reached the platform, one of `sale_import` (it arrived in an uploaded Sale
        Import batch), `manually_recorded` (a Manually Recorded Sale somebody typed),
        `correction_replacement` (a Sale Correction''s replacement) or `channel_sale`
        (it sold on a Sales Channel of its own), derived from the row and stored nowhere,
        so a row nobody recognises can be accounted for (ADR 0052) — each rolled-up
        Ticket Type carrying its ticket_type_id so the Correct form can be pre-filled
        from the row, held_ticket_count (how many of the sale''s Tickets have an accepted
        Holder, the people a reversal would tell), and the recorded-at and payment
        method for the row-detail expand. Filterable by status (default active), ticket
        type (sales including that type), sold-at date range (interpreted in the Event
        timezone as a half-open interval, end date inclusive), a case-insensitive
        substring search over customer email/name/confirmation_ref/Tax ID number,
        and channel/source/payment_method. Sortable by `sort` (sold_at, recorded_at,
        customer, amount) and `dir` (asc/desc), both validated against allowlists
        and defaulting to sold_at descending; every sort carries a secondary id tiebreaker
        so equal values keep a stable order across pages. Response is the ADR-0006
        nested envelope { data, pagination, reversed_count } with total via COUNT(*)
        OVER(); page_size defaults to 50 (max 100) and page floors at 1. `reversed_count`
        is how many of the Event''s Ticket Sales are reversed, across the whole Event
        and independent of every filter on the request (including status), so a Sale
        Reversal is visible rather than a row that silently left the default view;
        it is 0 on an Event that has never had one. Visible to any Member of the Event.'
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Page number (1-based; floors at 1)
        in: query
        name: page
        schema:
          type: integer
      - description: Page size (default 50, max 100)
        in: query
        name: page_size
        schema:
          type: integer
      - description: Ticket Sale status
        in: query
        name: status
        schema:
          enum:
          - active
          - reversed
          type: string
      - description: Keep only sales that include this Ticket Type
        in: query
        name: ticket_type_id
        schema:
          type: string
      - description: Sold-at range start (YYYY-MM-DD, Event timezone, inclusive)
        in: query
        name: sold_from
        schema:
          type: string
      - description: Sold-at range end (YYYY-MM-DD, Event timezone, inclusive of the
          whole day)
        in: query
        name: sold_to
        schema:
          type: string
      - description: Case-insensitive substring over customer email, name, confirmation_ref,
          and Tax ID number (full or partial)
        in: query
        name: q
        schema:
          type: string
      - description: Sales Channel
        in: query
        name: channel
        schema:
          enum:
          - online
          - in_person
          - import
          type: string
      - description: Sales Source
        in: query
        name: source
        schema:
          enum:
          - direct
          - external_platform
          type: string
      - description: Payment Method
        in: query
        name: payment_method
        schema:
          enum:
          - cash
          - transfer
          - payphone
          - free
          type: string
      - description: Sort column (default sold_at)
        in: query
        name: sort
        schema:
          enum:
          - sold_at
          - recorded_at
          - customer
          - amount
          type: string
      - description: Sort direction (default desc)
        in: query
        name: dir
        schema:
          enum:
          - asc
          - desc
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      security:
      - BearerAuth: []
      summary: List an Event's Ticket Sales
      tags:
      - staff
    post:
      description: 'A Manually Recorded Sale (#368, ADR 0052): ONE Sale Import row
        typed instead of uploaded. The body is the Sale Import template''s columns
        — customer_email, customer_first_name, customer_last_name, the optional customer_tax_id_type/customer_tax_id_number
        pair, ticket_type_id, quantity, payment_method (cash|transfer), sold_at (ISO
        8601, naive values read in the Event timezone), and an optional amount_cents
        giving the price of ONE ticket, overriding the Ticket Type''s catalog price
        and multiplied by the quantity (0 records a comp). There is deliberately NO
        send_confirmation and NO idempotency_key. The row is validated exactly as
        an import row: Ticket Type on this Event, the Tax ID pair rule with the pair
        optional, a positive integer quantity, sold_at not in the future — plus two
        departures from the file import, both deliberate: CAPACITY is refused here
        on the quantity rather than deferred to a batch commit, and the PURCHASE LIMIT
        is enforced. A refused row returns 400 VALIDATION_FAILED with one field error
        per offending column, named by the template''s bare column name with no rows[N].
        prefix, and writes nothing. A row matching another active sale on the Event
        by email, Ticket Type and sold-at date carries possible_duplicate with duplicate_of_date
        — a warning that never blocks the record. The recorded sale is a Direct Sale
        on the `import` channel with source `direct` and NO Sale Import batch: it
        never appears in the Import history, and recording one never stops an earlier
        upload being the latest batch, so an existing batch stays undoable. Tickets
        are minted one per unit and the BUYER holds the first of them as a Self-held
        Ticket — assigned to them and `accepted` in the same transaction, so the Holder
        List names them (ADR 0055) — with the rest `unassigned`; the presumption makes
        nobody Verified, sends no Assignment mail, has deliberately NO checkbox to
        opt out of, and is not written at all while TICKET_ASSIGNMENT_ENABLED is off.
        No fee snapshot is written, so the sale contributes its full price to Takings
        and nothing to Net Proceeds. The buyer is ALWAYS mailed their Sale Confirmation,
        in their own remembered language; confirmation_sent reports whether that mail
        went out and a failure does not undo the sale. Refused with 409 EVENT_IS_EXTERNAL_REGISTRATION
        before any field is judged on an Event that registers externally, 404 EVENT_NOT_FOUND
        when the Event is not this Organization''s, and 409 IMPORT_BATCH_FAILED if
        capacity was lost to a race between validation and commit. Gated by the same
        permission as Sale Import; reading the Sales list is not.'
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.manualSaleBody'
                description: The sale, as the Sale Import template's columns
                summary: body
        description: The sale, as the Sale Import template's columns
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
      security:
      - BearerAuth: []
      summary: Record one Ticket Sale by hand
      tags:
      - staff
  /api/v1/staff/events/{id}/sales/{saleId}/correct:
    post:
      description: 'A Sale Correction (ADR 0050): reverses a single active `import`-channel
        Ticket Sale and records a replacement in the SAME transaction, each pointing
        at the other (replaced_by_sale_id on the old sale, replaces_sale_id on the
        new one). The body is the Sale Import template''s columns for the replacement
        — customer_email, customer_first_name, customer_last_name, the optional customer_tax_id_type/customer_tax_id_number
        pair, ticket_type_id, quantity, payment_method (cash|transfer), sold_at (ISO
        8601, naive values read in the Event timezone), and an optional amount_cents
        giving the price of ONE ticket, overriding the catalog price and multiplied
        by the quantity — plus `send_confirmation` (default false). The replacement
        is validated exactly like an import row: Ticket Type on the Event, Tax ID
        rules when either half is filled, Payment Method required, sold_at not in
        the future, capacity and the Purchase Limit both counted NET of the sale being
        reversed. A refused replacement returns 400 VALIDATION_FAILED with one field
        error per offending column (field names are the template''s column names)
        and writes nothing — the original sale stays active. The replacement is a
        fresh sale: channel `import`, source `direct`, no Sale Import batch (so a
        later batch undo never sweeps it), a new Sale Confirmation reference, and
        fresh Tickets — no Ticket Assignment or Answer is carried over, though the
        replacement''s BUYER holds its first Ticket as a Self-held Ticket exactly
        as on any imported Sale (ADR 0055), so a correction re-seats the buyer on
        the Holder List instead of dropping them off it; the rest start `unassigned`,
        and nothing is written while TICKET_ASSIGNMENT_ENABLED is off. Every Holder
        who ACCEPTED a Ticket Assignment on the old sale is told it is no longer theirs,
        whatever send_confirmation says; the buyer''s own presumed Self-held Ticket
        is the exception, since the buyer never accepted anything — that No Longer
        Holding notice follows send_confirmation like any other buyer mail (ADR 0055).
        The buyer is otherwise mailed NOTHING unless send_confirmation is true, in
        which case the replacement''s Sale Confirmation (with the outstanding-answers
        line) goes to the replacement''s email — never a voided mail. Works before,
        during and after the Event. Refused with 409 SALE_NOT_IMPORTED on an Online
        or In-Person Sale, 409 SALE_ALREADY_REVERSED on a reversed (or already corrected)
        sale, 404 TICKET_SALE_NOT_FOUND when the sale is not on this Event, and 409
        IMPORT_BATCH_FAILED if capacity was lost to a race between validation and
        commit. Gated by the same permission as Sale Import.'
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Ticket Sale ID
        in: path
        name: saleId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.correctSaleBody'
                description: The replacement, as the template's columns, plus send_confirmation
                summary: body
        description: The replacement, as the template's columns, plus send_confirmation
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
      security:
      - BearerAuth: []
      summary: Correct one imported Ticket Sale
      tags:
      - staff
  /api/v1/staff/events/{id}/sales/{saleId}/correct/preview:
    post:
      description: 'The Correct form''s live verdict (#352, ADR 0050): validates the
        replacement exactly as POST .../correct would, and writes nothing. The body
        is the same as the commit''s (send_confirmation is accepted and ignored).
        Returns the Sale Import preview''s shape — `rows` holding exactly one row
        with its `valid` flag and per-column `errors` (field names are the template''s
        column names), `capacity_impact` per Ticket Type, and `committable` — with
        every figure counted NET of the sale being corrected: re-submitting the sale''s

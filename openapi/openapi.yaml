  /api/v1/staff/events/{id}/sales:
    get:
      description: 'Returns a page of the Event''s Ticket Sales for the Sales list:
        one row per Ticket Sale with the Customer, rolled-up Ticket Types, amount
        in the Event currency, sold_at, channel/source, status, confirmation_ref,
        the Tax ID snapshot the sale was transacted under (tax_id_type/tax_id_number,
        both null on sales recorded without one), the Sale Reversal provenance on
        a reversed row (reversed_at and reversed_by, which is `customer` when the
        buyer reversed their own Online Sale, `staff` when a Sale Import undo did,
        and `operator` when the platform reversed it after refunding the buyer off-platform
        at the Organization''s request; both null on an active sale and on a sale
        reversed before either was recorded — the Operator Reversal''s money memo
        is operator-facing only and never appears here), and the recorded-at and payment
        method for the row-detail expand. Filterable by status (default active), ticket
        type (sales including that type), sold-at date range (interpreted in the Event
        timezone as a half-open interval, end date inclusive), a case-insensitive
        substring search over customer email/name/confirmation_ref/Tax ID number,
        and channel/source/payment_method. Sortable by `sort` (sold_at, recorded_at,
        customer, amount) and `dir` (asc/desc), both validated against allowlists
        and defaulting to sold_at descending; every sort carries a secondary id tiebreaker
        so equal values keep a stable order across pages. Response is the ADR-0006
        nested envelope { data, pagination, reversed_count } with total via COUNT(*)
        OVER(); page_size defaults to 50 (max 100) and page floors at 1. `reversed_count`
        is how many of the Event''s Ticket Sales are reversed, across the whole Event
        and independent of every filter on the request (including status), so a Sale
        Reversal is visible rather than a row that silently left the default view;
        it is 0 on an Event that has never had one. Visible to any Member of the Event.'
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Page number (1-based; floors at 1)
        in: query
        name: page
        schema:
          type: integer
      - description: Page size (default 50, max 100)
        in: query
        name: page_size
        schema:
          type: integer
      - description: Ticket Sale status
        in: query
        name: status
        schema:
          enum:
          - active
          - reversed
          type: string
      - description: Keep only sales that include this Ticket Type
        in: query
        name: ticket_type_id
        schema:
          type: string

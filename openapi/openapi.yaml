            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      summary: Get public organization events
      tags:
      - public
  /api/v1/public/organizations/{slug}/events/{eventSlug}:
    get:
      description: 'Returns a published event with its ticket types for the Storefront
        event page. A Customer Session presented in Authorization is optional and
        changes nothing but one field: each ticket type then carries already_held,
        how many of it that Customer already holds — their active Ticket Sales plus
        their live Capacity Holds, the same count begin-checkout refuses on, so the
        picker can bound itself at max(0, max_per_customer - already_held) and a ticket
        type whose allowance is spent can say so instead of claiming to be sold out
        (ADR 0025). An absent, expired or invalid token reads the event as an anonymous
        visitor rather than failing, and already_held is then null — null means "we
        do not know who is asking", which is not the same statement as 0. already_held
        may exceed max_per_customer, because lowering a Purchase Limit is never retroactive.
        No unauthenticated lookup of anybody''s holdings exists: the count comes from
        the session and from nothing in the URL.'
      parameters:
      - description: Organization slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      - description: Event slug
        in: path
        name: eventSlug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopePublicEventDetail'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      summary: Get public event
      tags:
      - public
  /api/v1/public/organizations/{slug}/events/{eventSlug}/affiliate-links/{code}/click:
    post:
      description: 'Counts one visit to an Event page reached through an Affiliate
        Link''s code (?ref=CODE). Public and unauthenticated: the Storefront calls
        it fire-and-forget while rendering the page. Raw counting — repeat visits
        count again, with no dedup and no visitor identification. A code that matches
        nothing live (unknown, mistyped, belonging to another Event, or deactivated)
        is accepted and counts nothing, so a dead ref in a URL never becomes an error
        a buyer can see.'
      parameters:
      - description: Organization slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      - description: Event slug
        in: path
        name: eventSlug
        required: true
        schema:
          type: string
      - description: Affiliate link code
        in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Accepted
      summary: Record affiliate link click
      tags:
      - public
  /api/v1/public/organizations/{slug}/events/{eventSlug}/checkout:
    post:
      description: 'Starts a guest checkout on a published event: validates ticket
        types, quantities, remaining capacity (check-only, no hold) and each Ticket
        Type''s Purchase Limit, snapshots current unit prices into a Payment, and
        returns our client transaction id with how the checkout was left. A checkout
        with money to collect comes back status "pending" with the Payment Provider''s
        redirect_url, exactly as before. A checkout whose cart totals zero — Free
        Ticket Types only — is settled here and now by the platform itself: no Payment
        Provider is contacted, the Ticket Sale is recorded and its Sale Confirmation
        sent before the response is written, and the result comes back status "approved"
        with confirmation_ref and no redirect_url (ADR 0017). One paid ticket anywhere
        in the cart makes the whole checkout a provider checkout. Refused with 409
        PURCHASE_LIMIT_EXCEEDED when a requested Ticket Type carries a Purchase Limit
        and this buyer would end up holding more than it allows — details carry ticket_type_id,
        limit, already_held and requested. The allowance counts that Customer''s active
        Ticket Sales plus their live Capacity Holds, so an abandoned checkout releases
        it and a Sale Reversal returns it; it is keyed on the Customer, and checked
        here only and never again when the sale commits, so a Payment the provider
        approved is never refused over it (ADR 0025). A cart breaching both its Purchase
        Limit and remaining capacity reports PURCHASE_LIMIT_EXCEEDED, because that
        refusal is terminal for this buyer while CAPACITY_EXCEEDED would invite a
        smaller retry the limit refuses just the same. Guest checkout: no authentication
        is required, only an email, a name, and a valid Tax ID — which is required
        for a free claim exactly as it is for a paid one. customer_phone is optional:
        supplied, it is recorded in canonical E.164 form and offered to the Payment
        Provider so its hosted payment page arrives prefilled; omitted, the checkout
        proceeds identically and nothing is sent in its place. affiliate_codes is
        optional and carries the Affiliate Link codes the buyer''s recent clicks on
        this Event left behind, newest first: the first that matches one of this Event''s
        live links credits the Ticket Sale, and a history of unknown, mistyped or
        deactivated codes simply records the sale unattributed — it never refuses
        a checkout. At most 5 codes are read; anything beyond is ignored. A Customer
        Session presented in Authorization is optional and changes nothing about the
        sale — it marks the buyer''s details as their own assertion, which is what
        lets them replace the Tax ID and phone already stored on that Customer.'
      parameters:
      - description: Organization slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      - description: Event slug
        in: path
        name: eventSlug
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.beginCheckoutBody'
                description: Checkout lines, customer identity, Tax ID and optional
                  phone
                summary: body
        description: Checkout lines, customer identity, Tax ID and optional phone
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeBeginCheckout'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
      summary: Begin an online checkout
      tags:
      - public
  /api/v1/public/organizations/{slug}/events/{eventSlug}/registration-link/click:
    post:
      description: 'Counts one hand-off from an Event page to its Registration Link.
        Public and unauthenticated: the caller is the Storefront redirect route a
        Customer is passing through on their way to the registration site, not a browser
        talking to this API directly. Raw counting — a Customer who returns counts
        again, with no dedup and no visitor identification — and it counts CLICKS,
        never registrations and never people: the platform loses sight of the Customer
        at the link and never learns whether they signed up. An address that resolves
        to nothing (unknown Organization, unknown Event, or an Event that sells Ticket
        Types here) is accepted and counts nothing, so a tracking miss can never become
        an error that stops somebody registering.'
      parameters:
      - description: Organization slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      - description: Event slug
        in: path
        name: eventSlug
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Accepted
      summary: Record registration link click
      tags:
      - public

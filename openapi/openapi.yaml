  /api/v1/operator/organizations/{orgID}/payouts:
    post:
      description: 'Records a settlement against an Organization — amount in cents,
        the calendar day the money left the bank (YYYY-MM-DD), and an optional note
        — stamped with the recording operator''s email, and returns the created entry.
        The amount is NEVER refused for exceeding the Withdrawable Balance: by recording
        time the money has already moved, so an over-balance Payout is accepted and
        drives the signed balance negative (ADR 0015). A Payout has no states and
        cannot be edited or deleted. Platform Operator only.'
      parameters:
      - description: Organization ID
        in: path
        name: orgID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.recordPayoutBody'
                description: Payout to record
                summary: body
        description: Payout to record
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOperatorPayout'
          description: Created
        "400":

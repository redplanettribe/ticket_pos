  /api/v1/staff/events/{id}/sales/{saleId}/reverse:
    post:
      description: 'Reverses a single active `import`-channel Ticket Sale from any
        Sale Import batch, however old (ADR 0050): the sale is marked reversed by
        staff, each Ticket Type''s sold_count is restored, every Holder who accepted
        a Ticket Assignment on it is told it is no longer theirs, and the buyer is
        mailed nothing — including when the buyer holds the sale''s first Ticket as
        a presumed Self-held Ticket, which on this route is not a Holder who gets
        told (ADR 0055). The batch is not touched and stays undoable for its remaining
        active sales. Refused with 409 SALE_NOT_IMPORTED on an Online or In-Person
        Sale, 409 SALE_ALREADY_REVERSED on a reversed sale, and 404 TICKET_SALE_NOT_FOUND
        when the sale is not on this Event. Gated by the same permission as Sale Import.'

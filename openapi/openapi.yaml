    service.OrganizationListItem:
      properties:
        currency:
          type: string
        events_count:
          description: EventsCount counts the Organization's Events in every status.
          type: integer
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        withdrawable_balance_cents:
          description: |-
            WithdrawableBalanceCents is signed: negative means the Organization owes
            the platform after a sale was reversed post-settlement, and the list says
            so rather than clamping it to zero.
          type: integer
      type: object
    service.OutstandingPagination:
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          description: |-
            Total is how many Tickets the current view holds across the whole Event —
            the roster, or the Tickets that owe when the filter is on. A page past
            the last still reports it truthfully, so a surface can say how many there
            are rather than appearing to have emptied.
          type: integer
        total_pages:
          type: integer
      type: object
    service.OutstandingQuestionView:

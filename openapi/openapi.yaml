  /api/v1/staff/me:
    get:
      description: 'Returns the active member and organization for the authenticated
        session, together with the signed-in person''s Staff Locale. `locale` is null
        when they have stated none, which is not the same as English: it says nobody
        has chosen, and a reader with null is written to in English all the same.
        The API reports which language a person prefers; it does not answer in one,
        and no read path here consults Accept-Language (ADR 0027).'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeStaffMe'
          description: OK
        "401":
          content:
            application/json:

          type: string
        organization_name:
          type: string
        organization_slug:
          type: string
        role:
          type: string
      type: object
    service.AffiliateLinkView:
      properties:
        active:
          type: boolean
        clicks:
          description: |-
            Clicks is how many times the Event page was reached through this link —
            raw visits, counted again every time, which is what makes a bad link
            readable next to a bad audience.
          type: integer
        code:
          type: string
        created_at:
          type: string
        id:
          type: string
        name:
          type: string
        net_proceeds_cents:
          type: integer
        sales_count:
          description: |-
            SalesCount and NetProceedsCents are the link's Affiliate Attribution
            figures: how many ACTIVE Ticket Sales it drove, and what they left the
            Organization after the Platform Fee and its Fee IVA. Display-only — no
            commission is computed from either — and a reversed sale drops out of both
            however it was reversed. A link that drove only free claims shows its count
            with zero beside it.
          type: integer
        url:
          description: |-
            URL is the whole thing an organizer copies: the Storefront Event page with
            the code as its ref. Derived at read time from the Storefront origin this
            process is configured with, never stored, so moving the Storefront moves
            every link with it.
          type: string
      type: object
    service.BeginCheckoutResult:
      properties:
        amount_cents:
          type: integer
        client_transaction_id:
          type: string
        confirmation_ref:
          description: |-
            ConfirmationRef is the Sale Confirmation reference, set only on an approved
            checkout — the buyer has their tickets already and this is what they quote.
          type: string
        currency:
          type: string
        redirect_url:
          type: string
        status:
          description: |-
            Status is how the checkout was left: "pending" on the Payment Provider, or
            "approved" when there was nothing to collect and it settled here.
          enum:
          - pending
          - approved
          type: string
      type: object
    service.ConfirmCheckoutResult:
      properties:
        client_transaction_id:
          type: string
        confirmation_ref:
          type: string
        status:
          description: Status is "approved" or "failed".
          type: string
      type: object

  /api/v1/staff/organization/payouts:
    get:
      description: 'Returns the acting Member''s Organization''s Withdrawable Balance
        — the Net Proceeds of its active Online Sales (each line''s unit price minus
        the Platform Fee and Fee IVA snapshotted on it) minus every recorded Payout
        — in the Organization currency, plus the payout history newest first. The
        balance is signed: a sale reversed after a settlement makes it negative, and
        that is shown as-is. Read-only from this side: a Payout is recorded by a Platform
        Operator on the operator surface (ADR 0015), and appears here unchanged. Org
        Admin only.'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopePayoutsSummary'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Get the Organization's Withdrawable Balance and payout history
      tags:
      - staff

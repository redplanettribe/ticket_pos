  /api/v1/public/organizations/{slug}/events/{eventSlug}/checkout:
    post:
      description: 'Starts a guest checkout on a published event: validates ticket
        types, quantities, and remaining capacity (check-only, no hold), snapshots
        current unit prices into a Payment, and returns our client transaction id
        with how the checkout was left. A checkout with money to collect comes back
        status "pending" with the Payment Provider''s redirect_url, exactly as before.
        A checkout whose cart totals zero — Free Ticket Types only — is settled here
        and now by the platform itself: no Payment Provider is contacted, the Ticket
        Sale is recorded and its Sale Confirmation sent before the response is written,
        and the result comes back status "approved" with confirmation_ref and no redirect_url
        (ADR 0017). One paid ticket anywhere in the cart makes the whole checkout
        a provider checkout. Guest checkout: no authentication is required, only an
        email, a name, and a valid Tax ID — which is required for a free claim exactly
        as it is for a paid one. customer_phone is optional: supplied, it is recorded
        in canonical E.164 form and offered to the Payment Provider so its hosted
        payment page arrives prefilled; omitted, the checkout proceeds identically
        and nothing is sent in its place. affiliate_codes is optional and carries
        the Affiliate Link codes the buyer''s recent clicks on this Event left behind,
        newest first: the first that matches one of this Event''s live links credits
        the Ticket Sale, and a history of unknown, mistyped or deactivated codes simply
        records the sale unattributed — it never refuses a checkout. At most 5 codes
        are read; anything beyond is ignored. A Customer Session presented in Authorization
        is optional and changes nothing about the sale — it marks the buyer''s details
        as their own assertion, which is what lets them replace the Tax ID and phone
        already stored on that Customer.'
      parameters:
      - description: Organization slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      - description: Event slug
        in: path
        name: eventSlug
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.beginCheckoutBody'
                description: Checkout lines, customer identity, Tax ID and optional
                  phone
                summary: body
        description: Checkout lines, customer identity, Tax ID and optional phone
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeBeginCheckout'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
      summary: Begin an online checkout
      tags:
      - public

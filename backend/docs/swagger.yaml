components:
  schemas:
    handler.createOrganizationBody:
      properties:
        name:
          type: string
        slug:
          type: string
      type: object
    handler.healthResponse:
      properties:
        status:
          example: ok
          type: string
      type: object
    handler.otpRequestBody:
      properties:
        email:
          type: string
      type: object
    handler.otpVerifyBody:
      properties:
        code:
          type: string
        email:
          type: string
      type: object
    handler.selectOrganizationBody:
      properties:
        member_id:
          type: string
      type: object
    openapi.EnvelopeLogout:
      properties:
        data:
          $ref: '#/components/schemas/openapi.MessageData'
        error:
          $ref: '#/components/schemas/platform.APIError'
        request_id:
          type: string
      type: object
    openapi.EnvelopeMembershipList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/service.MembershipView'
          type: array
          uniqueItems: false
        error:
          $ref: '#/components/schemas/platform.APIError'
        request_id:
          type: string
      type: object
    openapi.EnvelopeOTPRequest:
      properties:
        data:
          $ref: '#/components/schemas/service.OTPRequestResult'
        error:
          $ref: '#/components/schemas/platform.APIError'
        request_id:
          type: string
      type: object
    openapi.EnvelopeSession:
      properties:
        data:
          $ref: '#/components/schemas/service.SessionView'
        error:
          $ref: '#/components/schemas/platform.APIError'
        request_id:
          type: string
      type: object
    openapi.EnvelopeStaffMe:
      properties:
        data:
          $ref: '#/components/schemas/service.ActiveMemberView'
        error:
          $ref: '#/components/schemas/platform.APIError'
        request_id:
          type: string
      type: object
    openapi.EnvelopeVerifyOTP:
      properties:
        data:
          $ref: '#/components/schemas/openapi.VerifyOTPData'
        error:
          $ref: '#/components/schemas/platform.APIError'
        request_id:
          type: string
      type: object
    openapi.MessageData:
      properties:
        message:
          type: string
      type: object
    openapi.VerifyOTPData:
      properties:
        session:
          $ref: '#/components/schemas/service.SessionView'
        session_id:
          type: string
      type: object
    platform.APIError:
      properties:
        code:
          type: string
        details: {}
        message:
          type: string
      type: object
    platform.Envelope:
      properties:
        data: {}
        error:
          $ref: '#/components/schemas/platform.APIError'
        request_id:
          type: string
      type: object
    service.ActiveMemberView:
      properties:
        member_id:
          type: string
        organization_id:
          type: string
        organization_name:
          type: string
        organization_slug:
          type: string
        role:
          type: string
      type: object
    service.MembershipView:
      properties:
        member_id:
          type: string
        organization_id:
          type: string
        organization_name:
          type: string
        organization_slug:
          type: string
        role:
          type: string
      type: object
    service.OTPRequestResult:
      properties:
        message:
          type: string
      type: object
    service.SessionView:
      properties:
        active_member:
          $ref: '#/components/schemas/service.ActiveMemberView'
        email:
          type: string
        memberships:
          items:
            $ref: '#/components/schemas/service.MembershipView'
          type: array
          uniqueItems: false
      type: object
  securitySchemes:
    BearerAuth:
      description: Staff session token as Bearer <session_id>. The Staff BFF also
        accepts an httpOnly cookie.
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: |-
    Ticket POS backend API.
    JSON endpoints use the standard envelope with data, error, and request_id.
    /health is the only endpoint that returns a bare JSON object.
  title: Ticket POS API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/v1/auth/logout:
    post:
      description: Destroys the authenticated session.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeLogout'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/v1/auth/otp/request:
    post:
      description: Sends a one-time passcode to the given email address.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.otpRequestBody'
                description: Email address
                summary: body
        description: Email address
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeOTPRequest'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Too Many Requests
      summary: Request OTP
      tags:
      - auth
  /api/v1/auth/otp/verify:
    post:
      description: Verifies a one-time passcode and creates a server-side session.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.otpVerifyBody'
                description: Email and passcode
                summary: body
        description: Email and passcode
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeVerifyOTP'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Too Many Requests
      summary: Verify OTP
      tags:
      - auth
  /api/v1/auth/session:
    get:
      description: Returns the authenticated session and membership summary.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeSession'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Get session
      tags:
      - auth
  /api/v1/staff/me:
    get:
      description: Returns the active member and organization for the authenticated
        session.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeStaffMe'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Get staff context
      tags:
      - staff
  /api/v1/staff/memberships:
    get:
      description: Lists organization memberships for the authenticated session email.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeMembershipList'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: List memberships
      tags:
      - staff
  /api/v1/staff/organizations:
    post:
      description: Creates an organization, org_admin member, and sets the session
        active member.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.createOrganizationBody'
                description: Organization details
                summary: body
        description: Organization details
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeSession'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Conflict
      security:
      - BearerAuth: []
      summary: Create organization
      tags:
      - staff
  /api/v1/staff/session/organization:
    post:
      description: Sets the active member on the authenticated session.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.selectOrganizationBody'
                description: Member to activate
                summary: body
        description: Member to activate
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openapi.EnvelopeSession'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/platform.Envelope'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Select organization
      tags:
      - staff
  /health:
    get:
      description: Returns service health status.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.healthResponse'
          description: OK
      summary: Health check
      tags:
      - public
tags:
- description: Public routes for the Storefront (no auth)
  name: public
- description: Staff email OTP authentication and session management
  name: auth
- description: Staff routes for catalog, sales, and organization management
  name: staff

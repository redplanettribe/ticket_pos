# Production-parity stack: the API runs from the production image
# (backend/Dockerfile), and migrations are applied by a one-shot running that
# same image's migrate entrypoint — exactly how Cloud Run runs them as a Job.
#
# Separate project name and host ports so it can run alongside `make dev`.
# See README "Production-parity stack".
name: ticket-pos-prod

# The API and the migration job are the same image, differing only in
# entrypoint — the anchor keeps that literally true.
x-api-image: &api-image
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: ticket-pos-api:parity

x-database-url: &database-url postgres://ticket_pos:ticket_pos@postgres:5432/ticket_pos?sslmode=disable

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ticket_pos
      POSTGRES_PASSWORD: ticket_pos
      POSTGRES_DB: ticket_pos
    ports:
      - "64632:5432"
    volumes:
      # Postgres 18 images keep PGDATA at /var/lib/postgresql/<major>/docker,
      # so the whole /var/lib/postgresql tree is the persisted path.
      - postgres_data_18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_pos -d ticket_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "64600:9000"
      - "64601:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_SERVER_URL: http://localhost:64600
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb local/ticket-pos --ignore-existing &&
      mc anonymous set download local/ticket-pos/covers &&
      mc anonymous set download local/ticket-pos/videos &&
      mc anonymous set download local/ticket-pos/logos &&
      mc anonymous set download local/ticket-pos/avatars
      "

  # One-shot schema migration. Stands in for the Cloud Run Job: same image as
  # the API, migrate entrypoint, database URL as its only required input.
  migrate:
    <<: *api-image
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    ports:
      - "64680:8080"
    environment:
      APP_ENV: production
      # Migrations are the migrate job's responsibility, never the server's.
      RUN_MIGRATIONS: "false"
      DATABASE_URL: *database-url
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:64600
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: ticket-pos
      S3_REGION: us-east-1
      # APP_ENV=production above means the API refuses to start without a
      # Confirmation Link signing key. A fixed, obviously-fake value keeps the
      # parity stack reproducible; it is not a secret and must never be a real
      # one, which is exactly why it is spelled out here rather than defaulted.
      CONFIRMATION_LINK_SECRET: parity-stack-not-a-real-secret
      # The Issuer's certificate key (#453): base64 of the 32 ASCII bytes
      # "parity-stack-not-a-real-key-0000", so a certificate uploaded to the
      # parity stack is encrypted under a key that is obviously not a secret.
      INVOICING_CERTIFICATE_KEY: cGFyaXR5LXN0YWNrLW5vdC1hLXJlYWwta2V5LTAwMDA=
      # Sale Invoicing OPEN here (#471, ADR 0060), unlike the shipped default:
      # the parity stack is where the House flow is walked against the SRI's
      # test environment before production opens the flag.
      SALE_INVOICING_ENABLED: "true"
      # Where the parity Storefront answers, so Confirmation Links are followable.
      STOREFRONT_BASE_URL: http://localhost:64603
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  storefront:
    build:
      # Repo root: the app transpiles workspace packages from packages/.
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        # Baked into the client bundle by `next build`; must be the URL the
        # browser can reach, not the Compose network name.
        NEXT_PUBLIC_API_URL: http://localhost:64680
    image: ticket-pos-storefront:parity
    ports:
      - "64603:3000"
    environment:
      # Server-side calls stay on the Compose network. This one is read at
      # runtime, so it belongs here rather than in build args.
      API_URL: http://api:8080
      # The parity staff app's PUBLISHED origin (64604, see the staff service
      # below) — the address a browser following the footer's "Create an event"
      # invitation can actually reach, not the Compose network name. The parity
      # Storefront spec asserts the link carries it.
      STAFF_BASE_URL: http://localhost:64604
      # The parity API above runs with no PAYPHONE_* credentials, so it selects
      # the stub Payment Provider — but this is a production build, where the
      # stub's payment interstitial is a 404 unless explicitly opted into
      # (apps/storefront/lib/stub-payments.ts). The opt-in is what keeps
      # checkout walkable on the parity stack; a real production deployment
      # sets neither this nor stub credentials.
      STOREFRONT_STUB_PAYMENTS: "1"
    depends_on:
      api:
        condition: service_healthy

  staff:
    build:
      # Repo root: the app transpiles workspace packages from packages/.
      context: .
      dockerfile: apps/staff/Dockerfile
    image: ticket-pos-staff:parity
    ports:
      - "64604:3001"
    environment:
      # Staff's browser bundle never calls the Go API directly - it calls
      # Staff's own route handlers, which hold the session cookie and proxy
      # onwards over the Compose network. So this is server-only and runtime,
      # and Staff needs no NEXT_PUBLIC_* build args at all.
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data_18:
  minio_data:
